services:
  waha:
    image: devlikeapro/waha:latest
    container_name: kytto-waha
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./sessions:/app/.sessions
      - ./files:/app/.sessions/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
