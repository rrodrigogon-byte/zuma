# CI/CD SetPoint Ultra — Google Cloud Build
# Deploy automático no Cloud Run com PostgreSQL
steps:
  # 1. Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/setpoint-ultra:$COMMIT_SHA', '.' ]

  # 2. Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/setpoint-ultra:$COMMIT_SHA' ]

  # 3. Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'setpoint-ultra'
      - '--image'
      - 'gcr.io/$PROJECT_ID/setpoint-ultra:$COMMIT_SHA'
      - '--region'
      - 'southamerica-east1' # São Paulo
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1024Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production,DB_HOST=$_DB_HOST,DB_USER=$_DB_USER,DB_PASS=$_DB_PASS,DB_NAME=$_DB_NAME'
      - '--add-cloudsql-instances'
      - '$_CLOUD_SQL_INSTANCE'

images:
  - 'gcr.io/$PROJECT_ID/setpoint-ultra:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
