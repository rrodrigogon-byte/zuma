# Kytto — pipeline de produção no Cloud Build
# Publica no Artifact Registry e atualiza o serviço kytto-erp em us-central1.

substitutions:
  # Alinhado ao serviço e à imagem existentes no projeto GCP.
  _REGION: us-central1
  _REPOSITORY: kytto-erp
  _IMAGE_NAME: app
  _SERVICE_NAME: kytto-erp
  _IMAGE_TAG: latest

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - .
    timeout: 900s

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}
    waitFor:
      - build-image

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      # Trocar a imagem sem sobrescrever escala, timeout, recursos, DB_* ou secrets.
      - --update-env-vars
      - PUBLIC_APP_URL=https://setpoint.kytto.com.br
    waitFor:
      - push-image

  - id: verify-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        SERVICE_URL="$$(gcloud run services describe ${_SERVICE_NAME} --region ${_REGION} --format='value(status.url)')"
        echo "Serviço publicado em: $$SERVICE_URL"
        for attempt in $$(seq 1 12); do
          if curl --fail --silent --show-error "$$SERVICE_URL/health"; then
            exit 0
          fi
          sleep 5
        done
        echo "Healthcheck não respondeu dentro do prazo." >&2
        exit 1
    waitFor:
      - deploy-cloud-run

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
