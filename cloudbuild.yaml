# Deploy do SetPoint no GCP Cloud Run (trigger no push à main).
#
# PRÉ-REQUISITOS (uma vez, no projeto GCP):
#   1) Bucket para o banco JSON durável (o disco do Cloud Run é efêmero):
#        gsutil mb -l us-central1 gs://agro-open-db
#   2) Segredo do JWT no Secret Manager (NÃO versionar segredo no repo):
#        printf '%s' "$(openssl rand -hex 32)" | gcloud secrets create setpoint-jwt-secret --data-file=-
#   3) Permitir que a service account de runtime do Cloud Run leia o segredo e
#      escreva no bucket (substitua PROJECT_NUMBER):
#        gcloud secrets add-iam-policy-binding setpoint-jwt-secret \
#          --member=serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com \
#          --role=roles/secretmanager.secretAccessor
#        gsutil iam ch serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com:objectAdmin gs://agro-open-db
#
# Observação: max-instances=1 é OBRIGATÓRIO — o banco JSON tem escrita única.
# A chave Pix (PIX_CHAVE) é o CNPJ de recebimento do clube, dado público impresso
# em todo BR Code — fica como env var; só o JWT_SECRET vai para o Secret Manager.
substitutions:
  _GCS_BUCKET: 'agro-open-db'

steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/agro-open:latest', '.']

  # Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agro-open:latest']

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'setpoint'
      - '--image=gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=1'
      # PORT é reservado pelo Cloud Run (o flag --port já o define) — não inclua aqui.
      - '--set-env-vars=NODE_ENV=production,DB_PATH=/tmp/db.json,GCS_BUCKET=${_GCS_BUCKET},PIX_CHAVE=43084070000188,PIX_NOME=AGROOPENTCC,PIX_CIDADE=TANGARADASERRA'
      - '--set-secrets=JWT_SECRET=setpoint-jwt-secret:latest'

images:
  - 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agro-open:latest'

options:
  logging: CLOUD_LOGGING_ONLY
