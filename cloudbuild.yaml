# SetPoint Ultra — pipeline de produção no Cloud Build
# Publica no Artifact Registry e atualiza o Cloud Run em southamerica-east1.

substitutions:
  _REGION: southamerica-east1
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE_NAME: setpoint-ultra

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest
      - .
    timeout: 900s

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}
    waitFor:
      - build-image

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'
      - --memory
      - 1Gi
      - --cpu
      - '1'
      - --min-instances
      - '0'
      - --max-instances
      - '10'
      - --concurrency
      - '80'
      - --timeout
      - 60s
      - --set-env-vars
      - NODE_ENV=production,PORT=8080,TZ=America/Cuiaba
    waitFor:
      - push-image

  - id: verify-health
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        SERVICE_URL="$$(gcloud run services describe ${_SERVICE_NAME} --region ${_REGION} --format='value(status.url)')"
        echo "Serviço publicado em: $$SERVICE_URL"
        for attempt in $$(seq 1 12); do
          if curl --fail --silent --show-error "$$SERVICE_URL/health"; then
            exit 0
          fi
          sleep 5
        done
        echo "Healthcheck não respondeu dentro do prazo." >&2
        exit 1
    waitFor:
      - deploy-cloud-run

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
