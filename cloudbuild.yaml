steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/agro-open:latest', '.']

  # Push da imagem para o Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/agro-open:latest']

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'agro-open'
      - '--image=gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=NODE_ENV=production,PORT=3000,DB_PATH=/data/db.json,PIX_CHAVE=43084070000188,PIX_NOME=AGRO OPEN TTC,PIX_CIDADE=TANGARA DA SERRA'

images:
  - 'gcr.io/$PROJECT_ID/agro-open:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/agro-open:latest'

options:
  logging: CLOUD_LOGGING_ONLY
