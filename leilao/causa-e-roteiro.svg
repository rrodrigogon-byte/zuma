<svg viewBox="0 0 1080 1528" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2E1C"/><stop offset="100%" stop-color="#0B2415"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7CE8A"/><stop offset="100%" stop-color="#C7A24C"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1528" fill="#F3F5EE"/>

  <!-- Header -->
  <rect width="1080" height="300" fill="url(#head)"/>
  <text x="64" y="118" font-size="15" letter-spacing="6" fill="#7FCB3B" font-weight="700">PROJETO SOCIAL · ESG</text>
  <text x="60" y="196" font-size="74" font-weight="900" fill="#F4F6EF" font-family="Arial Black, Arial">FLORESCER</text>
  <text x="64" y="244" font-size="20" fill="#9DBE86">Florescer Ação Social · iniciativa UISA · 4ª Agro Open · 12 SET 2026</text>

  <!-- A causa -->
  <text x="64" y="372" font-size="15" letter-spacing="4" fill="#5FB335" font-weight="800">A CAUSA</text>
  <text x="64" y="416" font-size="34" font-weight="900" fill="#0E2E1C" font-family="Arial Black, Arial">Transformar vidas em Mato Grosso.</text>
  <text x="64" y="462" font-size="19" fill="#3d4a36">O Florescer Ação Social é uma iniciativa da UISA que apoia mais</text>
  <text x="64" y="490" font-size="19" fill="#3d4a36">de 5.000 famílias em Nova Olímpia, Denise e região, por meio da</text>
  <text x="64" y="518" font-size="19" fill="#3d4a36">educação, cultura, esporte (inclusive beach tennis) e geração de renda.</text>
  <text x="64" y="552" font-size="17" fill="#5FB335" font-weight="700">Reconhecida entre as 100 Melhores ONGs do Brasil de 2024.</text>

  <!-- Impact stats -->
  <g transform="translate(64,584)">
    <rect x="0" y="0" width="300" height="130" rx="14" fill="#0E2E1C"/>
    <text x="150" y="62" text-anchor="middle" font-size="46" font-weight="900" fill="#7FCB3B">5.000+</text>
    <text x="150" y="98" text-anchor="middle" font-size="15" fill="#F4F6EF">famílias atendidas</text>
    <rect x="326" y="0" width="300" height="130" rx="14" fill="#5FB335"/>
    <text x="476" y="62" text-anchor="middle" font-size="46" font-weight="900" fill="#0B2415">3</text>
    <text x="476" y="98" text-anchor="middle" font-size="15" fill="#0B2415" font-weight="700">municípios de MT</text>
    <rect x="652" y="0" width="300" height="130" rx="14" fill="#C7A24C"/>
    <text x="802" y="62" text-anchor="middle" font-size="46" font-weight="900" fill="#0B2415">100%</text>
    <text x="802" y="98" text-anchor="middle" font-size="15" fill="#0B2415" font-weight="700">da renda à causa</text>
