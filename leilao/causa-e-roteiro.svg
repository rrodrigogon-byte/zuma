  <!-- Mesa box -->
  <g transform="translate(64,1180)">
    <rect x="0" y="0" width="952" height="150" rx="16" fill="#0E2E1C"/>
    <text x="40" y="56" font-size="16" letter-spacing="3" fill="#C7A24C" font-weight="700">MESA SOLIDÁRIA</text>
    <text x="40" y="112" font-size="56" font-weight="900" fill="#E7CE8A" font-family="Arial Black, Arial">R$ 7.000</text>
    <text x="430" y="70" font-size="20" fill="#F4F6EF" font-weight="700">Open food · 6 convidados</text>
    <text x="430" y="104" font-size="16" fill="#9DBE86">Reserve pelo (65) 99636-4113</text>
    <text x="430" y="128" font-size="16" fill="#9DBE86">silvester_natal@hotmail.com</text>
  </g>

  <rect x="0" y="1430" width="1080" height="98" fill="#0E2E1C"/>
  <text x="540" y="1488" text-anchor="middle" font-size="15" letter-spacing="2" fill="#9DBE86">FLORESCER AÇÃO SOCIAL · INICIATIVA UISA · 4ª AGRO OPEN · TANGARÁ TÊNIS CLUBE</text>
</svg>
