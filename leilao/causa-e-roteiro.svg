      <text x="130" y="40" font-weight="700">Recepção &amp; welcome drink</text>
      <text x="560" y="40" fill="#6b7861" font-size="16">Credenciamento das mesas e convidados VIP</text>
      <line x1="0" y1="62" x2="952" y2="62" stroke="#d6ddcb"/>
      <text x="0" y="102" font-weight="900" fill="#5FB335">20h00</text>
      <text x="130" y="102" font-weight="700">Jantar open food</text>
      <text x="560" y="102" fill="#6b7861" font-size="16">Menu premium servido às mesas</text>
      <line x1="0" y1="124" x2="952" y2="124" stroke="#d6ddcb"/>
      <text x="0" y="164" font-weight="900" fill="#5FB335">21h00</text>
