      <text x="560" y="164" fill="#6b7861" font-size="16">Apresentação da causa e resultados</text>
      <line x1="0" y1="186" x2="952" y2="186" stroke="#d6ddcb"/>
      <text x="0" y="226" font-weight="900" fill="#5FB335">21h30</text>
      <text x="130" y="226" font-weight="700">Leilão beneficente</text>
      <text x="560" y="226" fill="#6b7861" font-size="16">Lotes especiais com leiloeiro oficial</text>
      <line x1="0" y1="248" x2="952" y2="248" stroke="#d6ddcb"/>
      <text x="0" y="288" font-weight="900" fill="#5FB335">23h00</text>
      <text x="130" y="288" font-weight="700">Encerramento &amp; música</text>
      <text x="560" y="288" fill="#6b7861" font-size="16">Confraternização e networking</text>
      <line x1="0" y1="310" x2="952" y2="310" stroke="#d6ddcb"/>
