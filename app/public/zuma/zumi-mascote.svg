<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente Salmão do Corpo -->
    <linearGradient id="salmonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A30" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Gradiente da Barriga Salmão Claro -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>

    <!-- Gradiente Hashis de Bambu -->
    <linearGradient id="hashiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Brilho Dourado / Aura Ninja -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra Suave -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Aura de Velocidade Ninja -->
  <circle cx="250" cy="250" r="220" fill="url(#auraGlow)" />

  <!-- Nuvens Orientais de Velocidade (Vento Ninja) -->
  <path d="M 50 180 Q 90 160 130 180 Q 150 140 180 160 Q 210 180 180 200 Z" fill="#F8FAFC" opacity="0.07" />
  <path d="M 360 320 Q 400 300 440 320 Q 460 280 490 300 Q 520 320 490 340 Z" fill="#F8FAFC" opacity="0.07" />

  <!-- ================= HASHIS KATANA CRUZADOS NAS COSTAS ================= -->
  <g id="hashis-espadas" filter="url(#shadowFilter)">
    <!-- Hashi Esquerdo (inclinado -45°) -->
    <polygon points="120,60 135,68 335,390 320,398" fill="url(#hashiGrad)" rx="3" />
    <polygon points="110,45 125,53 140,80 125,72" fill="#B45309" /> <!-- Ponta Afiada -->
    
    <!-- Hashi Direito (inclinado +45°) -->
    <polygon points="380,60 365,68 165,390 180,398" fill="url(#hashiGrad)" rx="3" />
    <polygon points="390,45 375,53 360,80 375,72" fill="#B45309" /> <!-- Ponta Afiada -->
    
    <!-- Nó Dourado que prende os Hashis -->
    <circle cx="250" cy="225" r="14" fill="#F59E0B" stroke="#92400E" stroke-width="2" />
    <path d="M 242 225 Q 250 215 258 225 Q 250 235 242 225 Z" fill="#FEF3C7" />
  </g>

  <!-- ================= CAUDA DINÂMICA DE SALMÃO ================= -->
  <g id="cauda-salmao" filter="url(#shadowFilter)">
    <path d="M 170 320 C 130 360 80 400 70 440 C 110 425 150 400 190 365 C 220 410 260 435 285 440 C 265 390 230 350 200 330 Z" 
          fill="url(#salmonGrad)" stroke="#C2410C" stroke-width="3" stroke-linejoin="round" />
    <!-- Nervuras da Cauda -->
    <path d="M 185 345 Q 120 395 85 430" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round" />
    <path d="M 195 348 Q 235 395 270 430" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- ================= CORPO PRINCIPAL DO SALMÃO ZUMI ================= -->
  <g id="corpo-salmao" filter="url(#shadowFilter)">
    <!-- Formato hidrodinâmico, fofo e forte -->
    <ellipse cx="250" cy="260" rx="145" ry="120" fill="url(#salmonGrad)" stroke="#C2410C" stroke-width="4" />
    
    <!-- Barriguinha Salmão Suave -->
    <path d="M 160 300 C 180 360 320 360 340 300 C 310 340 190 340 160 300 Z" fill="url(#bellyGrad)" opacity="0.9" />

    <!-- Listras Brancas Estilo Corte Nobre de Sashimi (Marmoreio) -->
    <path d="M 170 190 Q 185 260 175 320" stroke="#FFFFFF" stroke-width="7" opacity="0.8" stroke-linecap="round" />
    <path d="M 215 175 Q 230 265 220 335" stroke="#FFFFFF" stroke-width="7" opacity="0.8" stroke-linecap="round" />
    <path d="M 265 175 Q 280 265 270 335" stroke="#FFFFFF" stroke-width="7" opacity="0.8" stroke-linecap="round" />
    <path d="M 315 190 Q 330 260 320 320" stroke="#FFFFFF" stroke-width="7" opacity="0.8" stroke-linecap="round" />
  </g>

  <!-- ================= NADADEIRAS LATERAIS NINJA ================= -->
  <g id="nadadeiras">
    <!-- Nadadeira Esquerda em Pose de Ação -->
    <path d="M 125 260 C 70 270 50 310 75 340 C 110 330 135 295 130 260 Z" 
          fill="url(#salmonGrad)" stroke="#C2410C" stroke-width="3" filter="url(#shadowFilter)" />
    <!-- Detalhe da nadadeira -->
    <path d="M 120 275 Q 85 305 78 330" stroke="#FFFFFF" stroke-width="3" opacity="0.6" stroke-linecap="round" />

    <!-- Nadadeira Direita Segurando um Niguiri Especial Zuma -->
    <g transform="translate(325, 230)" filter="url(#shadowFilter)">
      <path d="M 0 30 C 45 35 75 75 55 105 C 25 95 5 60 5 30 Z" 
            fill="url(#salmonGrad)" stroke="#C2410C" stroke-width="3" />
      
      <!-- Mini Niguiri Salmão Flambado na Mão do Zumi -->
      <g transform="translate(30, 45) scale(0.65)">
        <ellipse cx="25" cy="30" rx="30" ry="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" /> <!-- Arroz Shari -->
        <path d="M -5 20 C 5 5 45 5 55 20 C 60 30 50 35 25 35 C 0 35 -10 30 -5 20 Z" fill="#F97316" /> <!-- Fatia de Salmão -->
        <rect x="20" y="10" width="10" height="26" rx="2" fill="#111827" /> <!-- Tira de Alga Nori -->
        <!-- Brilho do Tarê -->
        <ellipse cx="28" cy="18" rx="4" ry="2" fill="#FEF08A" opacity="0.8" />
      </g>
    </g>
  </g>

  <!-- ================= ROSTINHO EXPRESSIVO DO ZUMI ================= -->
  <g id="rosto-zumi">
    <!-- Bochechas Coradas de Entusiasmo -->
    <ellipse cx="195" cy="275" rx="14" ry="8" fill="#F43F5E" opacity="0.45" />
    <ellipse cx="305" cy="275" rx="14" ry="8" fill="#F43F5E" opacity="0.45" />

    <!-- Olho Esquerdo (Grande, Kawaii, Expressivo e Ninja) -->
    <g transform="translate(190, 230)">
      <ellipse cx="15" cy="15" rx="17" ry="20" fill="#0F172A" />
      <!-- Brilhos no olho -->
      <circle cx="20" cy="8" r="7" fill="#FFFFFF" />
      <circle cx="10" cy="22" r="3.5" fill="#FFFFFF" />
      <!-- Sobrancelha Ninja Determinada -->
      <path d="M -5 -2 Q 15 -14 35 -4" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Olho Direito (Piscadinha Cúmplice / Amigável) -->
    <g transform="translate(280, 230)">
      <path d="M -5 18 Q 15 2 35 18" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round" fill="none" />
      <!-- Sobrancelha Ninja -->
      <path d="M -5 -2 Q 15 -10 35 -8" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" fill="none" />
    </g>

    <!-- Focinho / Boquinha Aberta Sorridente -->
    <g transform="translate(250, 275)">
      <path d="M -16 -4 Q 0 14 16 -4 Q 0 24 -16 -4 Z" fill="#991B1B" stroke="#0F172A" stroke-width="2.5" />
      <!-- Linguinha Fofa -->
      <path d="M -8 8 Q 0 4 8 8 Q 0 18 -8 8 Z" fill="#FB7185" />
    </g>
  </g>

  <!-- ================= FAIXA NINJA PRETA COM LOGO ZUMA ================= -->
  <g id="faixa-ninja" filter="url(#shadowFilter)">
    <!-- Faixa Principal na Testa -->
    <path d="M 125 185 C 170 160 330 160 375 185 L 370 215 C 325 190 175 190 130 215 Z" 
          fill="#111827" stroke="#000000" stroke-width="2.5" />
    
    <!-- Filetes Dourados de Acabamento na Faixa -->
    <path d="M 132 188 C 175 165 325 165 368 188" stroke="#F59E0B" stroke-width="2" fill="none" />
    <path d="M 135 210 C 175 187 325 187 365 210" stroke="#F59E0B" stroke-width="2" fill="none" />

    <!-- Placa Frontal Metálica com Inscrição ZUMA -->
    <g transform="translate(210, 168)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5" />
      <!-- Rebites nos cantos -->
      <circle cx="5" cy="5" r="1.5" fill="#94A3B8" />
      <circle cx="75" cy="5" r="1.5" fill="#94A3B8" />
      <circle cx="5" cy="23" r="1.5" fill="#94A3B8" />
      <circle cx="75" cy="23" r="1.5" fill="#94A3B8" />
      <!-- Texto ZUMA -->
      <text x="40" y="20" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" 
            fill="#F8FAFC" text-anchor="middle" letter-spacing="2">ZUMA</text>
    </g>

    <!-- Pontas da Faixa Esvoaçantes ao Vento (à Direita) -->
    <path d="M 370 200 C 410 180 430 210 465 195 C 445 220 420 215 390 230 C 375 220 370 205 370 200 Z" 
          fill="#111827" stroke="#000000" stroke-width="2" />
    <path d="M 368 208 C 395 235 435 225 455 250 C 430 255 405 240 380 238 Z" 
          fill="#0F172A" stroke="#000000" stroke-width="2" />
  </g>

  <!-- Brilhos Estrelados de Sushi Fresco -->
  <g fill="#FEF08A" opacity="0.8">
    <polygon points="120,130 125,140 135,145 125,150 120,160 115,150 105,145 115,140" />
    <polygon points="380,120 384,128 392,132 384,136 380,144 376,136 368,132 376,128" />
  </g>
</svg>
