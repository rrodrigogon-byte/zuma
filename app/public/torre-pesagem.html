<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
/* ===== Pista de Pesagem Interativa & Tela Cheia ===== */
.pista-hero-card {
  border-color: var(--line);
  background: var(--panel);
  overflow: hidden;
  transition: all .2s ease;
  margin-bottom: 14px;
}
.pista-wrap {
  background: #0D0F11;
  border-radius: 0 0 var(--r) var(--r);
  padding: 12px 14px 14px;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.pista-svg-container {
  width: 100%;
  max-width: 1480px;
  position: relative;
  user-select: none;
}
.pista-svg-container svg {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 6px;
}
.interactive-hover {
  cursor: pointer;
  transition: filter .15s ease, transform .15s ease;
}
.interactive-hover:hover {

}
.celula-btn {

  transition: all .15s ease;

  filter: drop-shadow(0 0 8px #FF7000);
}

  fill: #FFA24C;

}
.fs-floating-pill {
  position: fixed;

  border: 1.5px solid #FF7000;

.fs-floating-pill:hover {

  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(255,112,0,0.4);
}
body.is-fullscreen .fs-floating-pill {
  display: inline-flex;
}
body.is-fullscreen .topbar {
  padding-right: 220px;
}
body.is-fullscreen .view {
  max-width: 100%;
  padding: 12px 18px 30px;
}

<title>Torre de Pesagem Serrano</title>
<meta name="kyttoia:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sala de controle. Trilho de módulos à esquerda, faixa de status ao vivo no topo,
   área de trabalho por módulo, copiloto de IA deslizando à direita. Dark-first (sala de controle),
   com variante clara. Laranja Serrano só para "em ação"; verde/âmbar/vermelho só para status. */
:root{
  --bg:#0D0F11; --panel:#15181B; --panel-2:#1C2024; --panel-3:#23282D; --line:#2A2F34;
  --fg:#ECEAE6; --fg-2:#A9ADB2; --fg-3:#80868C;
  --brand:#FF7A1A; --brand-ink:#FF9445; --brand-soft:rgba(255,122,26,.14); --on-brand:#16181B;
  --ok:#3DBE74; --ok-soft:rgba(61,190,116,.14); --warn:#E0A33A; --warn-soft:rgba(224,163,58,.15);
  --crit:#EF5B52; --crit-soft:rgba(239,91,82,.15); --info:#5B9BE0; --info-soft:rgba(91,155,224,.15);
  --map-ground:#101315; --map-zone:#181C20; --map-zone-2:#1F2429; --map-road:#2B3036; --map-line:#3A4047; --water:#16324A;
  --cam:#050607; --cam-fg:#C9D1C9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F2EF; --panel:#FFFFFF; --panel-2:#F2F0EC; --panel-3:#E8E5E0; --line:#E0DCD6;
  --fg:#16181B; --fg-2:#4A4E54; --fg-3:#6B6F75;
  --brand:#FF7000; --brand-ink:#B34700; --brand-soft:#FFF0E3; --on-brand:#16181B;
  --ok:#1A7A43; --ok-soft:#E5F3EA; --warn:#9A6412; --warn-soft:#FBF0DC; --crit:#C8322B; --crit-soft:#FBE7E5; --info:#2B6CB0; --info-soft:#E6EFF9;
  --map-ground:#ECE9E4; --map-zone:#FFFFFF; --map-zone-2:#F5F3EF; --map-road:#D6D1CA; --map-line:#C2BCB4; --water:#BCD3E6;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F2EF; --panel:#FFFFFF; --panel-2:#F2F0EC; --panel-3:#E8E5E0; --line:#E0DCD6;
  --fg:#16181B; --fg-2:#4A4E54; --fg-3:#6B6F75;
  --brand:#FF7000; --brand-ink:#B34700; --brand-soft:#FFF0E3; --on-brand:#16181B;
  --ok:#1A7A43; --ok-soft:#E5F3EA; --warn:#9A6412; --warn-soft:#FBF0DC; --crit:#C8322B; --crit-soft:#FBE7E5; --info:#2B6CB0; --info-soft:#E6EFF9;
  --map-ground:#ECE9E4; --map-zone:#FFFFFF; --map-zone-2:#F5F3EF; --map-road:#D6D1CA; --map-line:#C2BCB4; --water:#BCD3E6;
  color-scheme:light}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-3)} .dim{color:var(--fg-2)}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ===== Shell Unificado e Otimizado CCO (Elimina menu duplo e tela dentro de tela) ===== */
.shell{display:flex;flex-direction:column;height:100vh;width:100%;overflow:hidden;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0;flex-wrap:wrap;flex-shrink:0;z-index:10}
.torre-brand{display:flex;align-items:center;gap:10px}
.torre-logo-icon{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,#FF7000 0%,#D95300 100%);box-shadow:0 2px 6px rgba(255,112,0,0.28)}
.torre-brand-title{display:flex;align-items:center;gap:8px;line-height:1.1}
.torre-brand-title b{font-family:var(--display);font-size:17px;font-weight:800;letter-spacing:0.03em;color:var(--fg);text-transform:uppercase}
.torre-brand-title .live-pill{font:700 9.5px var(--mono);background:rgba(61,190,116,0.15);color:#3DBE74;border:1px solid rgba(61,190,116,0.3);padding:2px 7px;border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.torre-brand-sub{font:500 10.5px var(--mono);color:var(--fg-3);margin-top:2px}
/* Menu Unificado da Torre: Barra Horizontal de Abas */
.rail{display:flex;align-items:center;gap:6px;overflow-x:auto;padding:6px 14px;background:var(--panel-2);border-bottom:1px solid var(--line);scrollbar-width:thin;flex-shrink:0}
.rail .mark, .rail .sp{display:none!important}
.rail button{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg-2);font:600 11.5px var(--body);cursor:pointer;white-space:nowrap;position:relative;transition:all .15s ease;width:auto;min-width:0}
.rail button svg.i{width:14px;height:14px}
.rail button:hover{background:var(--panel-3);color:var(--fg);border-color:var(--fg-3)}
.rail button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand);font-weight:700;box-shadow:0 1px 4px rgba(255,112,0,0.18)}
.rail button[aria-current="page"]::before{display:none!important}
.rail .badge{position:static;margin-left:4px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font:700 10px/16px var(--mono);padding:0 5px;display:inline-block}
.live-strip{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
/* Áreas de Ações CCO */
.torre-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ls{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-align:left}
.ls b{font:600 11.5px var(--body);display:block;line-height:1.2}
.ls small{font:500 10px var(--mono);color:var(--fg-3);display:block;line-height:1.2;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls .w{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.off{background:var(--fg-3)} .dot.brand{background:var(--brand)}
.dot.pulse{box-shadow:0 0 0 0 currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(61,190,116,.5)}70%{box-shadow:0 0 0 7px rgba(61,190,116,0)}100%{box-shadow:0 0 0 0 rgba(61,190,116,0)}}
.clock{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 6px 4px 10px}
.clock .t{font:700 18px/1 var(--display);letter-spacing:.02em}
.speed{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.speed button{border:0;background:none;padding:3px 7px;font:600 11px var(--mono);cursor:pointer;color:var(--fg-3)}
.speed button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ai-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand-ink);border-radius:8px;padding:6px 11px;font-weight:600;font-size:12px;cursor:pointer}
.ai-btn kbd{font:500 10px var(--mono);border:1px solid currentColor;border-radius:4px;padding:0 3px;opacity:.7}
.work{flex:1;min-width:0;min-height:0;overflow-y:auto;position:relative;background:var(--bg)}
.view{padding:12px 14px 28px;display:grid;gap:12px;align-content:start;max-width:100%}
.vh{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.vh h1{font-size:28px;text-transform:uppercase;letter-spacing:.01em}
.vh p{color:var(--fg-2);font-size:13px;margin-top:2px;max-width:80ch}
.vh .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.replay-banner{display:flex;align-items:center;gap:10px;background:var(--info-soft);color:var(--info);border-radius:8px;padding:8px 12px;font-weight:600}

/* ===== Básicos ===== */
.btn{font:600 12.5px/1 var(--body);border-radius:6px;padding:8px 12px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--fg-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.ghost{background:none}
.btn.danger{color:var(--crit);border-color:var(--crit);background:none}
.btn.okb{color:var(--ok);border-color:var(--ok);background:none}
.btn.sm{padding:5px 9px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg.i{width:14px;height:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}
.card-h h3{font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px}
.lbl{font:600 10px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--body);padding:4px 8px;border-radius:999px;white-space:nowrap;background:var(--panel-3);color:var(--fg-2)}
.pill.nodot::before{display:none}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--info-soft);color:var(--info)} .p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.tag{font:600 10.5px var(--mono);padding:2px 6px;border-radius:4px;background:var(--panel-3);color:var(--fg-2)}
.plate{font:600 11.5px var(--mono);background:var(--fg);color:var(--bg);padding:2px 6px;border-radius:3px;white-space:nowrap;display:inline-block}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1fr) 380px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;display:grid;gap:5px;align-content:start}
.kpi b{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi b em{font-style:normal;font-size:14px;color:var(--fg-3);font-weight:600;margin-left:3px}
.kpi span{font-size:11.5px;color:var(--fg-2);line-height:1.35}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font:600 10px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
.bar{height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.crit{background:var(--crit)} .bar i.info{background:var(--info)} .bar i.n{background:var(--fg-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-size:12px;cursor:pointer;border-right:1px solid var(--line);color:var(--fg-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:12.5px;width:100%}
textarea{resize:vertical;min-height:56px}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
.sw input{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--panel-3);position:relative;cursor:pointer;flex:none;transition:background .2s;border:1px solid var(--line)}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--brand);border-color:var(--brand)}
.sw input:checked::after{left:18px}
.chart text{font:500 10px var(--mono);fill:var(--fg-3)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--fg-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:8px;border-radius:2px;display:inline-block}
.empty{padding:18px;color:var(--fg-3);text-align:center}

/* ===== Feed de eventos / IA ===== */
.feed{display:grid;max-height:520px;overflow-y:auto}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);animation:slidein .35s ease-out}
@keyframes slidein{from{background:var(--brand-soft)}to{background:transparent}}
.ev time{font:600 11px var(--mono);color:var(--fg-3);padding-top:1px}
.ev b{font-weight:600;font-size:12.5px;display:block}
.ev small{color:var(--fg-2);font-size:11.5px;line-height:1.4;display:block}
.ev .ai{font:700 9.5px var(--mono);letter-spacing:.06em;color:var(--brand-ink);background:var(--brand-soft);padding:1px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}
.ev.crit b{color:var(--crit)} .ev.warn b{color:var(--warn)}
.ev .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

/* ===== Mapa ===== */
.map-wrap{position:relative;background:var(--map-ground);border-radius:0 0 var(--r) var(--r);overflow:hidden}
.map{display:block;width:100%;height:auto}
.map .zone{fill:var(--map-zone);stroke:var(--map-line);stroke-width:1}
.map .zone2{fill:var(--map-zone-2);stroke:var(--map-line);stroke-width:1;stroke-dasharray:4 3}
.map .road{fill:none;stroke:var(--map-road);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.map .lane{fill:none;stroke:var(--map-line);stroke-width:1.2;stroke-dasharray:8 8}
.map .zl{font:600 11px var(--mono);fill:var(--fg-3);letter-spacing:.06em;text-transform:uppercase}
.map .zv{font:700 15px var(--display);fill:var(--fg)}
.map .scale-deck{fill:var(--map-zone-2);stroke:var(--brand);stroke-width:2}
.map .silo{fill:var(--map-zone-2);stroke:var(--map-line)}
.map .silo-fill{fill:var(--fg-3);opacity:.55}
.map .pile{fill:#B08C5A;opacity:.85}
.map .water{fill:var(--water)}
.tk{transition:transform 1s linear;cursor:pointer}
.tk .body{stroke:var(--map-ground);stroke-width:2}
.tk text{font:700 9.5px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--map-ground);stroke-width:3px}
.tk.sel .ring{stroke:var(--brand);stroke-width:2;fill:none}
.map-legend{position:absolute;left:10px;bottom:10px;display:flex;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11px;color:var(--fg-2)}
.map-legend span{display:inline-flex;gap:5px;align-items:center}
.pop{position:absolute;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 40px -16px rgba(0,0,0,.6);padding:12px;display:grid;gap:8px;z-index:4;font-size:12px}
.pop .row{display:flex;justify-content:space-between;gap:8px}
.pop .row span{color:var(--fg-3)}
.replay{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.replay input[type=range]{flex:1;accent-color:var(--brand)}
.replay .rt{font:700 16px var(--display);min-width:46px}

/* ===== Pesagem autônoma ===== */
.cams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cam{position:relative;background:var(--cam);border-radius:6px;overflow:hidden;aspect-ratio:16/10;max-width:100%}
.cam svg{position:absolute;inset:0;width:100%;height:100%}
.cam::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);pointer-events:none}
.cam .ov{position:absolute;left:8px;top:6px;right:8px;display:flex;justify-content:space-between;font:600 10px var(--mono);color:var(--cam-fg);text-shadow:0 1px 2px #000;z-index:1}
.cam .rec{color:#EF5B52}
.cam .ocr{position:absolute;left:8px;bottom:6px;font:600 11px var(--mono);color:#7CF29C;text-shadow:0 1px 2px #000;z-index:1}
.ind{background:var(--cam);border-radius:var(--r);padding:12px 16px;display:grid;gap:6px;color:#C9CBCE}
.ind-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:500 10.5px var(--mono)}
.ann{padding:2px 6px;border:1px solid #2A2D31;border-radius:3px;color:#5D6166;font:600 10px var(--mono);letter-spacing:.04em}
.ann.on{color:#FF8A1F;border-color:#FF8A1F}
.ann.on.okc{color:#3DBE74;border-color:#3DBE74}
.ann.on.bad{color:#EF5B52;border-color:#EF5B52}
.readout{display:flex;align-items:baseline;justify-content:flex-end;gap:10px;font:700 clamp(48px,6vw,84px)/1 var(--mono);color:#FF8A1F;font-variant-numeric:tabular-nums;letter-spacing:-.02em;text-shadow:0 0 18px rgba(255,138,31,.25)}
.readout small{font-size:20px;color:#5A4632;font-weight:600}
.ind-foot{display:flex;justify-content:space-between;gap:10px;font:500 11px var(--mono);color:#8F9399;flex-wrap:wrap}
.ind-foot b{color:#E3E1DC;font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.pipe div{display:grid;gap:5px;font-size:10.5px;color:var(--fg-3);line-height:1.25;align-content:start}
.pipe div::before{content:"";height:4px;border-radius:2px;background:var(--panel-3)}
.pipe div.done{color:var(--fg-2)} .pipe div.done::before{background:var(--fg-2)}
.pipe div.cur{color:var(--fg);font-weight:600} .pipe div.cur::before{background:var(--brand);animation:blink 1s infinite}
.pipe div.stop{color:var(--crit);font-weight:600} .pipe div.stop::before{background:var(--crit)}
@keyframes blink{50%{opacity:.4}}
.axles{display:grid;gap:8px}
.ax{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:12px}
.ax .bar{height:10px;position:relative;overflow:visible}
.ax .bar .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg)}
.ax .bar .tol{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--crit)}
.dossier{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}
.kv{display:grid;gap:2px;min-width:0}
.kv b{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.checks{display:grid;gap:6px}
.chk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:6px;background:var(--panel-2)}
.chk.ok{background:var(--ok-soft)} .chk.warn{background:var(--warn-soft)} .chk.crit{background:var(--crit-soft)}
.chk .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 11px var(--mono);color:#fff;background:var(--fg-3)}
.chk.ok .ic{background:var(--ok)} .chk.warn .ic{background:var(--warn)} .chk.crit .ic{background:var(--crit)}
.chk b{display:block;font-size:12.5px}
.chk small{color:var(--fg-2);font-size:11.5px;line-height:1.4;display:block}
.chk .num{font-size:12px;font-weight:600;white-space:nowrap}
.phone{width:100%;max-width:300px;background:#0B141A;border-radius:18px;padding:10px;border:6px solid #23282D;display:grid;gap:6px;font-size:12px;color:#E9EDEF;justify-self:center}
.phone .ph-h{display:flex;gap:8px;align-items:center;padding:4px 4px 8px;border-bottom:1px solid #222D34}
.phone .ph-h b{font-size:12.5px}
.msg{background:#202C33;border-radius:8px;padding:7px 9px;max-width:90%;line-height:1.4}
.msg.me{background:#005C4B;justify-self:end}
.msg time{display:block;text-align:right;font-size:9.5px;color:#8696A0;margin-top:2px}
.msg .qr{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.msg .qr span{border:1px solid #2A3942;border-radius:12px;padding:2px 8px;font-size:11px;color:#53BDEB}

/* ===== Agenda ===== */
.agenda{display:grid;grid-template-columns:170px minmax(0,1fr);font-size:11.5px;min-width:760px}
.ag-h{display:grid;font:500 10px var(--mono);color:var(--fg-3);border-bottom:1px solid var(--line);height:24px;align-items:center}
.ag-lab{padding:0 10px;display:flex;flex-direction:column;justify-content:center;height:46px;border-bottom:1px solid var(--line)}
.ag-lab b{font:600 12px var(--mono)} .ag-lab small{color:var(--fg-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-tr{position:relative;height:46px;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px)}
.slot{position:absolute;top:8px;height:30px;border-radius:4px;font-size:10px;font-weight:600;display:flex;align-items:center;padding:0 5px;white-space:nowrap;overflow:hidden;background:var(--panel-3);color:var(--fg-2)}
.slot.live{background:var(--brand);color:var(--on-brand)}
.slot.fut{background:transparent;border:1.5px dashed var(--fg-3);color:var(--fg-2)}
.slot.exc{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:2}

/* ===== Gaveta & Copiloto ===== */
.scrim{position:fixed;inset:0;background:rgba(5,6,7,.55);z-index:30;display:flex;justify-content:flex-end}

.qr-code{width:84px;height:84px;background:var(--fg);border-radius:4px;flex:none}

.copilot{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:25;display:flex;flex-direction:column;box-shadow:-24px 0 50px -24px rgba(0,0,0,.6);padding-bottom:env(safe-area-inset-bottom,0px)}

.cp-h small{display:block;font:500 10.5px var(--mono);color:var(--fg-3)}
.cp-h .x{margin-left:auto}
.cp-body{flex:1;overflow-y:auto;padding:14px 16px;display:grid;gap:12px;align-content:start}
.bub{padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.u{background:var(--brand-soft);color:var(--fg);justify-self:end;max-width:88%}
.bub.a{background:var(--panel-2);max-width:96%}

.cp-sugs{display:flex;gap:6px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:40;max-width:min(520px,90vw);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const DEC={}; // tripId -> {acao,at,user,just}

function needsDecision(t){return t.anom&&ANOM[t.anom.k].acoes.length>0;}

/* =====================================================================

   ===================================================================== */
function stateAt(t,T){
  if(T<t.arr-3) return null;
  if(!holdAfter(t,T)&&T>=exitStart(t)+3.5) return null;
  if(T<t.arr) return {k:'chegando'};
  if(T<t.p1) return {k:'fila'};
  if(T<t.p1e) return {k:'balanca',fase:1,f:(T-t.p1)/W};
  if(T<t.p2) return {k:'patio'};
  if(T<t.p2e) return {k:'balanca',fase:2,f:(T-t.p2)/W};
  if(holdAfter(t,T)) return {k:'excecao'};
  return {k:'saindo'};
}
function holdAfter(t,T){ // após a 2ª pesagem, aguarda decisão na baia de exceção
  if(!t.anom||t.anom.fase!==2||!needsDecision(t)) return false;
  if(T<t.p2e) return false;
  const d=DEC[t.id]; return !d||d.at>T;
}
function exitStart(t){const d=DEC[t.id];return (t.anom&&t.anom.fase===2&&needsDecision(t)&&d)?Math.max(t.p2e,d.at):t.p2e;}
function onScale(bal,T){return TRIPS.find(t=>t.bal===bal&&((T>=t.p1&&T<t.p1e)||(T>=t.p2&&T<t.p2e)));}
function queueAt(bal,T){return TRIPS.filter(t=>t.bal===bal&&T>=t.arr&&T<t.p1).sort((a,b)=>a.arr-b.arr);}
function yardAt(bal,T){return TRIPS.filter(t=>t.bal===bal&&T>=t.p1e&&T<t.p2).sort((a,b)=>a.p1-b.p1);}
function nextAt(bal,T){return TRIPS.filter(t=>t.bal===bal&&t.arr>T).sort((a,b)=>a.arr-b.arr);}
function ticketsAt(T){return TRIPS.filter(t=>t.p2e<=T).sort((a,b)=>b.p2-a.p2);}
function liq(t){return Math.abs(t.bruto-t.tara);}
function tStatus(t,T){
  if(!t.anom||t.anom.k==='posicao') return 'ok';
  const d=decided(t,T);
  if(!d) return 'pendente';
  return {autorizar:'excesso',ajustar:'ajustado',refazer:'refeito',aceitar:t.anom.k==='nf'?'divergencia':'aceito',confirmar:'aceito',recusar:'recusado',repesar:'refeito'}[d.acao]||'aceito';
}
const TST={ok:['p-ok','Normal'],pendente:['p-crit','Aguarda decisão'],excesso:['p-crit','Excesso autorizado'],ajustado:['p-warn','Ajustado e repesado'],refeito:['p-warn','Repesado'],divergencia:['p-warn','Divergência aceita'],aceito:['p-info','Aceito pelo operador'],recusado:['p-crit','Recusado']};
function expected(t){if(t.docKg)return t.docKg;const m=MATS[t.mat];return t.vol&&m.dens?Math.round(t.vol*m.dens*1000):null;}
function limits(cfg){const c=CONFIGS[cfg];return {pbt:c.pbt,fiscal:Math.round(c.pbt*(1+RULES.tolPbt/100))};}
function axleLoads(t,w){ // distribuição estimada por grupo de eixos (plataforma em 3 módulos)
  const c=CONFIGS[t.cfg];const sum=c.pbt;const r2=rngFrom(parseInt(t.id.slice(1))*97);
  let ws=c.groups.map((g,i)=>g[1]/sum*(1+(i===0?-0.10:0.03)+(r2()-.5)*0.06));
  const k=ws.reduce((a,b)=>a+b,0);ws=ws.map(x=>x/k*w);
  return c.groups.map((g,i)=>({nome:g[0],lim:g[1],w:ws[i]}));
}
function evaluate(t){
  const out=[];const lim=limits(t.cfg);const L=liq(t);const exp=expected(t);
  if(t.bruto>lim.fiscal) out.push({sev:'crit',t:'Excesso de peso (PBT)',d:`${CONFIGS[t.cfg].nome}: limite ${kg(lim.pbt)} + ${RULES.tolPbt}% = ${kg(lim.fiscal)}. Excesso de ${kg(t.bruto-lim.fiscal)}.`,v:kg(t.bruto)});
  else if(t.bruto>lim.pbt) out.push({sev:'warn',t:'Dentro da tolerância de PBT',d:`Acima do PBT legal (${kg(lim.pbt)}).`,v:kg(t.bruto)});
  else out.push({sev:'ok',t:'Conforme Lei da Balança',d:`${CONFIGS[t.cfg].nome}: PBT ${kg(lim.pbt)}.`,v:kg(t.bruto)});
  const ax=axleLoads(t,t.bruto).filter(a=>a.w>a.lim*(1+RULES.tolEixo/100));
  if(ax.length) out.push({sev:'warn',t:'Excesso por eixo',d:ax.map(a=>`${a.nome}: ${kg(a.w)} (limite ${kg(a.lim)})`).join(' · '),v:ax.length+' grupo'+(ax.length>1?'s':'')});
  if(exp){const dv=(L-exp)/exp*100;out.push({sev:Math.abs(dv)>RULES.tolDoc?'warn':'ok',t:Math.abs(dv)>RULES.tolDoc?`Divergência com ${t.docTipo}`:`Líquido confere com ${t.docTipo}`,d:`Esperado ${kg(exp)} (${esc(t.doc)}). Tolerância ±${RULES.tolDoc}%.`,v:pct(dv)});}
  if(t.mat==='CONC'){const d=L/t.vol/1000;out.push({sev:(d<RULES.densMin||d>RULES.densMax)?'warn':'ok',t:'Massa específica do concreto',d:`${t.vol} m³ → ${fmt(d,3)} t/m³ (faixa ${fmt(RULES.densMin,2)}–${fmt(RULES.densMax,2)}).`,v:fmt(d,2)+' t/m³'});}
  const v=veh(t.placa);const dt=(t.tara-v.tara)/v.tara*100;
  out.push({sev:Math.abs(dt)>RULES.tolTara?'crit':'ok',t:Math.abs(dt)>RULES.tolTara?'Tara fora do padrão do veículo':'Tara confere com o histórico',d:`Média de 30 pesagens: ${kg(v.tara)}. Tolerância ±${RULES.tolTara}%.`,v:pct(dt)});
  return out;
}

function weightAt(t,fase,f){
  const target=fase===1?(loadsHere(t.op)?t.tara:t.bruto):(loadsHere(t.op)?t.bruto:t.tara);
  if(f<0.26) return 0;
  if(f<0.5){const x=(f-0.26)/0.24;return target*(1-Math.pow(1-x,3));}
  if(f>0.95) return target*Math.max(0,1-(f-0.95)/0.05);
  let w=target+target*0.004*Math.exp(-(f-0.5)*18)*Math.sin(f*90);
  if(t.anom&&t.anom.k==='pessoa'&&fase===2) w+=60*Math.sin(f*70);
  return w;
}

function along(pts,f){f=clamp(f,0,1);const segs=[];let tot=0;for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);segs.push(d);tot+=d;}
  let d=f*tot;for(let i=0;i<segs.length;i++){if(d<=segs[i]){const k=segs[i]?d/segs[i]:0;return [lerp(pts[i][0],pts[i+1][0],k),lerp(pts[i][1],pts[i+1][1],k)];}d-=segs[i];}return pts[pts.length-1];}
function posAt(t,T){
  const M=MAP[t.site]; const s=stateAt(t,T); if(!s) return null;
  if(s.k==='chegando') return {xy:along(M.approach,(T-(t.arr-3))/3),k:'fila'};
  if(s.k==='fila'){const q=queueAt(t.bal,T);const i=q.indexOf(t);return {xy:M.queueSlot(i),k:'fila'};}
  if(s.k==='balanca') return {xy:s.f<0.12?along([M.scaleIn,M.scale],s.f/0.12):M.scale,k:'balanca'};
  if(s.k==='patio'){const z=M.zone(t);const a=T-t.p1e,b=t.p2-T;
    if(a<1.5) return {xy:along(z,a/1.5),k:'patio'};
    if(b<1.5) return {xy:along(z.slice().reverse(),1-b/1.5),k:'patio'};
    return {xy:z[z.length-1],k:'patio'};}
  if(s.k==='excecao') return {xy:along([M.scale,M.bay],(T-t.p2e)/0.8),k:'excecao'};
  const es=exitStart(t); const fromBay=es>t.p2e+0.01;
  if(T<es) return {xy:M.scale,k:'saindo'};
  const p=fromBay?M.exitBay:M.exit; const f=(T-es)/3.5; if(f>1) return null;
  return {xy:along(p,f),k:'saindo'};
}

function queueChart(T,h=170){
  const W2=640,pl=34,pb=20,pt=10; const t0=DAY0,t1=DAY1; const X=t=>pl+(W2-pl-8)*(t-t0)/(t1-t0);
  const series=Object.keys(SCALES).map(b=>{const pts=[];for(let t=t0;t<=t1;t+=10){pts.push([t,queueAt(b,t).length+yardAt(b,t).length*0.0]);}return {b,pts};});
  const ymax=Math.max(4,...series.flatMap(s=>s.pts.map(p=>p[1])));
  const Y=v=>pt+(h-pt-pb)*(1-v/ymax);
  const col={'BAL-01':'var(--brand)','BAL-02':'var(--info)'};
  const path=(pts)=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const grid=[0,Math.ceil(ymax/2),ymax].map(v=>`<line x1="${pl}" x2="${W2-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+3}" text-anchor="end">${v}</text>`).join('');
  const hrs=[6,8,10,12,14,16,18].map(hh=>`<text x="${X(hh*60)}" y="${h-5}" text-anchor="middle">${hh}h</text>`).join('');
  const lines=series.map(s=>{const a=s.pts.filter(p=>p[0]<=T),b=s.pts.filter(p=>p[0]>=T-10);
    return `<path d="${path(a)}" fill="none" stroke="${col[s.b]}" stroke-width="2"/><path d="${path(b)}" fill="none" stroke="${col[s.b]}" stroke-width="2" stroke-dasharray="4 4" opacity=".75"/>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W2} ${h}" width="100%" role="img" aria-label="Fila por balança ao longo do dia">${grid}${hrs}
   <rect x="${X(T)}" y="${pt}" width="${W2-8-X(T)}" height="${h-pt-pb}" fill="var(--panel-2)" opacity=".5"/>${lines}
   <line x1="${X(T)}" x2="${X(T)}" y1="${pt}" y2="${h-pb}" stroke="var(--crit)" stroke-width="1.5"/><text x="${X(T)+4}" y="${pt+9}" style="fill:var(--crit)">agora</text></svg>`;
}

      .map(([n,v,c,sub])=>{const r=v/c;return `<div style="display:grid;gap:5px"><div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">${n}</b><span class="num">${ton(v,0)} · ${fmt(r*100)}%</span></div><div class="bar"><i class="${r<.25?'crit':r<.4?'warn':'n'}" style="width:${clamp(r*100,0,100)}%"></i></div><small class="muted">${sub}</small></div>`;}).join('');}

function queueSuggestion(T){
  const out=[];
  Object.keys(SCALES).forEach(b=>{let best={n:0,t:0};for(let t=T+10;t<=Math.min(DAY1,T+180);t+=5){const n=queueAt(b,t).length;if(n>best.n)best={n,t};}
    if(best.n>=2){const q=queueAt(b,best.t);const mv=q[q.length-1];const key=b+mv.id;
      out.push(`<div class="chk ${S.applied[key]?'ok':'warn'}"><span class="ic">${S.applied[key]?'✓':'!'}</span><div><b>Pico previsto na ${b} às ${hm(best.t)}: ${best.n} veículos</b><small>${S.applied[key]?'Nova janela enviada por WhatsApp para '+mv.placa+'.':`Antecipar ${mv.placa} (${OPS[mv.op].toLowerCase()}) para ${hm(best.t-25)} reduz a espera estimada em ~${Math.round(best.n*2.5)} min.`}</small></div>${S.applied[key]?'<span></span>':`<button class="btn sm" type="button" data-apply="${key}" data-placa="${mv.placa}" data-hora="${hm(best.t-25)}">Aplicar</button>`}</div>`);}});
  return out.join('')||`<div class="chk ok"><span class="ic">✓</span><div><b>Sem pico de fila nas próximas 3 horas</b><small>Previsão pela agenda de janelas e pelo histórico de 30 dias.</small></div><span></span></div>`;
}

function toggleFullscreen() {
  const doc = document;
  const isFs = doc.fullscreenElement || doc.webkitFullscreenElement || doc.mozFullScreenElement || doc.msFullscreenElement;
  if (!isFs) {
    const el = doc.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();
  } else {
    if (doc.exitFullscreen) doc.exitFullscreen().catch(() => {});
    else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
    else if (doc.mozCancelFullScreen) doc.mozCancelFullScreen();
    else if (doc.msExitFullscreen) doc.msExitFullscreen();
  }
}

              <label class="btn sm" style="cursor:pointer">${ic('cam')}Escolher foto<input type="file" id="ocr-file" accept="image/jpeg,image/png,image/webp" hidden></label><div id="ocr-out"></div></div></div>

        <div class="card"><div class="card-h"><h3>Próximos nesta balança</h3></div><div id="p-next"></div></div>
      </div>
    </div>`;
  },
  live(){
    const T=VT(); const sc=SCALES[S.bal]; const t=onScale(S.bal,T); const st=t?stateAt(t,T):null;
    const f=st?st.f:0, fase=st?st.fase:0; const ps=t?pipeState(t,fase,f,T):null;
    const w=t?Math.round(weightAt(t,fase,f)/sc.e)*sc.e:0; const stable=t&&f>=0.62&&f<0.95&&!(t.anom&&t.anom.k==='pessoa'&&fase===2);
    const ts=(T*60)%60; const clk=`${hm(T)}:${String(Math.floor(ts)).padStart(2,'0')}`;

    // Atualiza a Pista Interativa SVG em Tempo Real
    const mount = $('#pista-svg-mount');
    if (mount) {
      mount.innerHTML = buildPistaSvg(t, w, sc, stable, f, fase);
    }

    // Status da Pista
    const badge = $('#pista-status-badge');
    if (badge) {
      if (t && stable) {
        badge.innerHTML = '<span class="dot pulse brand"></span> Peso estável · validando';
        badge.style.color = '#FF9445';
      } else if (t && !stable && w > 0) {
        badge.innerHTML = '<span class="dot pulse warn"></span> Em movimento · posicionando';

function phone(t,T){
  const first=t.motorista.split(' ')[0]; const z=t.op==='expedicao'?'a central dosadora (baia 2)':t.mat==='CIM'?'o silo 2 de cimento':t.op==='recebimento'?'a baia de brita':'a pilha de '+MATS[t.mat].nome.toLowerCase();
  const m=[[t.arr-40,0,`Olá, ${first}! Sua janela na ${t.bal} é às ${hm(t.arr)}. Responda 1 para confirmar.`],[t.arr-39,1,'1'],
    [t.arr,0,`Check-in feito pelo ${t.canal.toLowerCase()}. Você é o ${Math.max(1,queueAt(t.bal,t.arr+0.01).indexOf(t)+1)}º da fila.`],
    [t.p1,0,`Siga para a ${t.bal}. Semáforo verde.`],[t.p1e,0,`1ª pesagem: ${kg(loadsHere(t.op)?t.tara:t.bruto)}. Siga para ${z}.`]];
  if(t.anom&&t.anom.fase===2&&needsDecision(t)) m.push([t.p2e,0,'Aguarde na baia de exceção. O operador vai falar com você pelo totem.']);
  m.push([exitStart(t),0,`Ticket ${t.tk}: líquido ${kg(liq(t))}. Confirma?`,true],[exitStart(t)+0.3,1,'Confirmar'],[exitStart(t)+0.35,0,'Saída liberada. Boa viagem!']);
  const vis=m.filter(x=>x[0]<=T).slice(-5);
  return `<div class="phone"><div class="ph-h"><div class="mark" style="width:26px;height:26px;font-size:11px;margin:0">SC</div><div><b>Serrano · Balança</b><div style="font-size:10px;color:#8696A0">conta comercial verificada</div></div></div>
   ${vis.map(([tt,me,txt,q])=>`<div class="msg ${me?'me':''}">${esc(txt)}${q?'<div class="qr"><span>Confirmar</span><span>Contestar</span></div>':''}<time>${hm(tt)}</time></div>`).join('')||'<div class="msg">Aguardando agendamento…</div>'}</div>`;
}

function taraChart(placa,T){
  const v=veh(placa); const r2=rngFrom(placa.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const hist=[];for(let i=29;i>=1;i--)hist.push({d:-i,w:v.tara+(r2()-.5)*v.tara*0.012});
  if(placa==='NJK-3307'){hist[25].w=v.tara*1.054;}
  const today=TRIPS.filter(t=>t.placa===placa&&t.p1e<=T&&loadsHere(t.op)).map((t,i)=>({d:0,w:t.tara,i}));
  const all=[...hist,...today];const mn=Math.min(...all.map(p=>p.w),v.tara*(1-RULES.tolTara/100))*0.995,mx=Math.max(...all.map(p=>p.w),v.tara*(1+RULES.tolTara/100))*1.005;
  const Wc=600,H=180,pl=60,pb=22,pt=10;const X=(d,i)=>pl+(Wc-pl-14)*((d+29)/(29+1))+(i||0)*8;const Y=w=>pt+(H-pt-pb)*(1-(w-mn)/(mx-mn));
  const band=`<rect x="${pl}" y="${Y(v.tara*(1+RULES.tolTara/100))}" width="${Wc-pl-14}" height="${Y(v.tara*(1-RULES.tolTara/100))-Y(v.tara*(1+RULES.tolTara/100))}" fill="var(--ok-soft)"/><line x1="${pl}" x2="${Wc-14}" y1="${Y(v.tara)}" y2="${Y(v.tara)}" stroke="var(--ok)" stroke-dasharray="4 4"/>`;
  const pts=hist.map(p=>{const out=Math.abs(p.w-v.tara)/v.tara*100>RULES.tolTara;return `<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="3.5" fill="${out?'var(--crit)':'var(--fg-3)'}"/>`;}).join('');
  const td=today.map(p=>{const out=Math.abs(p.w-v.tara)/v.tara*100>RULES.tolTara;return `<circle cx="${X(0,p.i)}" cy="${Y(p.w)}" r="6" fill="${out?'var(--crit)':'var(--brand)'}" stroke="var(--panel)" stroke-width="2"/>`;}).join('');
  const yl=[mn,v.tara,mx].map(w=>`<text x="${pl-6}" y="${Y(w)+3}" text-anchor="end">${fmt(w/1000,2)} t</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wc} ${H}" width="100%" role="img" aria-label="Histórico de tara de ${placa}">${band}${yl}${pts}${td}<text x="${pl}" y="${H-5}">30 dias atrás</text><text x="${Wc-14}" y="${H-5}" text-anchor="end">hoje</text></svg>
   <div class="legend" style="margin-top:6px"><span><i class="lg" style="background:var(--ok-soft)"></i>faixa aceita ±${fmt(RULES.tolTara,1)}%</span><span><i class="lg" style="background:var(--brand);border-radius:50%"></i>tara de hoje</span><span><i class="lg" style="background:var(--crit);border-radius:50%"></i>fora da faixa</span><span class="muted">média ${kg(v.tara)}</span></div>`;
}

    $('#r-mat').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th class="r">Tickets</th><th class="r">Líquido</th><th class="r">Média por viagem</th></tr></thead><tbody>${Object.entries(MATS).map(([k,m])=>{const x=tk.filter(t=>t.mat===k);return x.length?`<tr><td>${m.nome}</td><td class="num r">${x.length}</td><td class="num r">${ton(x.reduce((a,t)=>a+liq(t),0))}</td><td class="num r">${ton(x.reduce((a,t)=>a+liq(t),0)/x.length)}</td></tr>`:'';}).join('')}</tbody></table></div>`;
    const aud=[...Object.entries(DEC).filter(([,d])=>d.at<=T).map(([id,d])=>{const t=TRIPS.find(x=>x.id===id);return {t:d.at,sev:d.acao==='autorizar'?'crit':'warn',acao:`${ANOM[t.anom.k].t}: ${ANOM[t.anom.k].acoes.find(a=>a[0]===d.acao)[1]}`,det:`${t.placa} · ${t.tk} · "${d.just}"`,user:d.user};}),...S.log.filter(l=>!l.acao.includes(':')),
      {t:6*60+2,sev:'info',acao:'Zero automático',det:'BAL-01 e BAL-02 conferidas com plataforma vazia',user:'Sistema'},{t:12*60+30,sev:'info',acao:'Regra alterada',det:'Tolerância de tara: 2% → 3% (aprovado pela gerência)',user:'Márcio (CCO)'}].sort((a,b)=>b.t-a.t);
    const sp={info:['','Info'],warn:['p-warn','Atenção'],crit:['p-crit','Crítico']};
    $('#r-aud').innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Hora</th><th>Nível</th><th>Ação</th><th>Detalhe</th><th>Usuário</th></tr></thead><tbody>${aud.map(l=>`<tr><td class="num">${hm(l.t)}</td><td><span class="pill ${sp[l.sev][0]}">${sp[l.sev][1]}</span></td><td><b>${esc(l.acao)}</b></td><td>${esc(l.det)}</td><td>${esc(l.user)}</td></tr>`).join('')}</tbody></table></div>`;
  }
};

const CP={open:false,msgs:[],busy:false,ctl:null,sample:null,dict:null,tts:null,listening:false,ready:false,offline:false,pending:{}};
const SUGS=['Quanto de areia saiu hoje para a Construtora MT Horizon?','Quem está no pátio há mais tempo?','Tem pico de fila nas próximas 3 horas?','Por que as betoneiras estão dando excesso de peso?','Quais exceções estão abertas e o que você recomenda?'];
function cpPanel(){
  const p=$('#copilot'); p.hidden=!CP.open; if(!CP.open) return;
  p.innerHTML=`<div class="cp-h">${ic('spark')}<div><b>Copiloto</b><small>${CP.offline?'modo local: respostas simples, sem IA':'Motor KyttoIA 2.5 Flash · CCO da Usina'}</small></div><button class="btn sm ghost x" type="button" data-act="cp-close" aria-label="Fechar copiloto">${ic('x')}</button></div>
   <div class="cp-body" id="cp-body">${CP.msgs.length?CP.msgs.map(cpMsg).join(''):`<div class="bub a">Pergunte em português sobre pesagens, fila, pátio, exceções, contratos ou estoques. Eu consulto os dados da torre e, quando for preciso agir, peço sua confirmação.</div><div class="cp-sugs">${SUGS.map(s=>`<button type="button" data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}</div>
   <div class="cp-in"><button class="btn mic ${CP.listening?'on':''}" type="button" data-act="cp-mic" aria-label="Falar" ${CP.dict?'':'hidden'}>${ic('mic')}</button><textarea id="cp-text" rows="1" placeholder="Ex.: quanto de cimento recebemos hoje?" aria-label="Mensagem para o copiloto"></textarea>${CP.busy?`<button class="btn" type="button" data-act="cp-stop">Parar</button>`:`<button class="btn pri" type="button" data-act="cp-send" aria-label="Enviar">${ic('send')}</button>`}</div>`;
  const b=$('#cp-body'); b.scrollTop=b.scrollHeight;
}
function cpMsg(m,i){
  if(m.role==='tool') return `<div class="bub tool">↳ ${esc(m.text)}</div>`;
  const conf=m.confirm&&!m.confirm.done?`<div class="confirm"><button class="btn sm pri" type="button" data-cpok="${i}">Confirmar</button><button class="btn sm" type="button" data-cpno="${i}">Cancelar</button></div>`:m.confirm&&m.confirm.done?`<div class="muted" style="font-size:11.5px;margin-top:6px">${esc(m.confirm.done)}</div>`:'';
  return `<div class="bub ${m.role==='user'?'u':'a'}">${esc(m.text||'Pensando…')}${conf}</div>`;
}
function cpRefresh(){const b=$('#cp-body');if(!b){cpPanel();return;}b.innerHTML=CP.msgs.map(cpMsg).join('');b.scrollTop=b.scrollHeight;}

/* ---------- ferramentas (dados reais da simulação) ---------- */
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function findMat(s){if(!s)return null;const n=norm(s);if(n.includes('cimento'))return['CIM'];if(n.includes('brita'))return['BRI1'];if(n.includes('concreto'))return['CONC'];if(n.includes('grossa'))return['AREIA_G'];if(n.includes('media'))return['AREIA_M'];if(n.includes('areia'))return['AREIA_M','AREIA_G'];return null;}
const TOOLS={
  consultar_tickets:{description:'Lista e soma os tickets de pesagem já emitidos hoje até agora. Filtros opcionais: material (ex. "areia", "cimento", "concreto", "brita"), cliente_ou_fornecedor (parte do nome), operacao (expedicao|recebimento|venda|transferencia), balanca (BAL-01|BAL-02). Retorna totais em kg, volume e até 15 tickets.',
    schema:{type:'object',properties:{material:{type:'string'},cliente_ou_fornecedor:{type:'string'},operacao:{type:'string'},balanca:{type:'string'}}},
    run(a){const T=VT();const mats=findMat(a.material);const p=norm(a.cliente_ou_fornecedor);
      const x=ticketsAt(T).filter(t=>(!mats||mats.includes(t.mat))&&(!p||norm(t.parceiro).includes(p))&&(!a.operacao||t.op===a.operacao)&&(!a.balanca||t.bal===a.balanca));
      return {hora_atual:hm(T),quantidade:x.length,liquido_total_kg:x.reduce((s,t)=>s+liq(t),0),volume_m3:+x.reduce((s,t)=>s+(t.vol||0),0).toFixed(1),
        itens:x.slice(0,15).map(t=>({ticket:t.tk,hora:hm(t.p2),placa:t.placa,operacao:t.op,material:MATS[t.mat].nome,parceiro:t.parceiro,liquido_kg:liq(t),bruto_kg:t.bruto,status:TST[tStatus(t,T)][1]}))};}},
  estado_agora:{description:'Situação neste instante: o que está em cada balança, a fila, quem está no pátio (com tempo) e as exceções abertas.',
    run(){const T=VT();return {hora:hm(T),balancas:Object.keys(SCALES).map(b=>{const t=onScale(b,T);const s=t&&stateAt(t,T);return {balanca:b,na_plataforma:t?{placa:t.placa,pesagem:s.fase+'ª',operacao:t.op}:null,fila:queueAt(b,T).map(t=>({placa:t.placa,espera_min:Math.round(T-t.arr)})),patio:yardAt(b,T).map(t=>({placa:t.placa,no_patio_min:Math.round(T-t.p1e),operacao:t.op,material:MATS[t.mat].nome}))};}),
      excecoes_abertas:openExceptions(T).map(t=>({placa:t.placa,tipo:ANOM[t.anom.k].t,balanca:t.bal,desde:hm(anomAt(t))}))};}},
  veiculo:{description:'Detalhes de um veículo pela placa (ou parte dela): cadastro, configuração e limite legal, tara média, viagens de hoje com horários e pesos, e anomalias.',
    schema:{type:'object',properties:{placa:{type:'string'}},required:['placa']},
    run(a){const q=norm(a.placa).replace(/[^a-z0-9]/g,'');const v=VEH.find(x=>norm(x.placa).replace(/[^a-z0-9]/g,'').includes(q)||norm(x.frota).replace(/[^a-z0-9]/g,'')===q);if(!v)throw new Error('Placa não encontrada no cadastro');const T=VT();
      return {placa:v.placa,frota:v.frota,configuracao:CONFIGS[v.cfg].nome,pbt_legal_kg:CONFIGS[v.cfg].pbt,limite_com_tolerancia_kg:limits(v.cfg).fiscal,tara_media_kg:v.tara,transportadora:v.transp,motorista:v.motorista,bloqueado:v.bloq,
        viagens_hoje:TRIPS.filter(t=>t.placa===v.placa&&t.arr-3<=T).map(t=>({chegada:hm(t.arr),etapa_atual:stageLabel(t,T)||'concluída',operacao:t.op,material:MATS[t.mat].nome,parceiro:t.parceiro,tara_kg:T>=t.p1e||!loadsHere(t.op)&&T>=t.p2e?t.tara:null,bruto_kg:T>=t.p2e||(!loadsHere(t.op)&&T>=t.p1e)?t.bruto:null,ticket:T>=t.p2e?t.tk:null,anomalia:t.anom&&anomAt(t)<=T?ANOM[t.anom.k].t:null}))};}},
  previsao_fila:{description:'Previsão de fila para as próximas 3 horas em cada balança, com o pico e a hora do pico, a partir da agenda de janelas.',
    run(){const T=VT();return Object.keys(SCALES).map(b=>{let pk={n:0,t:T};const serie=[];for(let t=T;t<=Math.min(DAY1,T+180);t+=15){const n=queueAt(b,t).length;serie.push({hora:hm(t),na_fila:n});if(n>pk.n)pk={n,t};}return {balanca:b,pico:pk.n,hora_pico:hm(pk.t),serie};});}},
  estoques:{description:'Estoque atual de cimento (silos), brita e pilhas de areia, em kg, com capacidade quando houver.',
    run(){const s=stockAt(VT());return {cimento_kg:Math.round(s.cim),cimento_capacidade_kg:s.cimCap,brita1_kg:Math.round(s.bri),areia_media_kg:Math.round(s.am),areia_grossa_kg:Math.round(s.ag)};}},
  contratos:{description:'Contratos de clientes com quantidade contratada, entregue (inclui hoje) e saldo.',
    run(){const tk=ticketsAt(VT());return CONTRATOS.map(k=>{const h=tk.filter(t=>t.parceiro===k.c&&t.mat===k.m).reduce((a,t)=>a+(k.un==='m³'?(t.vol||0):liq(t)/1000),0);return {cliente:k.c,produto:MATS[k.m].nome,unidade:k.un,contratado:k.tot,entregue:+(k.base+h).toFixed(1),saldo:+(k.tot-k.base-h).toFixed(1)};});}},
  regras:{description:'Regras e tolerâncias em vigor (PBT, eixo, documento, tara, pátio) e limites por configuração de veículo.',
    run(){return {regras:RULES,configuracoes:Object.entries(CONFIGS).map(([k,c])=>({config:c.nome,pbt_kg:c.pbt,limite_com_tolerancia_kg:limits(k).fiscal,grupos:c.groups.map(g=>g[0]+' '+g[1]+' kg')}))};}},
  propor_acao:{description:'Propõe uma ação para o operador CONFIRMAR na tela (nada acontece sem o clique dele). tipo: "decidir_excecao" (placa + acao entre ajustar, autorizar, refazer, aceitar, confirmar, recusar, repesar; justificativa), "abrir_cancela" (balanca + cancela entrada|saida), "mostrar_tela" (tela: torre|pesagem|fila|antifraude|clientes|fiscal|relatorios|cadastros; executa direto).',
    schema:{type:'object',properties:{tipo:{type:'string'},placa:{type:'string'},acao:{type:'string'},justificativa:{type:'string'},balanca:{type:'string'},cancela:{type:'string'},tela:{type:'string'}},required:['tipo']},
    run(a){
      if(a.tipo==='mostrar_tela'){if(!V[a.tela])throw new Error('Tela desconhecida');S.view=a.tela;if(a.balanca&&SCALES[a.balanca])S.bal=a.balanca;render();return 'Tela aberta.';}
      if(a.tipo==='decidir_excecao'){const t=openExceptions(VT()).find(x=>norm(x.placa).includes(norm(a.placa)));if(!t)throw new Error('Não há exceção aberta para essa placa');const ok=ANOM[t.anom.k].acoes.find(x=>x[0]===a.acao);if(!ok)throw new Error('Ação inválida. Opções: '+ANOM[t.anom.k].acoes.map(x=>x[0]).join(', '));
        CP.msgs.push({role:'assistant',text:`Confirmar: ${ok[1]} para ${t.placa} (${ANOM[t.anom.k].t})${a.justificativa?' · "'+a.justificativa+'"':''}?`,confirm:{kind:'dec',id:t.id,acao:a.acao,just:a.justificativa||'Recomendado pelo copiloto'}});cpRefresh();return 'Pedido de confirmação mostrado ao operador.';}
      if(a.tipo==='abrir_cancela'){CP.msgs.push({role:'assistant',text:`Confirmar: abrir a cancela de ${a.cancela||'saída'} da ${a.balanca||S.bal}?`,confirm:{kind:'cmd',txt:`Cancela de ${a.cancela||'saída'} da ${a.balanca||S.bal} aberta pelo copiloto`}});cpRefresh();return 'Pedido de confirmação mostrado ao operador.';}
      throw new Error('Tipo de ação desconhecido');}}
};
const NAMES={consultar_tickets:'consultou tickets',estado_agora:'leu a situação do pátio',veiculo:'abriu o cadastro do veículo',previsao_fila:'calculou a previsão de fila',estoques:'leu os estoques',contratos:'leu os contratos',regras:'leu as regras',propor_acao:'preparou uma ação para você confirmar'};
function sampleTools(){return Object.entries(TOOLS).map(([name,t])=>({name,description:t.description,inputSchema:t.schema||{type:'object',properties:{}},execute:(input)=>{CP.msgs.push({role:'tool',text:NAMES[name]+(input&&Object.keys(input).length?' · '+Object.values(input).filter(Boolean).join(', '):'')});cpRefresh();return t.run(input||{});}}));}
function instructions(){const T=VT();return `Você é o copiloto da Torre de Pesagem da Serrano Concreto & Mineração (Tangará da Serra, MT): duas balanças rodoviárias (BAL-01 na usina de concreto, BAL-02 no porto de areia), pesagem autônoma por câmera e WhatsApp. Agora são ${hm(T)} (dia simulado do protótipo).
Responda em português do Brasil, em poucas linhas, com números em formato brasileiro (toneladas com vírgula). Consulte as ferramentas antes de afirmar qualquer dado; nunca invente placas, pesos ou horários. Se precisar agir (decidir exceção, abrir cancela), use propor_acao: o operador confirma na tela. Para mostrar uma tela, use propor_acao com tipo mostrar_tela.
Contexto de regras: limites de PBT pela Res. CONTRAN 882/2021 com tolerância configurável; betoneira 8x4 tem PBT 29 t; concreto pesa ~2,4 t/m³. Seja direto, como um supervisor experiente de balança.`;}
async function cpSend(text){
  text=String(text||'').trim(); if(!text||CP.busy) return;
  CP.msgs.push({role:'user',text}); const bot={role:'assistant',text:''}; CP.msgs.push(bot); CP.busy=true; cpPanel();
  if(CP.sample&&!CP.offline){
    const turns=[{role:'user',content:instructions()}];
    CP.msgs.filter(m=>(m.role==='user'||m.role==='assistant')&&m!==bot&&m.text&&!m.confirm).slice(-10).forEach(m=>turns.push({role:m.role,content:m.text}));
    if(turns[turns.length-1].role!=='user') turns.push({role:'user',content:text});
    CP.ctl=new AbortController();
    try{
      const r=await CP.sample(turns,{modelTier:'quick',cache:false,signal:CP.ctl.signal,tools:sampleTools(),onText:({text})=>{bot.text=text;cpRefresh();}});
      bot.text=r.text; if(r.truncated) bot.text+='\n\n(resposta cortada; pergunte por partes)';
    }catch(e){
      if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='tools_unavailable'||e.code==='capability_disabled'||e.code==='not_declared')){CP.offline=true;bot.text=localAnswer(text);}
      else if(e&&e.code==='cancelled'){bot.text=(e.text||'')+(e.text?'\n':'')+'(interrompido)';}
      else if(e&&e.code==='rate_limited'){bot.text=(e.text||'')+'Muitas perguntas seguidas. Tente de novo em instantes.';}
      else bot.text=(e&&e.text?e.text+'\n':'')+'Não consegui responder agora. Tente de novo.';
    }
  } else { await new Promise(r=>setTimeout(r,250)); bot.text=localAnswer(text); }
  CP.busy=false; CP.ctl=null; cpPanel();
}
function localAnswer(q){
  const n=norm(q); const T=VT();
  const pl=q.toUpperCase().match(/[A-Z]{3}-?\d[A-Z0-9]\d{2}|BT-\d{2}|ROD-\d{2}|CIM-\d{2}|BIT-\d{2}/);
  try{
    if(pl){const r=TOOLS.veiculo.run({placa:pl[0]});return `${r.placa}${r.frota!=='—'?' ('+r.frota+')':''} · ${r.configuracao}, limite ${kg(r.limite_com_tolerancia_kg)}, tara média ${kg(r.tara_media_kg)}.\n`+(r.viagens_hoje.map(v=>`• ${v.chegada} ${OPS[v.operacao]} · ${v.material} · ${v.etapa_atual}${v.ticket?' · '+v.ticket:''}${v.anomalia?' · ⚠ '+v.anomalia:''}`).join('\n')||'Sem viagens hoje.');}
    if(/exce|pendente/.test(n)){const e=openExceptions(T);return e.length?e.map(t=>`• ${t.placa}: ${ANOM[t.anom.k].t} (${t.bal}, desde ${hm(anomAt(t))})`).join('\n'):'Nenhuma exceção aberta.';}
    if(/patio|fila|agora|esperando/.test(n)){const r=TOOLS.estado_agora.run();return r.balancas.map(b=>`${b.balanca}: ${b.na_plataforma?b.na_plataforma.placa+' na plataforma':'pista livre'} · fila ${b.fila.length}${b.fila.length?' ('+b.fila.map(f=>f.placa+' '+f.espera_min+' min').join(', ')+')':''} · pátio ${b.patio.length}${b.patio.length?' ('+b.patio.map(f=>f.placa+' '+f.no_patio_min+' min').join(', ')+')':''}`).join('\n');}
    if(/previs|pico/.test(n)){return TOOLS.previsao_fila.run().map(b=>`${b.balanca}: pico de ${b.pico} veículo(s) às ${b.hora_pico}`).join('\n');}
    if(/estoque|silo|pilha/.test(n)){const s=TOOLS.estoques.run();return `Cimento ${ton(s.cimento_kg)} · Brita 1 ${ton(s.brita1_kg)} · Areia média ${ton(s.areia_media_kg,0)} · Areia grossa ${ton(s.areia_grossa_kg,0)}`;}
    const mats=findMat(q); const cli=[...new Set(TRIPS.map(t=>t.parceiro))].find(c=>n.includes(norm(c).split(' ').slice(-2).join(' '))||n.includes(norm(c).split(' ')[1]||'§'));
    if(mats||cli||/quanto|tonelad|ticket/.test(n)){const r=TOOLS.consultar_tickets.run({material:mats?q:null,cliente_ou_fornecedor:cli});return `${r.quantidade} ticket(s) até ${r.hora_atual}${cli?' para '+cli:''}${mats?' de '+mats.map(m=>MATS[m].nome).join(' e '):''}: ${ton(r.liquido_total_kg)} líquidos${r.volume_m3?' · '+fmt(r.volume_m3,1)+' m³':''}.`;}
  }catch(e){return e.message;}
  return 'No modo local eu respondo sobre: uma placa, exceções, fila e pátio, previsão de fila, estoques e totais por material ou cliente. Com o Motor KyttoIA conectado, eu respondo qualquer pergunta sobre a operação.';
}
async function shiftSummary(){
  const box=$('#r-sum'),b=$('#r-sum-b'); box.hidden=false;
  const T=VT(); const tk=ticketsAt(T);
  const data={hora:hm(T),tickets:tk.length,por_operacao:Object.keys(OPS).map(o=>({operacao:OPS[o],tickets:tk.filter(t=>t.op===o).length,liquido_t:+(tk.filter(t=>t.op===o).reduce((a,t)=>a+liq(t),0)/1000).toFixed(1)})),
    excecoes:TRIPS.filter(t=>t.anom&&anomAt(t)<=T).map(t=>({placa:t.placa,tipo:ANOM[t.anom.k].t,decisao:decided(t,T)?.acao||'pendente'})),espera_media_min:+(TRIPS.filter(t=>t.p1<=T).reduce((a,t)=>a+(t.p1-t.arr),0)/Math.max(1,TRIPS.filter(t=>t.p1<=T).length)).toFixed(1),
    estoques_t:Object.fromEntries(Object.entries(stockAt(T)).map(([k,v])=>[k,Math.round(v/1000)])),ipem:'BAL-02 vence em 20 dias'};
  if(!CP.sample||CP.offline){b.textContent=`Até ${data.hora}: ${data.tickets} pesagens. `+data.por_operacao.filter(o=>o.tickets).map(o=>`${o.operacao}: ${o.tickets} (${fmt(o.liquido_t,1)} t)`).join('; ')+`. Espera média ${fmt(data.espera_media_min,1)} min. ${data.excecoes.length} exceções no dia. (Resumo local: versão analítica oficial Motor KyttoIA.)`;return;}
  b.textContent='Pensando…';
  try{const r=await CP.sample(`Escreva o resumo do turno da Torre de Pesagem da Serrano para o gerente, em português do Brasil: no máximo 8 linhas curtas, sem markdown, começando pelo que exige ação. Use só estes dados:\n${JSON.stringify(data)}`,{onText:({text})=>{b.textContent=text;},cache:false});b.textContent=r.text;}
  catch(e){b.textContent=e.text||'Não foi possível gerar o resumo agora.';}
}
async function ocrPhoto(file){
  const out=$('#ocr-out'); if(!out) return;
  if(!CP.sample||CP.offline){out.innerHTML='<small class="muted">A leitura por foto processada pelo Motor KyttoIA Vision.</small>';return;}
  out.innerHTML='<small class="muted">Lendo a foto…</small>';
  try{const r=await CP.sample.json('Esta é a foto de um caminhão chegando a uma balança rodoviária no Brasil. Responda somente um JSON: {"placa": string ou null (formato ABC1D23 ou ABC-1234), "tipo": string curto (ex.: betoneira, caçamba, carreta graneleira), "eixos": número ou null, "confianca": "alta"|"media"|"baixa", "observacoes": string curta sobre algo que impeça a pesagem (posição, placa suja, carga solta)}.',{images:[file],cache:false});
    const v=r.placa&&VEH.find(x=>norm(x.placa).replace(/[^a-z0-9]/g,'')===norm(r.placa).replace(/[^a-z0-9]/g,''));
    out.innerHTML=`<div class="checks"><div class="chk ${r.placa?'ok':'warn'}"><span class="ic">${r.placa?'✓':'!'}</span><div><b>Placa: ${esc(r.placa||'não lida')}</b><small>${esc(r.tipo||'')}${r.eixos?' · '+r.eixos+' eixos':''} · confiança ${esc(r.confianca||'—')}</small></div><span></span></div>
      <div class="chk ${v?'ok':'warn'}"><span class="ic">${v?'✓':'!'}</span><div><b>${v?'Veículo cadastrado':'Placa fora do cadastro'}</b><small>${v?CONFIGS[v.cfg].nome+' · tara '+kg(v.tara)+' · '+esc(v.transp):'Pediria cadastro na portaria antes da 1ª pesagem.'}</small></div><span></span></div>
      ${r.observacoes?`<div class="chk"><span class="ic">i</span><div><b>Observação</b><small>${esc(r.observacoes)}</small></div><span></span></div>`:''}</div>`;
  }catch(e){out.innerHTML=`<small class="muted">${e.code==='images_unavailable'?'Este visualizador não envia imagens.':e.code==='image_rejected'?'Imagem não aceita. Tente outra foto (JPEG ou PNG).':'Não consegui ler a foto agora.'}</small>`;}
}

/* =====================================================================
   Render principal, eventos e relógio
   ===================================================================== */
function render(){
  Object.keys(sig).forEach(k=>delete sig[k]);
  renderRail(); renderStrip(); renderClock();
  $('#view').innerHTML=V[S.view].render();
  V[S.view].live();
}
let lastBadge='';
function tick(){
  if(S.playing&&live()&&S.T<DAY1) S.T=Math.min(DAY1,S.T+S.speed*0.25/60);
  $('#clock-t').textContent=hm(VT());
  updateStrip();
  const b=openExceptions(VT()).length+':'+S.view; if(b!==lastBadge){lastBadge=b;renderRail();}
  try{V[S.view].live();}catch(e){console.error(e);}
}
function updateStrip(){
  const T=VT();
  Object.values(SCALES).forEach(sc=>{const btn=document.querySelector(`[data-goscale="${sc.id}"].ls`);if(!btn)return;const t=onScale(sc.id,T);const st=t&&stateAt(t,T);
    btn.querySelector('[data-w]').textContent=kg(t?Math.round(weightAt(t,st.fase,st.f)/sc.e)*sc.e:0);
    btn.querySelector('small').textContent=t?t.placa+' · '+st.fase+'ª pesagem':'pista livre · fila '+queueAt(sc.id,T).length;
    const exc=openExceptions(T).filter(x=>x.bal===sc.id).length;btn.querySelector('.dot').className='dot '+(exc?'crit':sc.ipem.dias<=30?'warn':'');});
}
document.addEventListener('click',e=>{
  const btnCams = e.target.closest("#btn-cams");
  if (btnCams) {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "NAVIGATE_SECTION", secao: "cameras-cftv" }, "*");
    } else {
      window.location.href = "/admin/concreto?secao=cameras-cftv";
    }
    return;
  }
  const btnFull = e.target.closest("#btn-fullscreen, [data-act="fullscreen"]");
  if (btnFull) {
    toggleFullscreen();
    return;
  }


  // Interações diretas na Pista de Pesagem
  const pistaEl = e.target.closest('[data-pista-action]');
  if (pistaEl) {
    const act = pistaEl.dataset.pistaAction;
    const T = VT();
    const sc = SCALES[S.bal];
    const t = onScale(S.bal, T);
    const st = t ? stateAt(t, T) : null;
    const f = st ? st.f : 0, fase = st ? st.fase : 0;
    const w = t ? Math.round(weightAt(t, fase, f) / sc.e) * sc.e : 0;

    if (act === 'cancela-in') {
      TRACK_HW.cancelaIn = TRACK_HW.cancelaIn === 'aberta' ? 'fechada' : 'aberta';
      if (TRACK_HW.cancelaIn === 'aberta') TRACK_HW.semaforoIn = 'verde';
      else TRACK_HW.semaforoIn = 'vermelho';
      log('warn', 'Cancela Entrada ' + TRACK_HW.cancelaIn, S.bal + ' acionamento manual');
      toast('Cancela de Entrada da ' + S.bal + ': ' + TRACK_HW.cancelaIn.toUpperCase() + '. Semáforo: ' + TRACK_HW.semaforoIn.toUpperCase());
      V.pesagem.live();
      return;
    }
    if (act === 'cancela-out') {
      TRACK_HW.cancelaOut = TRACK_HW.cancelaOut === 'aberta' ? 'fechada' : 'aberta';
      if (TRACK_HW.cancelaOut === 'aberta') TRACK_HW.semaforoOut = 'verde';
      else TRACK_HW.semaforoOut = 'vermelho';
      log('warn', 'Cancela Saída ' + TRACK_HW.cancelaOut, S.bal + ' acionamento manual');
      toast('Cancela de Saída da ' + S.bal + ': ' + TRACK_HW.cancelaOut.toUpperCase() + '. Semáforo: ' + TRACK_HW.semaforoOut.toUpperCase());
      V.pesagem.live();
      return;
    }
    if (act === 'semaforo-in') {
      TRACK_HW.semaforoIn = TRACK_HW.semaforoIn === 'verde' ? 'vermelho' : 'verde';
      toast('Semáforo de Entrada da ' + S.bal + ': ' + TRACK_HW.semaforoIn.toUpperCase());
      V.pesagem.live();
      return;
    }
    if (act === 'semaforo-out') {
      TRACK_HW.semaforoOut = TRACK_HW.semaforoOut === 'verde' ? 'vermelho' : 'verde';
      toast('Semáforo de Saída da ' + S.bal + ': ' + TRACK_HW.semaforoOut.toUpperCase());
      V.pesagem.live();
      return;
    }
    if (act === 'celula') {
      const num = parseInt(pistaEl.dataset.celula || '1');
      const peso = pistaEl.dataset.peso || '0,1';
      openCelulaDrawer(num, peso);
      return;
    }
    if (act === 'caminhao') {
      openVeiculoConcretoDrawer(t, w, sc);
      return;
    }
    if (act === 'totem-lpr') {
      openTotemLprDrawer(t, sc);
      return;
    }
    if (act === 'totem-motorista') {
      openTotemMotoristaDrawer(t, w, sc);
      return;
    }
  }

  const btnFs = e.target.closest('[data-act="fullscreen"]');
  if (btnFs) {
    toggleFullscreen();
    return;
  }

  const tk=e.target.closest('#trucks [data-trip]'); if(tk){S.sel=S.sel===tk.dataset.trip?null:tk.dataset.trip;updateMap();return;}
  const b=e.target.closest('button,[data-tk],[data-locate],[data-act="scrim"],label.btn'); if(!b) return;
  const d=b.dataset;
  if(d.act==='scrim'){if(e.target===b)closeDrawer();return;}
  if(d.view){S.view=d.view;S.sel=null;render();$('#work').scrollTop=0;return;}
  if(d.site){S.site=d.site;S.sel=null;render();return;}
  if(d.bal){S.bal=d.bal;render();return;}
  if(d.goscale){S.bal=d.goscale;S.view='pesagem';closeDrawer();render();$('#work').scrollTop=0;return;}
  if(d.feed){S.feedF=d.feed;render();return;}
  if(d.speed){S.speed=+d.speed;S.playing=true;renderClock();return;}
  if(d.tk){const t=TRIPS.find(x=>x.id===d.tk);if(t)openDrawer(ticketDrawer(t));return;}
  if(d.locate){const t=TRIPS.find(x=>x.id===d.locate);if(!t)return;closeDrawer();S.view='torre';S.site=t.site;S.sel=t.id;render();return;}
  if(d.decide){const inp=document.getElementById('just-'+d.decide);const ok=decide(d.decide,d.acao,inp?inp.value:'');if(ok&&$('#overlay').innerHTML)closeDrawer();return;}
  if(d.ask){closeDrawer();CP.open=true;cpPanel();cpSend(d.ask);return;}
  if(d.apply){S.applied[d.apply]=true;log('info','Janela antecipada',`${d.placa} → ${d.hora} · aviso por WhatsApp`);toast(`Nova janela das ${d.hora} enviada para ${d.placa} pelo WhatsApp.`);V[S.view].live();return;}
  if(d.cmd){if(!live()){toast('Volte ao vivo para enviar comandos.');return;}log('warn',d.cmd,`${S.bal} · comando manual`);toast(d.cmd+'. Registrado na auditoria.');return;}
  if(d.cad){S.cadTab=d.cad;render();return;}
  if(d.bloq){const v=veh(d.bloq);v.bloq=!v.bloq;log(v.bloq?'crit':'warn',v.bloq?'Veículo bloqueado':'Veículo desbloqueado',v.placa);render();return;}
  if(d.cpok!=null||d.cpno!=null){const m=CP.msgs[+(d.cpok??d.cpno)];if(!m||!m.confirm||m.confirm.done)return;
    if(d.cpno!=null){m.confirm.done='Cancelado pelo operador.';cpRefresh();return;}
    if(m.confirm.kind==='dec'){const ok=decide(m.confirm.id,m.confirm.acao,m.confirm.just);m.confirm.done=ok?'Feito e registrado na auditoria.':'Não executado.';}
    else {log('warn',m.confirm.txt,'confirmado pelo operador');toast(m.confirm.txt+'.');m.confirm.done='Feito e registrado na auditoria.';}
    cpRefresh();return;}
  switch(d.act){
    case 'play':S.playing=!S.playing;render();break;
    case 'golive':S.replay=null;render();break;
    case 'copilot':CP.open=!CP.open;cpPanel();if(CP.open)setTimeout(()=>$('#cp-text')&&$('#cp-text').focus(),30);break;
    case 'cp-close':CP.open=false;cpPanel();break;
    case 'cp-send':cpSend($('#cp-text').value);break;
    case 'cp-stop':CP.ctl&&CP.ctl.abort();break;
    case 'cp-mic':{if(!CP.dict)return;if(CP.listening){CP.dict.stop().catch(()=>{});return;}const ta=$('#cp-text');const base=ta.value?ta.value+' ':'';
      CP.dict.start().catch(err=>{if(err&&err.code==='not_granted'){CP.dict=null;cpPanel();}});
      CP.dict.onPartial(({text})=>{const x=$('#cp-text');if(x)x.value=base+text;});CP.dict.onFinal(({text})=>{const x=$('#cp-text');if(x)x.value=(base+text).trim();});
      CP.dict.onState(({state})=>{CP.listening=state==='listening';const m=document.querySelector('.mic');if(m)m.classList.toggle('on',CP.listening);});break;}
    case 'close':closeDrawer();break;
    case 'speak':{const msg=$('#totem-msg').value.trim();if(!msg)return;log('info','Mensagem no totem',`${S.bal} · "${msg}"`);
      if(CP.tts){CP.tts.speak(msg,{language:'pt-BR'}).catch(()=>toast('Mensagem exibida no totem (voz indisponível agora).'));toast('Falando no totem da '+S.bal+'…');}else toast('Mensagem exibida no totem da '+S.bal+'.');break;}
    case 'summary':shiftSummary();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='replay'){const v=+e.target.value;const was=live();S.replay=v>=S.T-0.6?null:v;if(was!==live())render();else{V[S.view].live();renderClock();}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='auto-sw'){RULES.autoAprovar=t.checked;log('warn','Modo autônomo '+(t.checked?'ligado':'desligado'),S.bal);toast(t.checked?'Modo autônomo ligado: tickets saem sozinhos quando tudo confere.':'Modo autônomo desligado: cada ticket pede confirmação do operador.');return;}
  if(t.id==='a-veh'){S.fraudVeh=t.value;V.antifraude.live();return;}
  if(t.id==='c-portal'){S.portal=t.value;V.clientes.live();return;}
  if(t.id==='ocr-file'&&t.files&&t.files[0]){ocrPhoto(t.files[0]);return;}
  if(t.dataset.model){S.models[t.dataset.model]=t.checked;log('warn','Modelo antifraude '+(t.checked?'ligado':'desligado'),t.dataset.model);return;}
  if(t.dataset.rule){const k=t.dataset.rule;RULES[k]=t.type==='checkbox'?t.checked:parseFloat(t.value);log('warn','Regra alterada',`${k} = ${t.type==='checkbox'?(t.checked?'ligado':'desligado'):t.value}`);if(S.cadTab==='limites')render();return;}
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();CP.open=!CP.open;cpPanel();if(CP.open)setTimeout(()=>$('#cp-text')&&$('#cp-text').focus(),30);return;}
  if(e.key==='Escape'){if($('#overlay').innerHTML)closeDrawer();else if(CP.open){CP.open=false;cpPanel();}return;}
  if(e.target.id==='cp-text'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();cpSend(e.target.value);return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('#trucks [data-trip]')){e.preventDefault();const g=e.target.closest('[data-trip]');S.sel=S.sel===g.dataset.trip?null:g.dataset.trip;updateMap();}
  if((e.key==='Enter')&&e.target.dataset&&(e.target.dataset.tk||e.target.dataset.locate)){e.target.click();}
});
window.addEventListener('resize',()=>updatePop());

render();
setInterval(tick,250);
(async()=>{
  try{
    if(window.kyttoia&&typeof window.kyttoia.use==='function'){
      const [s,dct,tts]=await Promise.all([window.kyttoia ? window.kyttoia.use('sample') : null,window.kyttoia ? window.kyttoia.use('dictation') : null,window.kyttoia ? window.kyttoia.use('tts') : null]);
      CP.sample=s; CP.dict=dct; CP.tts=tts;
      if(s){try{const lim=await s.limits();if(!lim||!lim.tools)CP.offline=true;}catch(_){}}
    }
  }catch(_){}
  if(!CP.sample) CP.offline=true;
  CP.ready=true; if(CP.open) cpPanel();
})();
})();
</script>
