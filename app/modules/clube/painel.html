<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Kytto Clube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=Outfit:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --chao: #eef0ec; --placa: #ffffff; --tinta: #1b1f23; --apagado: #5e666e; --linha: #d9ddd7;
    --trilho: #22262b; --trilho-tinta: #e9ece8; --trilho-apagado: #9aa3ab;
    --libera: #0f8f6b; --libera-fundo: #e2f3ec; --bloqueia: #c8342b; --bloqueia-fundo: #fbe7e5;
    --espera: #b97c0c; --espera-fundo: #fbf0d9; --foco: #2f6fdb;
    --raio: 10px;
    --titulo: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
    --texto: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --chao: #15181b; --placa: #1e2226; --tinta: #e7eae6; --apagado: #a1a9b0; --linha: #2e3338;
      --trilho: #0f1113; --libera: #3fbf93; --libera-fundo: #16302a; --bloqueia: #f0776d; --bloqueia-fundo: #3a1f1d;
      --espera: #e0b04f; --espera-fundo: #3a2e15; --foco: #7aa7ff;
    }
  }
  :root[data-theme="dark"] {
    --chao: #15181b; --placa: #1e2226; --tinta: #e7eae6; --apagado: #a1a9b0; --linha: #2e3338;
    --trilho: #0f1113; --libera: #3fbf93; --libera-fundo: #16302a; --bloqueia: #f0776d; --bloqueia-fundo: #3a1f1d;
    --espera: #e0b04f; --espera-fundo: #3a2e15; --foco: #7aa7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--chao); color: var(--tinta); font: 16px/1.5 var(--texto); font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  a { color: var(--foco); }

  /* estrutura: trilho à esquerda no computador, barra embaixo no celular */
  .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100%; }
  nav.trilho { background: var(--trilho); color: var(--trilho-tinta); padding: 20px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 2px; }
  .marca { font: 700 1.35rem/1 var(--titulo); letter-spacing: .01em; padding: 4px 12px 22px; }
  .marca small { display: block; font: 500 .85rem/1.3 var(--texto); color: var(--trilho-apagado); margin-top: 4px; }
  nav.trilho a { display: flex; align-items: center; gap: 12px; color: var(--trilho-apagado); text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 500; }
  nav.trilho a svg { width: 20px; height: 20px; flex: none; }
  nav.trilho a:hover { color: var(--trilho-tinta); background: rgba(255,255,255,.05); }
  nav.trilho a[aria-current="page"] { color: var(--trilho-tinta); background: rgba(255,255,255,.09); box-shadow: inset 3px 0 0 var(--libera); }
  nav.trilho .rodape { margin-top: auto; padding: 12px; font-size: .82rem; color: var(--trilho-apagado); }
  main { padding: 28px 32px 48px; min-width: 0; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    nav.trilho { position: fixed; inset: auto 0 0 0; top: auto; height: auto; flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 20; }
    .marca, nav.trilho .rodape { display: none; }
    nav.trilho a { flex-direction: column; gap: 2px; font-size: .7rem; padding: 6px 4px; }
    nav.trilho a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--libera); }
    main { padding: 18px 16px 96px; }
  }

  h1 { font: 600 1.9rem/1.15 var(--titulo); margin: 0 0 4px; }
  h2 { font: 600 1.25rem/1.25 var(--titulo); margin: 0 0 12px; }
  h3 { font: 600 1.05rem/1.3 var(--titulo); margin: 0 0 8px; }
  .sub { color: var(--apagado); margin: 0 0 22px; }
  .topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .topo .sub { margin: 0; }

  .grade { display: grid; gap: 18px; }
  .duas { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
  @media (max-width: 1100px) { .duas { grid-template-columns: 1fr; } }
  .bloco { background: var(--placa); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; min-width: 0; }
  .bloco + .bloco { margin-top: 18px; }
  .grade > .bloco + .bloco { margin-top: 0; }

  button.acao, a.acao { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--linha); background: var(--placa); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--tinta); }
  button.acao:hover { border-color: var(--apagado); }
  button.acao.primaria { background: var(--primaria, var(--libera)); border-color: var(--primaria, var(--libera)); color: #fff; }
  button.acao.perigo { color: var(--bloqueia); border-color: var(--bloqueia); }
  button.acao:disabled { opacity: .5; cursor: progress; }
  .acoes { display: flex; gap: 8px; flex-wrap: wrap; }

  /* faixa da catraca: cada passagem é uma raia, verde quem entrou, vermelho quem parou */
  .raias { list-style: none; margin: 0; padding: 0; }
  .raia { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px 14px 12px 16px; border-left: 6px solid var(--libera); background: var(--placa); border-bottom: 1px solid var(--linha); }
  .raia:first-child { border-top-right-radius: var(--raio); }
  .raia.negado { border-left-color: var(--bloqueia); background: var(--bloqueia-fundo); }
  .raia.parceiro { border-left-color: var(--foco); }
  .raia .hora { font: 600 1.15rem/1 var(--titulo); color: var(--apagado); }
  .raia .quem { font: 600 1.25rem/1.2 var(--titulo); }
  .raia .motivo { color: var(--apagado); font-size: .92rem; }
  .raia.negado .motivo { color: var(--bloqueia); font-weight: 500; }
  .raia.nova { animation: entra .6s ease-out; }
  @keyframes entra { from { background: var(--libera-fundo); } }
  @media (prefers-reduced-motion: reduce) { .raia.nova { animation: none; } }
  @media (max-width: 560px) { .raia { grid-template-columns: 48px 1fr; } .raia .acoes { grid-column: 1 / -1; } }

  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; }
  .numero { padding: 4px 0; }
  .numero b { display: block; font: 600 2.2rem/1 var(--titulo); }
  .numero span { color: var(--apagado); font-size: .9rem; }
  .numero.alerta b { color: var(--bloqueia); }
  .numero.bom b { color: var(--libera); }

  .estado { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--chao); white-space: nowrap; }
  .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--apagado); }
  .estado.online::before, .estado.ok::before, .estado.validado::before, .estado.aceito::before, .estado.ativa::before, .estado.resolvido::before { background: var(--libera); }
  .estado.offline::before, .estado.erro::before, .estado.negado::before, .estado.retroativo::before, .estado.cancelada::before, .estado.falhou::before, .estado.bloqueada::before { background: var(--bloqueia); }
  .estado.contingencia::before, .estado.enviado::before, .estado.aguardando::before, .estado.congelada::before, .estado.recebido::before, .estado.validando::before, .estado.aberta::before { background: var(--espera); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 600; color: var(--apagado); font-size: .88rem; padding: 8px 10px; border-bottom: 1px solid var(--linha); }
  td { padding: 10px; border-bottom: 1px solid var(--linha); vertical-align: middle; }
  tr.clicavel { cursor: pointer; }
  tr.clicavel:hover td { background: var(--chao); }
  .rolagem { overflow-x: auto; }
  .vazio { color: var(--apagado); padding: 18px 4px; }

  label.campo { display: grid; gap: 4px; font-weight: 500; font-size: .92rem; }
  label.campo span.ajuda { color: var(--apagado); font-weight: 400; font-size: .84rem; }
  input:not([type=checkbox]):not([type=radio]), select, textarea { border: 1px solid var(--linha); background: var(--chao); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0; }
  textarea { min-height: 110px; resize: vertical; }
  .form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); align-items: end; }
  .form .largo { grid-column: 1 / -1; }
  .linha-check { display: flex; gap: 10px; align-items: center; font-weight: 500; }
  .linha-check input { width: 20px; height: 20px; accent-color: var(--libera); }
  .busca { max-width: 360px; }

  /* barras simples (frequência, funil) */
  .barras { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding-top: 6px; }
  .barras i { flex: 1; background: var(--libera); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
  .barras i span { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-size: .75rem; font-style: normal; color: var(--apagado); }
  .funil-linha { display: grid; grid-template-columns: 150px 1fr 130px; gap: 12px; align-items: center; padding: 6px 0; }
  .funil-linha .trilha { height: 12px; background: var(--linha); border-radius: 6px; overflow: hidden; display: flex; }
  .funil-linha .trilha b { background: var(--libera); }
  .funil-linha .trilha s { background: var(--espera); text-decoration: none; }
  @media (max-width: 560px) { .funil-linha { grid-template-columns: 1fr; gap: 4px; } }

  /* semana da agenda */
  .semana { display: grid; grid-template-columns: repeat(7, minmax(130px, 1fr)); gap: 10px; overflow-x: auto; }
  .dia h3 { font-size: .95rem; color: var(--apagado); }
  .dia.hoje h3 { color: var(--tinta); }
  .aula { display: block; width: 100%; text-align: left; border: 1px solid var(--linha); border-left: 4px solid var(--libera); background: var(--placa); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .aula.cheia { border-left-color: var(--bloqueia); }
  .aula.quase { border-left-color: var(--espera); }
  .aula.cancelada { opacity: .5; text-decoration: line-through; }
  .aula b { display: block; font: 600 1rem/1.2 var(--titulo); }
  .aula small { color: var(--apagado); }

  /* gaveta (perfil do aluno, detalhes) */
  dialog { border: 0; padding: 0; background: var(--placa); color: var(--tinta); width: min(560px, 100vw); max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0 0 0 auto; box-shadow: -8px 0 32px rgba(0,0,0,.18); }
  dialog::backdrop { background: rgba(15,17,19,.45); }
  dialog .cabeca { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 20px 12px; border-bottom: 1px solid var(--linha); position: sticky; top: 0; background: var(--placa); }
  dialog .corpo { padding: 18px 20px 40px; display: grid; gap: 18px; }
  dialog .fechar { border: 0; background: none; font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--apagado); padding: 0 4px; }
  .secao { border-top: 1px solid var(--linha); padding-top: 14px; }
  dl.dados { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin: 0; }
  dl.dados dt { color: var(--apagado); }
  dl.dados dd { margin: 0; }

  .aviso { padding: 12px 14px; border-radius: 8px; background: var(--espera-fundo); border: 1px solid var(--espera); margin-bottom: 16px; }
  .aviso.erro { background: var(--bloqueia-fundo); border-color: var(--bloqueia); }
  .aviso.bom { background: var(--libera-fundo); border-color: var(--libera); }
  .copiar { display: flex; gap: 8px; }
  .copiar input { font-size: .85rem; }
  .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); margin-bottom: 16px; overflow-x: auto; }
  .abas button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--apagado); border-bottom: 3px solid transparent; white-space: nowrap; }
  .abas button[aria-selected="true"] { color: var(--tinta); border-bottom-color: var(--libera); }
  #toast { position: fixed; right: 20px; bottom: 20px; background: var(--trilho); color: var(--trilho-tinta); padding: 12px 16px; border-radius: 8px; max-width: 360px; transform: translateY(20px); opacity: 0; visibility: hidden; transition: transform .25s, opacity .25s, visibility .25s; z-index: 50; }
  #toast.mostra { transform: none; opacity: 1; visibility: visible; }
  #toast.erro { background: var(--bloqueia); color: #fff; }
  @media (max-width: 860px) { #toast { bottom: 84px; left: 16px; right: 16px; } }
  .oculto { display: none !important; }
  .grade-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  /* grade de quadras: horários nas linhas, quadras nas colunas; cabeçalho e hora fixos ao rolar */
  .qwrap { overflow: auto; max-height: calc(100vh - 230px); border-radius: var(--raio); }
  .qgrade { border-collapse: separate; border-spacing: 0; width: 100%; }
  .qgrade th, .qgrade td { border-bottom: 1px solid var(--linha); border-right: 1px solid var(--linha); padding: 0; vertical-align: top; }
  .qgrade thead th { position: sticky; top: 0; z-index: 2; background: var(--placa); padding: 8px 6px; text-align: center; min-width: 118px; font: 600 .92rem/1.2 var(--titulo); color: var(--tinta); }
  .qgrade thead th small { display: block; font: 500 .74rem/1.2 var(--texto); color: var(--apagado); }
  .qgrade th.h { position: sticky; left: 0; z-index: 1; background: var(--placa); min-width: 62px; width: 62px; padding: 8px 10px 0 6px; text-align: right; font: 600 .9rem/1 var(--titulo); color: var(--apagado); }
  .qgrade thead th.h { z-index: 3; }
  .qgrade tr.agora th.h { color: var(--primaria, var(--libera)); box-shadow: inset 3px 0 0 var(--primaria, var(--libera)); }
  .qgrade td > button { display: block; width: 100%; height: 100%; min-height: 44px; border: 0; background: none; cursor: pointer; text-align: left; padding: 6px 8px; color: var(--tinta); font-size: .82rem; line-height: 1.25; }
  .qgrade td > button.livre { text-align: center; color: transparent; }
  .qgrade td > button.livre:hover, .qgrade td > button.livre:focus-visible { background: var(--libera-fundo); color: var(--libera); font-weight: 700; }
  .qgrade tr.passado td > button.livre { cursor: default; background: repeating-linear-gradient(135deg, transparent 0 6px, var(--chao) 6px 8px); }
  .qgrade tbody tr { height: 46px; }
  .qgrade td.ocup { position: relative; }
  .qgrade td.ocup > button { position: absolute; inset: 1px 1px 1px 0; height: auto; min-height: 0; overflow: hidden; border-radius: 0 6px 6px 0; background: var(--libera-fundo); box-shadow: inset 4px 0 0 var(--libera); display: flex; flex-direction: column; justify-content: flex-start; padding: 5px 8px 4px 10px; }
  .qgrade td.ocup.avulso > button { background: var(--chao); box-shadow: inset 4px 0 0 var(--foco); }
  .qgrade td.ocup.bloqueio > button { background: var(--espera-fundo); box-shadow: inset 4px 0 0 var(--espera); }
  .qgrade td.ocup b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qgrade td.ocup small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qgrade td.ocup small { color: var(--apagado); }
  .legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--apagado); margin: 10px 2px 0; }
  .legenda i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .dias-func { display: grid; grid-template-columns: 110px 90px 1fr 1fr; gap: 8px 10px; align-items: center; }
  @media (max-width: 560px) { .dias-func { grid-template-columns: 1fr 70px; } .dias-func input[type=time] { grid-column: span 1; } }
  /* dentro do Kytto (/admin/clube): o menu é o do Kytto, sem o trilho próprio */
  body.embutido .app { grid-template-columns: 1fr; }
  body.embutido nav.trilho { display: none; }
  body.embutido main { padding: 20px 24px 40px; }
  /* identidade Kytto quando embutido: mesmas cores, fontes e cantos do restante do painel;
     verde/vermelho seguem só como estado (liberado/bloqueado) */
  body.embutido {
    --chao: #FFF4EC; --placa: #FFFFFF; --tinta: #12283F; --apagado: #5A6570; --linha: #EADFD4;
    --primaria: #FF6B2C; --foco: #E4551A; --raio: 14px;
    --titulo: "Outfit", "Work Sans", system-ui, sans-serif; --texto: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body.embutido .bloco { box-shadow: 0 12px 32px rgba(18,40,63,.06); }
  @media (max-width: 860px) { body.embutido main { padding: 16px 16px 40px; } body.embutido #toast { bottom: 20px; } }
</style>
</head>
<body>
<div class="app">
  <nav class="trilho" aria-label="Seções do clube">
    <div class="marca">Kytto Clube<small id="empresaNome">Recepção e gestão</small></div>
    <a href="#recepcao" data-rota="recepcao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V5a2 2 0 0 1 2-2h4v18M14 21V9h4a2 2 0 0 1 2 2v10M2 21h20"/></svg>Recepção</a>
    <a href="#alunos" data-rota="alunos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7M17 4a4 4 0 0 1 0 8M22 21c0-3-2-6-5-6.6"/></svg>Alunos</a>
    <a href="#aulas" data-rota="aulas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Aulas</a>
    <a href="#quadras" data-rota="quadras"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M12 4v16M3 12h18M7 8v8M17 8v8"/></svg>Quadras</a>
    <a href="#contratos" data-rota="contratos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14l2.5 2.5L16 11"/></svg>Contratos</a>
    <a href="#retencao" data-rota="retencao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Retenção</a>
    <a href="#cobrancas" data-rota="cobrancas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Cobranças</a>
    <a href="#parceiros" data-rota="parceiros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h8M12 8v8"/><rect x="3" y="3" width="18" height="18" rx="9"/></svg>Parceiros</a>
    <a href="#ajustes" data-rota="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</a>
    <div class="rodape">Catraca, contratos, aulas e retenção</div>
  </nav>
  <main id="tela" tabindex="-1"></main>
</div>
<dialog id="gaveta" aria-labelledby="gavetaTitulo"><div class="cabeca"><div><h2 id="gavetaTitulo" style="margin:0"></h2><div id="gavetaSub" class="sub" style="margin:2px 0 0"></div></div><button class="fechar" aria-label="Fechar" onclick="document.getElementById('gaveta').close()">×</button></div><div class="corpo" id="gavetaCorpo"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ------------------------------------------------------------------ */
/* Acesso à API com a sessão do Kytto (mesmo login do painel)          */
/* ------------------------------------------------------------------ */
const BASE = '/api/admin/clube';
function ler(chave) { try { return localStorage.getItem(chave); } catch { return null; } }
function jsonLocal(chave) { try { return JSON.parse(ler(chave) || 'null'); } catch { return null; } }
function cabecalhos() {
  const token = ler('sp_token') || ler('sp_site_token') || '';
  const empresa = jsonLocal('sp_empresa_ativa');
  const loja = jsonLocal('sp_loja_ativa');
  return {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: `Bearer ${token}` } : {}),
    ...(empresa?.id ? { 'X-Empresa-Id': empresa.id } : {}),
    ...(loja?.id ? { 'X-Loja-Id': loja.id } : {}),
  };
}
async function api(caminho, { metodo = 'GET', corpo } = {}) {
  const r = await fetch(BASE + caminho, { method: metodo, headers: cabecalhos(), body: corpo === undefined ? undefined : JSON.stringify(corpo) });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { semSessao(); throw new Error('Sessão expirada'); }
  if (!r.ok) { const e = new Error(d.error || `Erro ${r.status}`); e.status = r.status; e.code = d.code; throw e; }
  return d;
}

/* ------------------------------------------------------------------ */
/* Utilidades de interface                                             */
/* ------------------------------------------------------------------ */
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const reais = (v) => (v === null || v === undefined || v === '' ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }));
const dataBR = (d) => (d ? new Date(String(d).length === 10 ? `${d}T12:00:00` : d).toLocaleDateString('pt-BR') : '—');
const dataHoraBR = (d) => (d ? new Date(d).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—');
const hora = (d) => new Date(d).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const hojeISO = () => new Date().toLocaleDateString('en-CA');
const somarDias = (iso, n) => { const d = new Date(`${iso}T12:00:00`); d.setDate(d.getDate() + n); return d.toLocaleDateString('en-CA'); };
const mesAtual = () => hojeISO().slice(0, 7);

let toastTimer;
function aviso(texto, erro = false) {
  const t = $('#toast'); t.textContent = texto; t.className = `mostra${erro ? ' erro' : ''}`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, 4200);
}
/** Executa uma ação de botão com estado de espera e mensagem de resultado. */
async function agir(botao, fn, ok) {
  if (botao) botao.disabled = true;
  try { const r = await fn(); if (ok) aviso(typeof ok === 'function' ? ok(r) : ok); return r; }
  catch (e) { aviso(e.message, true); return null; }
  finally { if (botao) botao.disabled = false; }
}
function semSessao() {
  $('#tela').innerHTML = `<div class="bloco"><h2>Entre no Kytto para usar o painel do clube</h2><p class="sub">A sessão expirou ou este navegador ainda não fez login.</p><a class="acao" href="/login" target="_top">Fazer login</a></div>`;
}
function erroTela(e) {
  if (e.status === 403) return `<div class="aviso erro">Seu usuário não tem permissão para o painel do clube, ou nenhuma empresa está selecionada. Escolha a empresa no Kytto e volte aqui.</div>`;
  return `<div class="aviso erro">Não foi possível carregar: ${esc(e.message)}</div>`;
}
function gaveta(titulo, sub, html) {
  $('#gavetaTitulo').textContent = titulo; $('#gavetaSub').textContent = sub || ''; $('#gavetaCorpo').innerHTML = html;
  const g = $('#gaveta'); if (!g.open) g.showModal();
  return $('#gavetaCorpo');
}
function form(el) { return Object.fromEntries(new FormData(el).entries()); }
function estado(s, rotulo) { return `<span class="estado ${esc(s)}">${esc(rotulo || ROTULOS[s] || s)}</span>`; }
const ROTULOS = {
  online: 'online', offline: 'sem sinal', contingencia: 'contingência', aguardando: 'aguardando pareamento',
  ativa: 'ativa', congelada: 'congelada', cancelada: 'cancelada', enviado: 'aguardando aceite', aceito: 'aceito', expirado: 'vencido',
  recebido: 'recebido', validando: 'validando', validado: 'validado', falhou: 'tentando de novo', retroativo: 'pedir retroativo', negado: 'recusado',
  aberta: 'aberta', em_andamento: 'em andamento', resolvida: 'resolvida',
};
const MOTIVOS = {
  inadimplente: 'Mensalidade em aberto', contrato_pendente: 'Contrato não aceito', fora_do_horario: 'Fora do horário do plano',
  limite_atingido: 'Limite do plano atingido', sem_reserva: 'Sem reserva de aula', unidade_nao_permitida: 'Plano de outra unidade',
  ja_dentro: 'Entrada já registrada', sem_plano: 'Sem plano ativo', bloqueio_manual: 'Bloqueio no cadastro', nao_identificado: 'Não identificado',
  liberado: 'Entrou', parceiro: 'Entrou pelo app parceiro',
};
const GATILHOS = {
  inadimplente: 'Mensalidade atrasada', vencimento: 'Vencimento chegando', aniversario: 'Aniversário', faltante_serio: 'Sumido há 15 dias',
  risco_cancelar: 'Frequência caindo', renovacao: 'Renovação do plano', faltante_leve: 'Sumido há 7 dias', prospect: 'Interessado sem matrícula',
  parceiro_frequente: 'Parceiro frequente', pos_aula: 'Pesquisa da 1ª semana', ex_aluno: 'Ex-aluno',
};

/* ------------------------------------------------------------------ */
/* Rotas                                                               */
/* ------------------------------------------------------------------ */
let pararRecepcao = null;
const TELAS = { recepcao: telaRecepcao, alunos: telaAlunos, aulas: telaAulas, quadras: telaQuadras, contratos: telaContratos, retencao: telaRetencao, cobrancas: telaCobrancas, parceiros: telaParceiros, ajustes: telaAjustes };
const EMBUTIDO = new URLSearchParams(location.search).get('embed') === '1';
// clube usa "sócio"; academia usa "aluno" (o Kytto passa ?termo=socio para clubes)
const SOCIO = new URLSearchParams(location.search).get('termo') === 'socio';
const TERMO = SOCIO ? { Alunos: 'Sócios e alunos', aluno: 'sócio', Quem: 'Sócio ou aluno' } : { Alunos: 'Alunos', aluno: 'aluno', Quem: 'Aluno' };
if (EMBUTIDO) document.body.classList.add('embutido');
function navegar() {
  const rota = (location.hash.slice(1) || 'recepcao').split('/')[0];
  const tela = TELAS[rota] ? rota : 'recepcao';
  document.querySelectorAll('nav.trilho a').forEach((a) => {
    if (a.dataset.rota === tela) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (pararRecepcao) { pararRecepcao(); pararRecepcao = null; }
  // dentro do Kytto: avisa a página de fora para a URL acompanhar a seção (voltar do navegador funciona)
  if (EMBUTIDO && window.parent !== window) { try { window.parent.postMessage({ tipo: 'kytto-clube:rota', rota: tela }, location.origin); } catch { /* sem pai */ } }
  $('#tela').innerHTML = '<p class="sub">Carregando…</p>';
  TELAS[tela]().catch((e) => { if (e.message !== 'Sessão expirada') $('#tela').innerHTML = erroTela(e); });
}
window.addEventListener('hashchange', navegar);
const empresa = jsonLocal('sp_empresa_ativa');
if (empresa?.nome || empresa?.nome_fantasia) $('#empresaNome').textContent = empresa.nome_fantasia || empresa.nome;

/* ------------------------------------------------------------------ */
/* Recepção ao vivo                                                    */
/* ------------------------------------------------------------------ */
async function telaRecepcao() {
  const [eventos, aparelhos] = await Promise.all([api('/acesso/eventos?limite=60'), api('/acesso/dispositivos')]);
  let retro = []; let ocorr = [];
  try { [retro, ocorr] = await Promise.all([api('/parceiros/retroativos'), api('/retencao/ocorrencias')]); } catch { /* módulos opcionais */ }
  $('#tela').innerHTML = `
    <div class="topo"><div><h1>Recepção</h1><p class="sub">Quem passou pela catraca agora. Bloqueio aparece em vermelho com a solução ao lado.</p></div>
      <div class="acoes"><button class="acao" id="btnLiberar">Liberar entrada manual</button></div></div>
    <div class="grade duas">
      <section class="bloco" style="padding:0;overflow:hidden" aria-label="Passagens recentes"><ul class="raias" id="raias"></ul></section>
      <div>
        <section class="bloco"><h2>Hoje</h2><div class="numeros" id="numeros"></div></section>
        <section class="bloco"><h2>Aparelhos</h2><div id="aparelhos"></div></section>
        <section class="bloco"><h2>Para resolver</h2><div id="pendencias"></div></section>
      </div>
    </div>`;
  const vistos = new Set();
  let ultimos = eventos;
  const desenhar = (lista, novos = new Set()) => {
    $('#raias').innerHTML = lista.length ? lista.map((e) => raia(e, novos.has(e.id))).join('') : '<li class="vazio" style="padding:18px">Nenhuma passagem ainda hoje.</li>';
    const hoje = hojeISO();
    const deHoje = lista.filter((e) => new Date(e.em).toLocaleDateString('en-CA') === hoje);
    $('#numeros').innerHTML = `
      <div class="numero bom"><b>${deHoje.filter((e) => e.decisao === 'liberado').length}</b><span>entradas</span></div>
      <div class="numero ${deHoje.some((e) => e.decisao === 'negado') ? 'alerta' : ''}"><b>${deHoje.filter((e) => e.decisao === 'negado').length}</b><span>bloqueios</span></div>
      <div class="numero"><b>${deHoje.filter((e) => e.codigo === 'parceiro').length}</b><span>pelo Wellhub ou TotalPass</span></div>`;
  };
  eventos.forEach((e) => vistos.add(e.id));
  desenhar(eventos);
  $('#aparelhos').innerHTML = aparelhos.length
    ? aparelhos.map((a) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linha)"><span>${esc(a.nome)}</span>${estado(a.status)}</div>`).join('')
    : '<p class="vazio">Nenhum aparelho cadastrado. <a href="#ajustes">Cadastrar catraca</a></p>';
  const pend = [];
  if (retro.length) pend.push(`<p><a href="#parceiros">${retro.length} check-in(s) de parceiro para pedir retroativo</a></p>`);
  if (ocorr.length) pend.push(`<p><a href="#retencao">${ocorr.length} aluno(s) esperando atendimento</a></p>`);
  $('#pendencias').innerHTML = pend.join('') || '<p class="vazio" style="padding:0">Tudo em dia.</p>';

  $('#raias').addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-acao]'); if (!b) return;
    const { acao, cliente } = b.dataset;
    if (acao === 'pix') agir(b, () => api(`/retencao/alunos/${cliente}/link-pagamento`, { metodo: 'POST', corpo: { enviar: true } }), 'Link de pagamento enviado no WhatsApp.');
    if (acao === 'perfil') abrirAluno(cliente);
    if (acao === 'liberar') liberarManual(aparelhos, cliente);
  });
  $('#btnLiberar').onclick = () => liberarManual(aparelhos, null);

  const timer = setInterval(async () => {
    try {
      const lista = await api('/acesso/eventos?limite=60');
      const novos = new Set(lista.filter((e) => !vistos.has(e.id)).map((e) => e.id));
      lista.forEach((e) => vistos.add(e.id));
      if (novos.size || lista.length !== ultimos.length) { ultimos = lista; desenhar(lista, novos); }
    } catch { /* sem rede: tenta no próximo ciclo */ }
  }, 4000);
  pararRecepcao = () => clearInterval(timer);
}
function raia(e, nova) {
  const negado = e.decisao === 'negado';
  const acoes = [];
  if (negado && e.customerId) {
    if (e.codigo === 'inadimplente') acoes.push(`<button class="acao primaria" data-acao="pix" data-cliente="${e.customerId}">Enviar link de pagamento</button>`);
    acoes.push(`<button class="acao" data-acao="perfil" data-cliente="${e.customerId}">Ver aluno</button>`);
    if (!['bloqueio_manual', 'ja_dentro'].includes(e.codigo)) acoes.push(`<button class="acao" data-acao="liberar" data-cliente="${e.customerId}">Liberar</button>`);
  }
  return `<li class="raia${negado ? ' negado' : ''}${e.codigo === 'parceiro' ? ' parceiro' : ''}${nova ? ' nova' : ''}">
    <span class="hora">${new Date(e.em).toLocaleDateString('en-CA') === hojeISO() ? hora(e.em) : new Date(e.em).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' })}</span>
    <div><div class="quem">${esc(e.nome || 'Não identificado')}</div><div class="motivo">${esc(MOTIVOS[e.codigo] || e.mensagem || e.codigo)}${e.origem === 'manual' ? ' (liberação manual)' : ''}${e.dispositivo ? ` · ${esc(e.dispositivo)}` : ''}</div></div>
    <div class="acoes">${acoes.join('')}</div></li>`;
}
function liberarManual(aparelhos, clienteId) {
  if (!aparelhos.length) return aviso('Cadastre uma catraca em Ajustes antes de liberar.', true);
  const corpo = gaveta('Liberar entrada', 'Fica registrado com seu usuário e o motivo.', `
    <form class="form" id="fLiberar">
      <label class="campo largo">Aparelho<select name="dispositivo">${aparelhos.map((a) => `<option value="${a.id}">${esc(a.nome)}</option>`).join('')}</select></label>
      <label class="campo largo">Motivo<input name="motivo" required minlength="3" maxlength="240" placeholder="Ex.: aluno esqueceu o celular, pagou na recepção"></label>
      <div class="largo"><button class="acao primaria">Abrir catraca</button></div>
    </form>`);
  $('#fLiberar', corpo).onsubmit = (ev) => {
    ev.preventDefault();
    const d = form(ev.target);
    agir(ev.submitter, () => api(`/acesso/dispositivos/${d.dispositivo}/liberar`, { metodo: 'POST', corpo: { customerId: clienteId, motivo: d.motivo } }), 'Comando de abertura enviado.')
      .then((r) => { if (r) $('#gaveta').close(); });
  };
}

/* ------------------------------------------------------------------ */
/* Alunos                                                              */
/* ------------------------------------------------------------------ */
async function telaAlunos() {
  $('#tela').innerHTML = `
    <div class="topo"><div><h1>${TERMO.Alunos}</h1><p class="sub">Adesões, pagamentos, congelamento e o histórico de cada ${TERMO.aluno}.</p></div>
      <button class="acao primaria" id="btnNova">Nova adesão</button></div>
    <section class="bloco">
      <div class="acoes" style="margin-bottom:12px">
        <input class="busca" id="busca" type="search" placeholder="Buscar por nome ou telefone" aria-label="Buscar aluno">
        <select id="filtro" aria-label="Situação" style="width:auto"><option value="ativa">Ativas</option><option value="congelada">Congeladas</option><option value="cancelada">Canceladas</option><option value="todas">Todas</option></select>
      </div>
      <div class="rolagem" id="lista"></div>
    </section>`;
  const carregar = async () => {
    const lista = await api(`/acesso/matriculas?status=${$('#filtro').value}&busca=${encodeURIComponent($('#busca').value)}`);
    const hoje = hojeISO();
    $('#lista').innerHTML = lista.length ? `<table><thead><tr><th>Aluno</th><th>Plano</th><th>Pago até</th><th>Situação</th></tr></thead><tbody>${lista.map((m) => `
      <tr class="clicavel" data-cliente="${m.customerId}" tabindex="0"><td><b>${esc(m.nome)}</b><br><small class="sub">${esc(m.telefone || '')}</small></td><td>${esc(m.planoNome)}</td>
      <td>${m.pagoAte < hoje ? `<span style="color:var(--bloqueia);font-weight:600">${dataBR(m.pagoAte)}</span>` : dataBR(m.pagoAte)}</td>
      <td>${m.bloqueada ? estado('bloqueada', 'bloqueada') : estado(m.status)}</td></tr>`).join('')}</tbody></table>`
      : '<p class="vazio">Ninguém encontrado. Use “Nova adesão” para cadastrar e matricular.</p>';
  };
  let t; $('#busca').oninput = () => { clearTimeout(t); t = setTimeout(carregar, 300); };
  $('#filtro').onchange = carregar;
  $('#lista').addEventListener('click', (e) => { const tr = e.target.closest('tr[data-cliente]'); if (tr) abrirAluno(tr.dataset.cliente); });
  $('#lista').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const tr = e.target.closest('tr[data-cliente]'); if (tr) abrirAluno(tr.dataset.cliente); } });
  $('#btnNova').onclick = novaMatricula;
  await carregar();
}

async function novaMatricula() {
  const [planos, modelos] = await Promise.all([api('/acesso/planos'), api('/contratos/modelos').catch(() => [])]);
  const ativos = planos.filter((p) => p.ativo);
  if (!ativos.length) return aviso('Cadastre um plano em Ajustes primeiro.', true);
  const temModelo = modelos.some((m) => m.ativo !== false);
  const corpo = gaveta(`Nova adesão`, `Cadastro, plano, contrato e 1ª mensalidade em um passo.`, `
    <form class="form" id="fMat" autocomplete="off">
      <fieldset class="largo" style="border:0;padding:0;margin:0">
        <legend style="font-weight:600;margin-bottom:6px">1. ${TERMO.Quem}</legend>
        <label class="campo largo">Buscar no cadastro<input id="buscaCli" placeholder="Nome ou telefone (deixe em branco para cadastrar)"></label>
        <div class="largo" id="achados"></div>
        <input type="hidden" name="customerId">
        <div class="largo grade-campos" id="novoCad">
          <label class="campo">Nome completo<input name="nome" maxlength="240" placeholder="Como no documento"></label>
          <label class="campo">WhatsApp<input name="telefone" inputmode="tel" placeholder="(65) 99999-0000"></label>
          <label class="campo">E-mail (opcional)<input name="email" type="email"></label>
        </div>
        <label class="linha-check largo"><input type="checkbox" name="menor"> Menor de idade (contrato e cobranças vão para o responsável)</label>
        <div class="largo grade-campos oculto" id="resp">
          <label class="campo">Nome do responsável<input name="respNome" maxlength="240"></label>
          <label class="campo">WhatsApp do responsável<input name="respTelefone" inputmode="tel"></label>
        </div>
      </fieldset>
      <fieldset class="largo" style="border:0;padding:0;margin:8px 0 0">
        <legend style="font-weight:600;margin-bottom:6px">2. Plano</legend>
        <label class="campo largo">Plano<select name="planoId">${ativos.map((p) => `<option value="${p.id}">${esc(p.nome)}${p.valorMensal ? ` · ${reais(p.valorMensal)}/mês` : ''}${p.fidelidadeMeses ? ` · fidelidade ${p.fidelidadeMeses}m` : ''}</option>`).join('')}</select></label>
        <label class="campo">Início<input type="date" name="inicio" value="${hojeISO()}"></label>
      </fieldset>
      <fieldset class="largo" style="border:0;padding:0;margin:8px 0 0">
        <legend style="font-weight:600;margin-bottom:6px">3. 1ª mensalidade</legend>
        <label class="linha-check largo"><input type="radio" name="pagamento" value="pix" checked> Enviar Pix no WhatsApp (a catraca libera quando a recepção confirmar o Pix)</label>
        <label class="linha-check largo"><input type="radio" name="pagamento" value="balcao"> Já pagou na recepção (libera agora por 30 dias)</label>
        <label class="linha-check largo"><input type="radio" name="pagamento" value="depois"> Cobrar depois</label>
      </fieldset>
      <fieldset class="largo" style="border:0;padding:0;margin:8px 0 0">
        <legend style="font-weight:600;margin-bottom:6px">4. Contrato e comunicação</legend>
        <label class="linha-check largo"><input type="checkbox" name="enviarContrato" ${temModelo ? 'checked' : 'disabled'}> Enviar o contrato para aceite no WhatsApp${temModelo ? '' : ' <small class="sub">(crie um modelo em Contratos digitais)</small>'}</label>
        <label class="linha-check largo"><input type="checkbox" name="aceitaNovidades"> Autorizou receber novidades e campanhas do clube (opcional, LGPD)</label>
      </fieldset>
      <div class="largo"><button class="acao primaria">Concluir adesão</button></div>
    </form>`);
  const f = $('#fMat', corpo);
  let t;
  $('#buscaCli', corpo).oninput = (ev) => {
    clearTimeout(t);
    f.customerId.value = '';
    $('#novoCad', corpo).classList.remove('oculto');
    t = setTimeout(async () => {
      const l = ev.target.value.trim().length >= 2 ? await api(`/acesso/clientes?busca=${encodeURIComponent(ev.target.value)}`).catch(() => []) : [];
      $('#achados', corpo).innerHTML = l.map((c) => `<button type="button" class="acao" style="margin:0 6px 6px 0" data-id="${c.id}">${esc(c.nome)} ${c.telefone ? `<small>${esc(c.telefone)}</small>` : ''}</button>`).join('')
        || (ev.target.value.trim().length >= 2 ? '<p class="vazio" style="padding:0">Ninguém com esse nome: preencha o cadastro abaixo.</p>' : '');
    }, 250);
  };
  $('#achados', corpo).onclick = (ev) => {
    const b = ev.target.closest('button[data-id]'); if (!b) return;
    f.customerId.value = b.dataset.id;
    $('#buscaCli', corpo).value = b.textContent.trim(); $('#achados', corpo).innerHTML = '';
    $('#novoCad', corpo).classList.add('oculto');
  };
  f.menor.onchange = () => $('#resp', corpo).classList.toggle('oculto', !f.menor.checked);
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const d = form(f);
    if (!d.customerId && String(d.nome || '').trim().length < 3) return aviso('Escolha alguém do cadastro ou preencha o nome completo.', true);
    if (!d.customerId && !d.telefone) { if (!confirm('Sem WhatsApp, o contrato e o Pix não vão pelo celular. Continuar?')) return; }
    if (f.menor.checked && !String(d.respNome || '').trim()) return aviso('Informe o responsável legal.', true);
    const empresa = jsonLocal('sp_empresa_ativa');
    const corpoReq = {
      aluno: d.customerId ? { customerId: d.customerId } : { nome: d.nome, telefone: d.telefone, email: d.email },
      menor: f.menor.checked,
      responsavel: f.menor.checked ? { nome: d.respNome, telefone: d.respTelefone } : null,
      planoId: d.planoId, inicio: d.inicio, pagamento: d.pagamento,

      empresaNome: empresa?.nome_fantasia || empresa?.nome || '',
    };
    const r = await agir(ev.submitter, () => api('/adesao', { metodo: 'POST', corpo: corpoReq }));
    if (r) resumoAdesao(r);
  };
}
function resumoAdesao(r) {
  const linha = (rotulo, item, sim, nao) => `<li style="margin:6px 0"><b>${rotulo}:</b> ${item ? (item.enviado ? sim : nao) : '—'}${item?.link ? `<div class="copiar" style="margin-top:6px"><input readonly value="${esc(item.link)}"><button type="button" class="acao" data-copiar="${esc(item.link)}">Copiar</button></div>` : ''}</li>`;
  const corpo = gaveta('Adesão concluída', `${r.aluno.nome}${r.aluno.criado ? ' (cadastro novo)' : ''} · ${r.matricula.plano}`, `
    <div class="aviso bom">Matrícula criada e cadastro enviado à catraca. Pago até ${dataBR(r.matricula.pagoAte)}.</div>
    <ul style="padding-left:18px">
      ${r.responsavel ? `<li style="margin:6px 0"><b>Responsável:</b> ${esc(r.responsavel.nome)}</li>` : ''}
      ${linha('Contrato', r.contrato, 'enviado no WhatsApp para aceite', 'gerado, envie o link')}
      ${linha('Pix da 1ª mensalidade', r.pix, `enviado no WhatsApp (${reais(r.pix?.valor)})`, 'gerado, envie o link')}
    </ul>
    ${r.avisos.length ? `<div class="aviso">${r.avisos.map(esc).join('<br>')}</div>` : ''}
    <div class="acoes" style="margin-top:12px"><button class="acao primaria" id="verAluno">Abrir ficha</button><button class="acao" id="outra">Nova adesão</button></div>`);
  corpo.querySelectorAll('[data-copiar]').forEach((b) => { b.onclick = () => navigator.clipboard?.writeText(b.dataset.copiar).then(() => aviso('Link copiado.')); });
  $('#verAluno', corpo).onclick = () => abrirAluno(r.aluno.id);
  $('#outra', corpo).onclick = () => novaMatricula();
  if (location.hash.slice(1).startsWith('alunos')) navegar();
}

    api(`/contratos?customerId=${customerId}`).catch(() => []),
    api(`/retencao/disparos?customerId=${customerId}&limite=10`).catch(() => []),

    ${m ? `<dl class="dados">

      <dt>Fidelidade até</dt><dd>${dataBR(m.fimFidelidade)}</dd>
      ${fin && fin.diasAtraso ? `<dt>Em atraso</dt><dd style="color:var(--bloqueia);font-weight:600">${fin.diasAtraso} dia(s) · ${reais(fin.total)}</dd>` : ''}
    </dl>` : '<p class="vazio">Este cliente não tem matrícula.</p>'}
    <div class="secao"><h3>Treinos por semana</h3>${freq.length ? `<div class="barras" aria-label="Frequência nas últimas semanas">${freq.map((f) => `<i style="height:${(f.acessos / max) * 100}%" title="Semana de ${dataBR(f.semana)}: ${f.acessos}"><span>${f.acessos}</span></i>`).join('')}</div>` : '<p class="vazio" style="padding:0">Sem treinos nas últimas 8 semanas.</p>'}</div>
    ${m ? `<div class="secao"><h3>Ações</h3>
      <form class="form" id="fPag"><label class="campo">Pago até<input type="date" name="pagoAte" required value="${somarDias(m.pagoAte > hojeISO() ? m.pagoAte : hojeISO(), 30)}"></label>
        <label class="campo">Valor recebido<input name="valor" inputmode="decimal" placeholder="${fin?.total ? String(fin.total).replace('.', ',') : '0,00'}"></label>
        <div><button class="acao primaria">Registrar pagamento</button></div></form>
      <div class="acoes" style="margin-top:12px">
        <button class="acao" data-a="pix">Enviar link de pagamento</button>
        <button class="acao" data-a="pixcopiar">Copiar link do Pix</button>
        ${m.status === 'congelada' ? '<button class="acao" data-a="descongelar">Encerrar congelamento</button>' : '<button class="acao" data-a="congelar">Congelar plano</button>'}
        <button class="acao" data-a="bloquear">${m.bloqueada ? 'Desbloquear' : 'Bloquear'}</button>
        ${m.status !== 'cancelada' ? '<button class="acao perigo" data-a="cancelar">Cancelar matrícula</button>' : ''}
      </div></div>` : ''}
    <div class="secao"><h3>Novidades no WhatsApp (LGPD)</h3>
      ${contato.optoutEm ? `<p style="margin:4px 0">Pediu para não receber em ${dataHoraBR(contato.optoutEm)}. Cobranças continuam só informativas.</p>`
        : contato.marketingConsentidoEm ? `<p style="margin:4px 0">${estado('aceito', 'autorizou')} ${dataHoraBR(contato.marketingConsentidoEm)} ${esc(origemOk[contato.evidencia?.origem] || '')}${contato.evidencia?.operador ? ` · ${esc(contato.evidencia.operador)}` : ''}</p>`
        : '<p class="vazio" style="padding:0">Ainda não autorizou mensagens de novidades e campanhas.</p>'}
      <div class="acoes" style="margin-top:8px">
        ${contato.marketingConsentidoEm ? '<button class="acao" data-ok="nao">Registrar que não quer mais</button>' : '<button class="acao" data-ok="sim">Aluno autorizou agora</button>'}
      </div></div>
    <div class="secao"><h3>Contratos</h3>${contratos.length ? contratos.map((c) => `<p style="margin:4px 0">${esc(c.titulo)} ${estado(c.status)} <small class="sub">${dataBR(c.enviadoEm)}</small></p>`).join('') : '<p class="vazio" style="padding:0">Nenhum contrato.</p>'}</div>

      if (concedido && !detalhe) return;
      agir(b, () => api(`/retencao/alunos/${customerId}/consentimento`, { metodo: 'POST', corpo: { concedido, detalhe } }), concedido ? 'Autorização registrada.' : 'Registrado: não recebe mais novidades.').then((r) => r && abrirAluno(customerId));
    };
  });
  if (!m) return;
  $('#fPag', corpo).onsubmit = (ev) => { ev.preventDefault(); agir(ev.submitter, () => api(`/acesso/matriculas/${m.id}/pagamento`, { metodo: 'POST', corpo: form(ev.target) }), 'Pagamento registrado. A catraca já foi atualizada.').then((r) => r && abrirAluno(customerId)); };
  $('#fPerfil', corpo).onsubmit = (ev) => { ev.preventDefault(); const d = form(ev.target); agir(ev.submitter, () => api(`/retencao/alunos/${customerId}/perfil`, { metodo: 'PUT', corpo: d }), 'Perfil salvo.'); };
  corpo.querySelectorAll('button[data-a]').forEach((b) => { b.onclick = () => acaoAluno(b, b.dataset.a, m, customerId); });
}
async function acaoAluno(b, a, m, customerId) {
  if (a === 'pix') return agir(b, () => api(`/retencao/alunos/${customerId}/link-pagamento`, { metodo: 'POST', corpo: { enviar: true } }), 'Link enviado no WhatsApp do aluno.');
  if (a === 'pixcopiar') {
    const r = await agir(b, () => api(`/retencao/alunos/${customerId}/link-pagamento`, { metodo: 'POST', corpo: {} }));
    if (r?.link) { try { await navigator.clipboard.writeText(r.link); aviso(`Link de ${r.valorFormatado} copiado.`); } catch { prompt('Copie o link do Pix:', r.link); } }
    return;
  }
  if (a === 'congelar') {
    const dias = prompt('Congelar por quantos dias? Os dias voltam no vencimento.', '15');
    if (!dias) return;
    return agir(b, () => api(`/retencao/alunos/${customerId}/congelar`, { metodo: 'POST', corpo: { dias: Number(dias) } }), (r) => `Congelado até ${dataBR(r.fim)}. Volta em ${dataBR(r.voltaEm)}.`).then((r) => r && abrirAluno(customerId));
  }
  if (a === 'descongelar') {
    if (!confirm('Encerrar o congelamento agora? Os dias não usados saem do vencimento.')) return;
    return agir(b, () => api(`/retencao/alunos/${customerId}/descongelar`, { metodo: 'POST', corpo: {} }), (r) => `Congelamento encerrado. ${r.diasDevolvidos} dia(s) não usados ajustados.`).then((r) => r && abrirAluno(customerId));
  }
  if (a === 'bloquear') {
    const motivo = m.bloqueada ? null : prompt('Motivo do bloqueio (fica no histórico):');
    if (!m.bloqueada && !motivo) return;
    return agir(b, () => api(`/acesso/matriculas/${m.id}/bloqueio`, { metodo: 'POST', corpo: { bloqueada: !m.bloqueada, motivo } }), m.bloqueada ? 'Desbloqueado.' : 'Bloqueado. O aluno saiu da catraca.').then((r) => r && abrirAluno(customerId));
  }
  if (a === 'cancelar') {
    const motivo = prompt('Por que o aluno está saindo? (preço, horário, mudança, saúde, resultado, atendimento, estrutura, tempo ou outro)', 'outro');
    if (motivo === null) return;
    const categoria = ['preco', 'horario', 'mudanca', 'saude', 'resultado', 'atendimento', 'estrutura', 'tempo'].find((c) => motivo.toLowerCase().normalize('NFD').replace(/[^a-z]/g, '').startsWith(c)) || 'outro';
    await agir(b, async () => {
      await api(`/retencao/alunos/${customerId}/motivo`, { metodo: 'POST', corpo: { categoria, detalhe: motivo } });
      return api(`/acesso/matriculas/${m.id}/status`, { metodo: 'POST', corpo: { status: 'cancelada' } });
    }, 'Matrícula cancelada e motivo registrado.');
    return abrirAluno(customerId);
  }
}

let semanaInicio = null;
async function telaAulas() {
  if (!semanaInicio) { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); semanaInicio = d.toLocaleDateString('en-CA'); }
  const fim = somarDias(semanaInicio, 6);
  const [grade, modalidades] = await Promise.all([api(`/aulas/grade?de=${semanaInicio}&ate=${fim}`), api('/aulas/modalidades')]);
  const dias = Array.from({ length: 7 }, (_, i) => somarDias(semanaInicio, i));
  const hoje = hojeISO();
  $('#tela').innerHTML = `
    <div class="topo"><div><h1>Aulas</h1><p class="sub">Semana de ${dataBR(semanaInicio)} a ${dataBR(fim)}. Verde tem vaga, amarelo quase cheia, vermelho lotada.</p></div>
      <div class="acoes"><button class="acao" id="ant">Semana anterior</button><button class="acao" id="prox">Próxima semana</button><button class="acao primaria" id="novaTurma">Nova turma</button></div></div>
    <section class="bloco"><div class="semana">${dias.map((d) => {
      const doDia = grade.filter((a) => new Date(a.inicio).toLocaleDateString('en-CA') === d);
      const nome = new Date(`${d}T12:00:00`).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit' });
      return `<div class="dia${d === hoje ? ' hoje' : ''}"><h3>${esc(nome)}</h3>${doDia.map((a) => {
        const taxa = a.ocupadas / a.capacidade;
        const cls = a.status === 'cancelada' ? 'cancelada' : taxa >= 1 ? 'cheia' : taxa >= 0.8 ? 'quase' : '';
        return `<button class="aula ${cls}" data-id="${a.id}"><b>${hora(a.inicio)} ${esc(a.modalidade)}</b><small>${a.ocupadas}/${a.capacidade}${a.fila ? ` · fila ${a.fila}` : ''}${a.professor ? ` · ${esc(a.professor)}` : ''}</small></button>`;
      }).join('') || '<p class="vazio" style="padding:0;font-size:.9rem">Sem aulas</p>'}</div>`;
    }).join('')}</div></section>
    <section class="bloco"><h2>Modalidades</h2>${modalidades.length ? `<div class="rolagem"><table><thead><tr><th>Modalidade</th><th>Reserva abre</th><th>Cancelar sem falta</th><th>Faltas para bloquear</th></tr></thead><tbody>${modalidades.map((m) => `<tr><td>${esc(m.nome)}</td><td>${m.abertura_dias} dias antes</td><td>até ${m.cancelamento_min_antes} min antes</td><td>${m.noshow_limite_mes} no mês</td></tr>`).join('')}</tbody></table></div>` : '<p class="vazio">Crie a primeira modalidade ao cadastrar uma turma.</p>'}</section>`;
  $('#ant').onclick = () => { semanaInicio = somarDias(semanaInicio, -7); navegar(); };
  $('#prox').onclick = () => { semanaInicio = somarDias(semanaInicio, 7); navegar(); };
  $('#novaTurma').onclick = () => novaTurma(modalidades);
  $('#tela').querySelectorAll('.aula').forEach((b) => { b.onclick = () => abrirAula(grade.find((a) => a.id === b.dataset.id)); });
}

    <div id="qCorpo"></div>`;
  const corpo = $('#qCorpo');
  const indexar = () => new Map(g.quadras.flatMap((q) => q.reservas.map((r) => [r.id, { q, r }])));
  let indice = new Map();
  if (!todas.length) {
    corpo.innerHTML = '<section class="bloco"><h2>Nenhuma quadra cadastrada</h2><p class="sub">Cadastre as quadras do clube (ex.: 7 de saibro e 7 de beach tennis) e o horário de funcionamento.</p><a class="acao primaria" href="#ajustes">Cadastrar quadras</a></section>';
  } else if (!g.aberto) {
    corpo.innerHTML = '<section class="bloco"><p class="vazio">O clube não abre neste dia. Para mudar, ajuste o funcionamento em <a href="#ajustes">Ajustes</a>.</p></section>';
  } else {
    corpo.innerHTML = `<section class="bloco" style="padding:0"><div class="qwrap"><table class="qgrade">${gradeQuadrasHtml(g)}</table></div></section>
      <div class="legenda"><span><i style="background:var(--libera)"></i>Sócio</span><span><i style="background:var(--foco)"></i>Avulso</span><span><i style="background:var(--espera)"></i>Aula, torneio, manutenção</span><span>Toque num horário livre para reservar.</span></div>`;
    indice = indexar();
    // hoje: abre a grade já no horário atual (uma linha acima, para dar contexto)
    const atual = corpo.querySelector('tr.agora');
    if (atual) { const w = corpo.querySelector('.qwrap'); w.scrollTop = Math.max(0, atual.offsetTop - w.querySelector('thead').offsetHeight - atual.offsetHeight); }
    corpo.querySelector('table').addEventListener('click', (ev) => {
      const b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.reserva) { const x = indice.get(b.dataset.reserva); return verReservaQuadra(x.q, x.r, g); }
      if (b.dataset.passado) return;
      novaReservaQuadra(g, b.dataset.quadra, b.dataset.hora);
    });
  }
  const ir = (d) => { quadrasDia = d; navegar(); };
  $('#qAntes').onclick = () => ir(somarDias(g.data, -1));
  $('#qDepois').onclick = () => ir(somarDias(g.data, 1));
  $('#qHoje').onclick = () => ir(hojeISO());
  $('#qDia').onchange = (ev) => { if (ev.target.value) ir(ev.target.value); };
  if ($('#qMod')) $('#qMod').onchange = (ev) => { quadrasModalidade = ev.target.value; navegar(); };
  // a grade se atualiza sozinha enquanto a tela está aberta (reservas pelo WhatsApp), sem perder a rolagem
  const timer = setInterval(async () => {
    const tabela = $('.qgrade');
    if (!tabela || $('#gaveta').open) return;
    try {
      const novo = await api(url);
      if (novo.quadras.length !== g.quadras.length || novo.horarios.length !== g.horarios.length) return navegar();
      g = novo; tabela.innerHTML = gradeQuadrasHtml(g); indice = indexar();
    } catch { /* tenta de novo no próximo minuto */ }
  }, 60000);
  pararRecepcao = () => clearInterval(timer);
}

/** "Ana Beatriz Souza Lima" → "Ana Lima" (ou "Ana L." se ainda for longo) para caber na célula. */
function nomeCurto(nome) {
  const p = String(nome || '').trim().split(/\s+/);
  if (p.length < 2 || String(nome).length <= 14) return String(nome || '');
  const dois = `${p[0]} ${p[p.length - 1]}`;
  return dois.length <= 14 ? dois : `${p[0]} ${p[p.length - 1][0]}.`;
}
/** Linhas = horários (passo do clube); cada reserva ocupa as linhas que cruza (rowspan). */
function gradeQuadrasHtml(g) {
  const passo = g.intervaloMin;
  const linhas = g.horarios.map(minQ);
  const agora = g.agora ? minQ(g.agora) : (g.passou ? 1440 : -1);
  const dono = g.quadras.map((q) => linhas.map((m) => q.reservas.find((r) => minQ(r.inicio) < m + passo && (r.fim === '24:00' ? 1440 : minQ(r.fim)) > m) || null));
  const cab = `<thead><tr><th class="h" scope="col"><span class="oculto">Hora</span></th>${g.quadras.map((q) => `<th scope="col">${esc(q.nome)}<small>${esc(q.modalidadeRotulo)}${q.pisoRotulo && !q.nome.toLowerCase().includes(q.pisoRotulo.toLowerCase()) ? ` · ${esc(q.pisoRotulo)}` : ''}</small></th>`).join('')}</tr></thead>`;
  const corpo = linhas.map((m, i) => {
    const passado = m + passo <= agora;
    const atual = agora >= m && agora < m + passo;
    const cels = g.quadras.map((q, j) => {
      const r = dono[j][i];
      if (r) {
        if (i > 0 && dono[j][i - 1] === r) return '';
        let span = 1; while (i + span < linhas.length && dono[j][i + span] === r) span += 1;
        const classe = ['socio'].includes(r.tipo) ? '' : (r.tipo === 'avulso' ? 'avulso' : 'bloqueio');
        const quem = r.nome || r.titulo || r.tipoRotulo;
        const curto = r.nome ? nomeCurto(r.nome) : quem;
        return `<td class="ocup ${classe}" rowspan="${span}"><button type="button" data-reserva="${r.id}" title="${esc(quem)}" aria-label="${esc(`${q.nome}, ${r.inicio} às ${r.fim}: ${quem}`)}"><b>${esc(curto)}</b><small>${r.inicio}–${r.fim}${r.tipo !== 'socio' ? ` · ${esc(r.tipoRotulo)}` : ''}${r.origem === 'whatsapp' ? ' · WhatsApp' : ''}</small></button></td>`;
      }
      return `<td><button type="button" class="livre" data-quadra="${q.id}" data-hora="${horaQ(m)}" ${passado ? 'data-passado="1" tabindex="-1"' : ''} aria-label="${esc(`Reservar ${q.nome} às ${horaQ(m)}`)}">+</button></td>`;
    }).join('');
    return `<tr class="${passado ? 'passado' : ''} ${atual ? 'agora' : ''}"><th class="h" scope="row">${horaQ(m)}</th>${cels}</tr>`;
  }).join('');
  return `${cab}<tbody>${corpo}</tbody>`;
}

      </div>

      <label class="campo">Duração<select name="duracaoMin">${duracoes.map((d) => `<option value="${d}" ${d === g.duracaoMin ? 'selected' : ''}>${d >= 60 ? `${Math.floor(d / 60)}h${d % 60 ? d % 60 : ''}` : `${d} min`}</option>`).join('')}<option value="dia" class="oculto" id="rqDia">Até o fechamento</option></select></label>
      <label class="campo largo">Observação (opcional)<input name="observacao" maxlength="300" placeholder="Ex.: dupla com o João"></label>
      <div class="largo"><button class="acao primaria">Reservar</button></div>
    </form>`);
  const f = $('#fRq', corpo);
  const trocarTipo = () => {
    const t = f.tipo.value;
    $('#rqSocio', corpo).classList.toggle('oculto', t === 'bloqueio');
    $('#rqNome', corpo).classList.toggle('oculto', t !== 'avulso');
    $('#rqBloqueio', corpo).classList.toggle('oculto', t !== 'bloqueio');
    $('#rqDia', corpo).classList.toggle('oculto', t !== 'bloqueio');
    $('#rqBusca', corpo).placeholder = t === 'avulso' ? 'Opcional: se já tem cadastro' : 'Nome ou telefone';
  };
  f.querySelectorAll('input[name=tipo]').forEach((r) => { r.onchange = trocarTipo; });
  let t;
  $('#rqBusca', corpo).oninput = (ev) => {
    clearTimeout(t); f.customerId.value = '';
    t = setTimeout(async () => {
      const termo = ev.target.value.trim();
      const l = termo.length >= 2 ? await api(`/acesso/clientes?busca=${encodeURIComponent(termo)}`).catch(() => []) : [];
      $('#rqAchados', corpo).innerHTML = l.map((c) => `<button type="button" class="acao" style="margin:0 6px 6px 0" data-id="${c.id}">${esc(c.nome)} ${c.telefone ? `<small>${esc(c.telefone)}</small>` : ''}</button>`).join('')
        || (termo.length >= 2 ? `<p class="vazio" style="padding:0">Ninguém com esse nome. Para cadastrar, use <a href="#alunos">Nova adesão</a> ou marque “Avulso”.</p>` : '');
    }, 250);
  };
  $('#rqAchados', corpo).onclick = (ev) => {
    const b = ev.target.closest('button[data-id]'); if (!b) return;
    f.customerId.value = b.dataset.id; $('#rqBusca', corpo).value = b.textContent.trim(); $('#rqAchados', corpo).innerHTML = '';
  };
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const d = form(f);
    const bloqueio = d.tipo === 'bloqueio';
    if (d.tipo === 'socio' && !d.customerId) return aviso(`Escolha o ${TERMO.aluno} na busca.`, true);
    if (d.tipo === 'avulso' && !d.customerId && !String(d.titulo || '').trim()) return aviso('Informe o nome de quem vai jogar.', true);
    let duracao = d.duracaoMin;
    if (duracao === 'dia') {
      const ini = minQ(d.hora);
      const faixa = g.faixas.map((x) => ({ a: minQ(x.abre), f: x.fecha === '24:00' ? 1440 : minQ(x.fecha) })).find((x) => ini >= x.a && ini < x.f);
      if (!faixa) return aviso('Início fora do horário de funcionamento.', true);
      duracao = faixa.f - ini;

    const corpoReq = {

      tipo: bloqueio ? d.motivo : d.tipo, customerId: bloqueio ? null : (d.customerId || null),

    };
    const r = await agir(ev.submitter, () => api('/quadras/reservas', { metodo: 'POST', corpo: corpoReq }), (x) => `Reservado: ${x.rotulo}.`);
    if (r) { $('#gaveta').close(); navegar(); }
  };

/* Ajustes das quadras: horário de funcionamento, regras e cadastro */
function resumoFuncionamento(cfg) {
  const txt = (d) => (cfg.funcionamento[String(d)] || []).map((f) => `${f.abre}–${f.fecha}`).join(', ') || 'fechado';
  const grupos = [];
  for (let d = 0; d < 7; d += 1) {
    const t = txt(d);
    const ult = grupos[grupos.length - 1];
    if (ult && ult.t === t) ult.ate = d; else grupos.push({ de: d, ate: d, t });
  }
  if (grupos.length === 1) return `Todos os dias, ${grupos[0].t}`;
  return grupos.map((x) => `${DIAS_Q[x.de]}${x.ate !== x.de ? ` a ${DIAS_Q[x.ate].toLowerCase()}` : ''}: ${x.t}`).join(' · ');
}
function blocoQuadrasAjustes(cfg, quadras) {
  return `<section class="bloco" id="ajQuadras"><div class="topo" style="margin-bottom:10px"><div><h2 style="margin:0">Quadras e horário</h2><p class="sub" style="margin:4px 0 0">${esc(resumoFuncionamento(cfg))} · reserva de ${cfg.duracaoMin} min${cfg.configurado ? '' : ' <b>(padrão: ajuste o horário do clube)</b>'}</p></div>
    <div class="acoes"><button class="acao" id="qCfg">Horário e regras</button><button class="acao" id="qLote">Adicionar várias</button><button class="acao primaria" id="qNova">Nova quadra</button></div></div>
    ${quadras.length ? `<div class="rolagem"><table><thead><tr><th>Quadra</th><th>Modalidade</th><th>Piso</th><th>Avulso/hora</th><th>Situação</th></tr></thead><tbody>${quadras.map((q) => `
      <tr class="clicavel" data-quadra="${q.id}" tabindex="0"><td>${esc(q.nome)}</td><td>${esc(q.modalidadeRotulo)}</td><td>${esc(q.pisoRotulo || '—')}${q.coberta ? ' · coberta' : ''}</td><td>${reais(q.valorHoraAvulso)}</td><td>${q.ativa ? estado('ativa', 'ativa') : estado('cancelada', 'desativada')}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="vazio">Nenhuma quadra. Use “Adicionar várias” para criar, por exemplo, 7 quadras de saibro de uma vez.</p>'}</section>`;
}
function ligarQuadrasAjustes(cfg, quadras) {

function opcoesQ(mapa, atual, vazio = '') {
  return `${vazio ? `<option value="">${vazio}</option>` : ''}${Object.entries(mapa).map(([k, v]) => `<option value="${k}" ${k === atual ? 'selected' : ''}>${v}</option>`).join('')}`;
}
function configurarQuadras(cfg) {
  // o formulário edita uma faixa por dia; com mais de uma (ex.: 06–12 e 14–22, gravado pela API), não mexe no funcionamento
  const variasFaixas = Object.values(cfg.funcionamento).some((f) => (f || []).length > 1);
  const opcoesMin = (lista, atual) => [...new Set([...lista, atual])].sort((a, b) => a - b).map((d) => `<option value="${d}" ${d === atual ? 'selected' : ''}>${d} min</option>`).join('');
  const linha = (d) => {
    const f = (cfg.funcionamento[String(d)] || [])[0];
    return `<b>${DIAS_Q[d]}</b><label class="linha-check"><input type="checkbox" data-aberto="${d}" ${f ? 'checked' : ''}> abre</label>
      <input type="time" data-abre="${d}" value="${f?.abre || '06:00'}" step="900" aria-label="Abre ${DIAS_Q[d]}"><input type="time" data-fecha="${d}" value="${f && f.fecha !== '24:00' ? f.fecha : (f ? '00:00' : '22:00')}" step="60" aria-label="Fecha ${DIAS_Q[d]} (00:00 = meia-noite)">`;
  };
  const corpo = gaveta('Horário e regras das quadras', 'Vale para a grade da recepção e para as reservas pelo WhatsApp.', `
    <form class="form" id="fQc">
      ${variasFaixas ? `<div class="largo aviso">Funcionamento com mais de uma faixa por dia: ${esc(resumoFuncionamento(cfg))}. Ele fica como está; aqui você muda só as regras.</div>` : `<div class="largo"><h3>Funcionamento</h3><p class="sub" style="margin:0 0 8px">Fechar às 00:00 = aberto até meia-noite.</p><div class="dias-func">${[1, 2, 3, 4, 5, 6, 0].map(linha).join('')}</div>
        <button type="button" class="acao" id="qCopiar" style="margin-top:10px">Usar o horário de segunda em todos os dias</button></div>`}
      <label class="campo">Duração de uma reserva<select name="duracaoMin">${opcoesMin([30, 45, 60, 90, 120], cfg.duracaoMin)}</select></label>
      <label class="campo">Horários na grade a cada<select name="intervaloMin">${opcoesMin([15, 30, 60], cfg.intervaloMin)}</select></label>
      <label class="campo">Sócio reserva com até<span class="ajuda">dias de antecedência</span><input type="number" name="aberturaDias" min="0" max="90" value="${cfg.aberturaDias}"></label>
      <label class="campo">Reservas futuras por sócio<span class="ajuda">a recepção pode passar do limite</span><input type="number" name="limiteReservasFuturas" min="1" max="50" value="${cfg.limiteReservasFuturas}"></label>
      <label class="campo">Cancelar sem marcar atraso<span class="ajuda">minutos antes do horário</span><input type="number" name="cancelamentoMinAntes" min="0" max="2880" value="${cfg.cancelamentoMinAntes}"></label>
      <label class="linha-check largo"><input type="checkbox" name="exigeSocioEmDia" ${cfg.exigeSocioEmDia ? 'checked' : ''}> Reserva de sócio só com mensalidade em dia</label>
      <div class="largo"><button class="acao primaria">Salvar</button></div>
    </form>`);
  const f = $('#fQc', corpo);
  if ($('#qCopiar', corpo)) $('#qCopiar', corpo).onclick = () => {
    const a = f.querySelector('[data-abre="1"]').value; const z = f.querySelector('[data-fecha="1"]').value; const on = f.querySelector('[data-aberto="1"]').checked;
    for (let d = 0; d < 7; d += 1) { f.querySelector(`[data-abre="${d}"]`).value = a; f.querySelector(`[data-fecha="${d}"]`).value = z; f.querySelector(`[data-aberto="${d}"]`).checked = on; }
  };
  f.onsubmit = (ev) => {
    ev.preventDefault();
    let funcionamento;
    if (!variasFaixas) {
      funcionamento = {};
      for (let d = 0; d < 7; d += 1) {
        const fecha = f.querySelector(`[data-fecha="${d}"]`).value;
        funcionamento[d] = f.querySelector(`[data-aberto="${d}"]`).checked ? [{ abre: f.querySelector(`[data-abre="${d}"]`).value, fecha: fecha === '00:00' || fecha === '23:59' ? '24:00' : fecha }] : [];
      }
    }
    const d = form(f);
    agir(ev.submitter, () => api('/quadras/config', { metodo: 'PUT', corpo: {
      ...(funcionamento ? { funcionamento } : {}), duracaoMin: d.duracaoMin, intervaloMin: d.intervaloMin, aberturaDias: d.aberturaDias,
      limiteReservasFuturas: d.limiteReservasFuturas, cancelamentoMinAntes: d.cancelamentoMinAntes, exigeSocioEmDia: Boolean(d.exigeSocioEmDia),
    } }), 'Horário salvo.').then((r) => { if (r) { $('#gaveta').close(); navegar(); } });
  };
}

function editarQuadra(q) {
  const corpo = gaveta(q ? q.nome : 'Nova quadra', 'Aparece na grade de reservas e para o WhatsApp.', `
    <form class="form" id="fQ">
      <label class="campo largo">Nome<input name="nome" required maxlength="80" value="${esc(q?.nome || '')}" placeholder="Ex.: Saibro 1, Central, Beach 3"></label>

      .then((r) => { if (r) { $('#gaveta').close(); navegar(); } });
  };
}

      <label class="campo largo">Nome<input name="nome" required value="${esc(p?.nome || '')}"></label>
      <label class="campo">Mensalidade<input name="valorMensal" inputmode="decimal" value="${p?.valorMensal ?? ''}" placeholder="129,90"></label>
      <label class="campo">Fidelidade (meses)<input type="number" name="fidelidadeMeses" min="1" max="60" value="${p?.fidelidadeMeses ?? ''}"></label>
      <label class="campo">Tolerância de atraso (dias)<input type="number" name="toleranciaDias" min="0" max="60" value="${p?.toleranciaDias ?? 5}"></label>
      <label class="campo">Acessos por dia<input type="number" name="limitePorDia" min="1" max="20" value="${p?.limitePorDia ?? ''}" placeholder="livre"></label>
      <label class="campo">Acessos por semana<input type="number" name="limitePorSemana" min="1" max="50" value="${p?.limitePorSemana ?? ''}" placeholder="livre"></label>
      <label class="campo">Congelamento por ano (dias)<input type="number" name="congelamentoMaxDiasAno" min="0" max="180" value="${p?.congelamentoMaxDiasAno ?? 30}"></label>
      <label class="campo">Congelamento mínimo (dias)<input type="number" name="congelamentoMinDias" min="1" max="90" value="${p?.congelamentoMinDias ?? 7}"></label>
      <label class="linha-check"><input type="checkbox" name="exigeReserva" ${p?.exigeReserva ? 'checked' : ''}> Só entra com aula reservada</label>
      ${p ? `<label class="linha-check"><input type="checkbox" name="ativo" ${p.ativo ? 'checked' : ''}> Plano ativo</label>` : ''}
      <div class="largo"><button class="acao primaria">${p ? 'Salvar plano' : 'Criar plano'}</button></div>
    </form>`);
  $('#fPlano', corpo).onsubmit = (ev) => {
    ev.preventDefault();
    const d = form(ev.target);
    d.exigeReserva = Boolean(d.exigeReserva);
    if (p) d.ativo = Boolean(d.ativo);
    if (p?.horarios) d.horarios = p.horarios;
    agir(ev.submitter, () => api(p ? `/acesso/planos/${p.id}` : '/acesso/planos', { metodo: p ? 'PUT' : 'POST', corpo: d }), 'Plano salvo.').then((r) => { if (r) { $('#gaveta').close(); navegar(); } });
  };
}

navegar();
</script>
</body>
</html>
