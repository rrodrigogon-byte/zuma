version: '3.8'

# ============================================================================
# KYTTO ERP ENTERPRISE - SOVEREIGN ON-PREMISE STACK
# Arquitetura completa para implantação local, híbrida ou private cloud
# ============================================================================

networks:
  kytto-net:
    driver: bridge

volumes:
  kytto-pgdata:
    driver: local
  kytto-redisdata:
    driver: local
  kytto-wahadata:
    driver: local
  kytto-backups:
    driver: local

services:
  # --------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL 15 com persistência e migrações automáticas
  # --------------------------------------------------------------------------
  kytto-db:
    image: postgres:15-alpine
    container_name: kytto-sovereign-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kytto_enterprise}
      POSTGRES_USER: ${POSTGRES_USER:-kytto_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kytto_super_secure_pass_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kytto-pgdata:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kytto_admin} -d ${POSTGRES_DB:-kytto_enterprise}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kytto-net

  # --------------------------------------------------------------------------
  # 2. Redis 7 para cache de alta performance e filas assíncronas do EventBus
  # --------------------------------------------------------------------------
  kytto-redis:
    image: redis:7-alpine
    container_name: kytto-sovereign-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-kytto_redis_pass_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kytto-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kytto_redis_pass_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kytto-net

  # --------------------------------------------------------------------------
  # 3. WAHA (WhatsApp HTTP API Core) para Gateway WhatsApp On-Premise
  # --------------------------------------------------------------------------
  kytto-waha:
    image: devlikeapro/waha:latest
    container_name: kytto-sovereign-waha
    restart: always
    environment:
      WHATSAPP_HOOK_URL: http://kytto-erp:8080/api/whatsapp/webhook
      WHATSAPP_HOOK_EVENTS: message,message.any,state.change,group.join
      WAHA_ZIP_LOGS: "true"
      WAHA_PRINT_QR: "false"
    ports:
      - "${WAHA_PORT:-3008}:3000"
    volumes:
      - kytto-wahadata:/app/.sessions
    networks:
      - kytto-net

  # --------------------------------------------------------------------------
  # 4. Aplicação Principal Kytto ERP (Web React + API Express + IA Copilot)
  # --------------------------------------------------------------------------
  kytto-erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kytto-sovereign-app
    restart: always
    environment:
      NODE_ENV: production
      PORT: 8080
      KYTTO_DEPLOYMENT_MODE: on-premise
      DATABASE_URL: postgres://${POSTGRES_USER:-kytto_admin}:${POSTGRES_PASSWORD:-kytto_super_secure_pass_2026}@kytto-db:5432/${POSTGRES_DB:-kytto_enterprise}
      REDIS_URL: redis://:${REDIS_PASSWORD:-kytto_redis_pass_2026}@kytto-redis:6379
      WAHA_API_URL: http://kytto-waha:3000
      JWT_SECRET: ${JWT_SECRET:-kytto-enterprise-sovereign-secret-token-key-2026}
      KYTTO_LICENSE_KEY: ${KYTTO_LICENSE_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      kytto-db:
        condition: service_healthy
      kytto-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - kytto-net

  # --------------------------------------------------------------------------
  # 5. Rotina de Backup Automático Diário (Cold & Hot Backup)
  # --------------------------------------------------------------------------
  kytto-backup:
    image: postgres:15-alpine
    container_name: kytto-sovereign-backup
    restart: always
    environment:
      PGHOST: kytto-db
      PGUSER: ${POSTGRES_USER:-kytto_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:-kytto_super_secure_pass_2026}
      PGDATABASE: ${POSTGRES_DB:-kytto_enterprise}
    volumes:
      - kytto-backups:/backups
    entrypoint: |
      /bin/sh -c '
      echo "Iniciando agendador de backup On-Premise Kytto...";
      while true; do
        DATE=$$(date +%Y%m%d_%H%M%S);
        echo "Executando dump de segurança em $${DATE}...";
        pg_dump -Fc -f /backups/kytto_backup_$${DATE}.dump;
        # Mantém backups dos últimos 30 dias
        find /backups -type f -name "*.dump" -mtime +30 -delete;
        echo "Backup concluído com sucesso. Próxima execução em 24h.";
        sleep 86400;
      done
      '
    depends_on:
      kytto-db:
        condition: service_healthy
    networks:
      - kytto-net
