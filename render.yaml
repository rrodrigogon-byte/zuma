# ⚠️ PRODUÇÃO: o serviço setpoint publica SOMENTE a branch fix/kytto-comandas-pdv-20260808.
# Não remova `branch:`, `preDeployCommand`, `numInstances: 1` nem o `--include=dev` do build. Leia AGENTS.md.
# Deploy do SetPoint no Render (https://render.com) — 1 clique via Blueprint.
# Sobe a API + site como um único Web Service Node, com disco persistente para o banco.
services:
  - type: web
    name: setpoint
    branch: fix/kytto-comandas-pdv-20260808   # NÃO trocar para main
    runtime: node
    plan: starter            # free/starter; suba conforme a demanda
    # O banco JSON (agenda, clientes, comandas, clube) aceita UM processo gravando:
    # não escale horizontalmente enquanto ele existir. Suba o plano (vertical) se precisar.
    numInstances: 1
    region: oregon
    buildCommand: cd web && npm install --include=dev && npm run build && cp -R dist/. ../app/public/ && cd ../app && npm install && cd .. && npm run test:fast
    preDeployCommand: cd app && npm run commerce:schema:apply
    startCommand: cd app && node server.js
    healthCheckPath: /health
    autoDeploy: true    # SEMPRE ligado (decisão 06/10/2026); merge na produção = deploy
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      - key: JWT_SECRET
        generateValue: true   # segredo forte gerado pelo Render
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        sync: false           # defina manualmente no painel (não versionar senha)
      - key: DB_PATH
        value: /var/data/db.json
      - key: DATABASE_URL
        fromDatabase:
          name: kytto-commerce-core
          property: connectionString
      - key: INFINITEPAY_HANDLE
        value: "rodrigo-ribeiro-d8a"
      - key: PIX_CHAVE
        value: "43084070000188"   # CNPJ do clube — chave Pix estática
      - key: PIX_NOME
        value: "AGRO OPEN TTC"
      - key: PIX_CIDADE
        value: "TANGARA DA SERRA"
    disk:
      name: setpoint-data
      mountPath: /var/data    # o DB_PATH aponta para cá — sobrevive a deploys
      sizeGB: 1

databases:
  - name: kytto-commerce-core
    plan: basic-256mb
    databaseName: kytto_commerce_core
    diskSizeGB: 1
