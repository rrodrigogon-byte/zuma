<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias do Tênis · Agro Open</title>
<meta name="description" content="Notícias do tênis mundial e brasileiro — ATP, WTA e circuito nacional.">
<link rel="icon" href="img/logo-ao-oficial.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .news{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.news{grid-template-columns:1fr}}
  .nitem{display:block;background:linear-gradient(165deg,var(--panel),var(--deep2));border:1px solid var(--line);border-radius:14px;padding:22px;transition:.25s}
  .nitem:hover{transform:translateY(-3px);border-color:rgba(143,214,74,.4)}
  .nitem h3{font-size:18px;margin-bottom:8px}
  .nitem p{color:var(--muted);font-size:14px}
  .nitem .src{font-size:12px;color:var(--lime);font-weight:700;margin-top:12px;letter-spacing:.04em}
  .sources{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  .sources a{background:var(--deep2);border:1px solid var(--line);border-radius:100px;padding:10px 18px;font-weight:600;font-size:14px}
  .sources a:hover{border-color:var(--lime);color:var(--lime)}
  .flag{font-size:12px;color:var(--muted2);margin-bottom:18px}
  .live{color:var(--lime);font-weight:700}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="ball"></span>AGRO <span class="lime">OPEN</span></a>
    <div class="navlinks">
      <a href="index.html">Site</a><a href="ranking.html">Ranking</a><a href="noticias.html" class="active">Notícias</a>
      <a href="regras.html">Regras</a><a href="chaves.html">Chaves</a><a href="sorteio.html">Sorteio</a>
    </div>
  </div>
</header>

<div class="wrap hero">
  <div class="kick">Imprensa</div>
  <h1>Notícias do <span class="lime">tênis</span>.</h1>
  <p>O que move o circuito mundial e nacional — ATP, WTA e o tênis brasileiro.</p>
</div>

<div class="wrap">
  <div class="flag" id="flag"></div>
  <div class="news" id="news"></div>
  <h3 style="font-size:20px;margin:34px 0 8px">Fontes oficiais</h3>
  <div class="sources" id="sources"></div>
</div>

<footer class="app">AGRO OPEN · Agregador de notícias com atribuição às fontes originais. Configure a API para feed ao vivo.</footer>

<script>
const $=s=>document.querySelector(s);
(async()=>{
  try{
    const d=await (await fetch('/api/noticias')).json();
    $('#flag').innerHTML=`Atualizado ${d.atualizado||''} · ${d.live?'<span class="live">● AO VIVO</span>':'snapshot'} · ${d.fonte||''}`;
    $('#news').innerHTML=(d.itens||[]).map(n=>`<a class="nitem" href="${n.url}" target="_blank" rel="noopener"><h3>${n.titulo}</h3><p>${n.resumo||''}</p><div class="src">${n.fonte||''} ${n.data?('· '+new Date(n.data).toLocaleDateString('pt-BR')):''} →</div></a>`).join('');
    $('#sources').innerHTML=(d.fontes_oficiais||[]).map(f=>`<a href="${f.url}" target="_blank" rel="noopener">${f.nome} →</a>`).join('');
  }catch(e){
    $('#news').innerHTML='<p class="muted">Inicie o servidor (npm start) para carregar as notícias.</p>';
  }
})();
</script>
</body>
</html>
