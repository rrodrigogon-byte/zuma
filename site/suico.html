<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Suíço · Agro Open</title>
<meta name="description" content="Torneios no sistema suíço: classificação e rodadas por desempenho.">
<link rel="icon" href="img/logo-ao-oficial.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>.pos1 td:first-child{color:var(--gold)}.toprow td{font-weight:700}
  .jogo{display:flex;justify-content:space-between;background:var(--deep2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:14px}.win{color:var(--lime);font-weight:700}</style>
</head>
<body>
<header class="app">
  <div class="wrap"><a href="index.html" class="brand"><span class="ball"></span>AGRO <span class="lime">OPEN</span></a>
  <div class="navlinks"><a href="index.html">Site</a><a href="chaves.html">Chaves</a><a href="ligas.html">Ligas</a><a href="grupos.html">Grupos</a><a href="suico.html" class="active">Suíço</a></div></div>
</header>
<div class="wrap hero">
  <div class="kick">Sistema suíço</div>
  <h1>Torneio <span class="lime">suíço</span>.</h1>
  <p>Sem eliminação: a cada rodada, atletas de desempenho parecido se enfrentam. Vence quem somar mais pontos.</p>
</div>
<div class="wrap" style="padding-bottom:50px">
  <div class="ctrls"><div style="min-width:240px"><label>Torneio</label><select id="cat"></select></div><button class="btn sm ghost" id="reload">Atualizar</button></div>
  <div id="conteudo"></div>
</div>
<footer class="app">AGRO OPEN · Sistema suíço gerido pela plataforma <b class="lime">SetPoint</b>.</footer>
<script>
const $=s=>document.querySelector(s);
async function listar(){
  try{
    const list=await (await fetch('/api/suicos')).json();
    if(!list.length){ $('#conteudo').innerHTML='<div class="card" style="padding:30px"><p class="muted">Nenhum torneio suíço publicado ainda.</p></div>'; $('#cat').innerHTML=''; return; }
    $('#cat').innerHTML=list.map(l=>`<option value="${l.categoria}">${l.categoria} (${l.atletas} atletas · ${l.rodadas} rod.)</option>`).join('');
    ver();
  }catch(e){ $('#conteudo').innerHTML='<div class="card" style="padding:30px"><p class="muted">Inicie o servidor (npm start) para ver.</p></div>'; }
}
async function ver(){
  const cat=$('#cat').value; if(!cat) return;
  const d=await (await fetch('/api/suico/'+encodeURIComponent(cat))).json();
  let html='<h3 style="font-size:18px;margin-bottom:10px">Classificação</h3><div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>#</th><th>Atleta</th><th>J</th><th>V</th><th>D</th><th>Pts</th></tr></thead><tbody>'+
    d.tabela.map(p=>`<tr class="${p.pos===1?'pos1 toprow':''}"><td class="pos">${p.pos}</td><td><b>${p.nome}</b></td><td>${p.j}</td><td>${p.v}</td><td>${p.d}</td><td><b style="color:var(--lime)">${p.pontos}</b></td></tr>`).join('')+'</tbody></table></div>';
  d.rounds.forEach((jogos,i)=>{
    html+=`<h3 style="font-size:16px;margin:20px 0 8px">Rodada ${i+1}</h3>`;
    html+=jogos.map(g=>g.tipo==='bye'?`<div class="jogo"><span>${g.a}</span><span class="muted">BYE</span></div>`:`<div class="jogo"><span class="${g.vencedor===g.a?'win':''}">${g.a}</span><b>${g.placar||'vs'}</b><span class="${g.vencedor===g.b?'win':''}">${g.b}</span></div>`).join('');
  });
  $('#conteudo').innerHTML=html;
}
$('#cat').onchange=ver; $('#reload').onclick=listar;
listar();
</script>
</body>
</html>
