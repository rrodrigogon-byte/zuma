<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Agro Open</title>
<link rel="icon" href="img/logo-ao-oficial.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
  .item .nm{font-weight:600}.item .pc{font-size:13px;color:var(--muted)}
  .qbtn{display:flex;align-items:center;gap:10px}
  .qbtn button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--deep2);color:var(--lime);font-size:18px;cursor:pointer}
  .cart{position:sticky;bottom:0;background:rgba(7,22,13,.96);border-top:1px solid var(--line);padding:14px 0;margin-top:20px}
  .cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:18px 0 4px}
</style>
</head>
<body>
<header class="app">
  <div class="wrap"><a href="index.html" class="brand"><span class="ball"></span>AGRO <span class="lime">OPEN</span></a>
  <div class="navlinks"><span class="muted" id="ctx"></span></div></div>
</header>

<div class="wrap hero">
  <div class="kick">Bar &amp; Restaurante</div>
  <h1>Cardápio <span class="lime">digital</span>.</h1>
  <p id="sub">Monte seu pedido e envie direto para o bar.</p>
</div>

<div class="wrap" id="vbox" style="margin-bottom:10px"></div>
<div class="wrap" id="menu" style="padding-bottom:120px"></div>

<div class="cart" id="cart" style="display:none"><div class="wrap" style="display:flex;align-items:center;gap:14px">
  <div style="flex:1"><b id="c-itens">0 itens</b> · <span class="lime" id="c-total">R$ 0</span></div>
  <button class="btn" id="enviar">Enviar pedido</button>
</div></div>

<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);};
const params=new URLSearchParams(location.search); const mesa=params.get('mesa');
let CARDAPIO=[], cart={}, virtual=null;
$('#ctx').textContent = mesa? ('Mesa '+mesa) : 'Mesa virtual';
const FB=[{id:'chopp',nome:'Chopp 300ml',cat:'Bebidas',preco:12},{id:'burger',nome:'Hambúrguer artesanal',cat:'Cozinha',preco:32},{id:'fritas',nome:'Porção de fritas',cat:'Cozinha',preco:28},{id:'acai',nome:'Açaí 500ml',cat:'Sobremesas',preco:22}];

if(!mesa){
  $('#sub').textContent='Você não está em uma mesa física. Crie sua mesa virtual e seja atendido onde estiver.';
  $('#vbox').innerHTML=`<div class="card"><b>Mesa virtual</b> — receba o atendimento em qualquer ponto do clube.
    <div class="field" style="margin-top:10px"><label>Seu nome</label><input id="v-nome" placeholder="Ex.: Rodrigo (quadra 3)"></div>
    <button class="btn sm" id="v-geo">📍 Usar minha localização</button> <span class="muted" id="v-geostat" style="font-size:12px"></span></div>`;
  $('#v-geo').onclick=()=>{ if(!navigator.geolocation){toast('GPS indisponível',true);return;} navigator.geolocation.getCurrentPosition(p=>{virtual={lat:p.coords.latitude,lng:p.coords.longitude};$('#v-geostat').textContent='Localização OK ✓';},()=>toast('Não foi possível obter o GPS',true)); };
}

(async()=>{ try{CARDAPIO=await (await fetch('/api/cardapio')).json();}catch(e){CARDAPIO=FB;} render(); })();
function render(){
  const cats=[...new Set(CARDAPIO.map(p=>p.cat))];
  $('#menu').innerHTML=cats.map(cat=>`<div class="cat">${cat}</div>`+CARDAPIO.filter(p=>p.cat===cat).map(p=>{const q=cart[p.id]||0;return `<div class="item"><div><div class="nm">${p.nome}${p.cozinha?' 🍳':''}</div><div class="pc">R$ ${p.preco.toFixed(2).replace('.',',')}</div></div><div class="qbtn"><button data-m="${p.id}">−</button><b>${q}</b><button data-p="${p.id}">+</button></div></div>`;}).join('')).join('');
  const n=Object.values(cart).reduce((a,b)=>a+b,0), tot=Object.entries(cart).reduce((s,[id,q])=>s+(CARDAPIO.find(p=>p.id===id).preco*q),0);
  $('#cart').style.display=n?'block':'none'; $('#c-itens').textContent=n+(n===1?' item':' itens'); $('#c-total').textContent='R$ '+tot.toFixed(2).replace('.',',');
}
$('#menu').addEventListener('click',e=>{const a=e.target.closest('button');if(!a)return;const id=a.dataset.p||a.dataset.m;if(a.dataset.p)cart[id]=(cart[id]||0)+1;else if(cart[id])cart[id]--;if(cart[id]===0)delete cart[id];render();});
$('#enviar').onclick=async()=>{
  const itens=Object.entries(cart).map(([produtoId,qtd])=>({produtoId,qtd}));
  if(!itens.length)return;
  try{
    let d;
    if(mesa){ d=await (await fetch('/api/mesa/'+mesa+'/pedir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itens})})).json(); }
    else { const nome=($('#v-nome').value||'').trim(); if(!nome){toast('Informe seu nome',true);return;} d=await (await fetch('/api/mesa-virtual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,lat:virtual?.lat,lng:virtual?.lng,itens})})).json(); }
    toast(d.message||'Pedido enviado!'); cart={}; render();
  }catch(e){ toast('Sem servidor ativo — rode npm start.',true); }
};
</script>
</body>
</html>
