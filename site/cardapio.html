<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Agro Open</title>
<meta name="description" content="Cardápio digital do bar e restaurante do Agro Open. Peça direto da mesa.">
<link rel="icon" href="img/logo-ao-oficial.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* ── Identidade restaurante ── */
  body{background:#07120d}
  .rest-hero{background:linear-gradient(180deg,#0a1f13 0%,#07120d 100%);border-bottom:1px solid var(--line);padding:32px 0 24px;margin-bottom:0}

  /* ── Filter chips ── */
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:18px 0 10px;position:sticky;top:0;z-index:10;background:#07120d;border-bottom:1px solid var(--line);margin-bottom:18px}
  .chip{padding:7px 16px;border-radius:30px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;background:transparent;color:var(--muted);white-space:nowrap}
  .chip:hover{border-color:var(--lime);color:var(--lime)}
  .chip.active{background:linear-gradient(90deg,var(--green),rgba(95,179,53,.7));border-color:var(--green);color:#fff}
  .chip .emoji{margin-right:5px}

  /* ── Seção de categoria ── */
  .cat-section{margin-bottom:32px}
  .cat-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .cat-emoji{font-size:28px;line-height:1}
  .cat-header h2{font-family:'Archivo',sans-serif;font-size:20px;font-weight:900;margin:0}
  .cat-header span{font-size:12px;color:var(--muted)}

  /* ── Cards de produto ── */
  .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .prod-card{background:linear-gradient(165deg,#0d2118,#091912);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:.2s;cursor:pointer}
  .prod-card:hover:not(.unavailable){transform:translateY(-3px);box-shadow:0 10px 30px -12px rgba(0,0,0,.6);border-color:rgba(95,179,53,.3)}
  .prod-card.unavailable{opacity:.55;cursor:default}
  .prod-card.in-cart{border-color:var(--lime);box-shadow:0 0 0 1px rgba(95,179,53,.25)}
  .prod-img{height:90px;background:linear-gradient(135deg,#0f2d1a,#0a1f13);display:flex;align-items:center;justify-content:center;font-size:44px}
  .prod-body{padding:12px 14px;flex:1;display:flex;flex-direction:column}
  .prod-name{font-weight:700;font-size:14px;margin-bottom:4px;line-height:1.3}
  .prod-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .badge-kit{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px}
  .badge-coz{background:rgba(201,166,86,.2);color:#C9A656}
  .badge-indis{background:rgba(150,150,150,.2);color:#999}
  .prod-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
  .prod-preco{font-family:'Archivo',sans-serif;font-weight:900;font-size:17px;color:#fff}

  /* ── Controles de quantidade ── */
  .qty-ctrl{display:flex;align-items:center;gap:6px}
  .qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--deep2);color:var(--lime);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.1s;flex-shrink:0}
  .qty-btn:hover{background:rgba(95,179,53,.2);border-color:var(--lime)}
  .qty-num{font-weight:700;font-size:14px;min-width:20px;text-align:center}

  /* ── Carrinho ── */
  .cart-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(7,18,13,.97);border-top:1px solid rgba(95,179,53,.35);padding:12px 0;z-index:20;transform:translateY(100%);transition:.3s;backdrop-filter:blur(8px)}
  .cart-bar.show{transform:translateY(0)}
  .cart-inner{display:flex;align-items:center;gap:14px}
  .cart-count{background:var(--lime);color:#0E2E1C;font-family:'Archivo',sans-serif;font-weight:900;font-size:13px;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .cart-info{flex:1}
  .cart-info strong{font-size:14px;display:block}
  .cart-info span{font-size:12px;color:var(--muted)}

  /* ── Modal de pedido ── */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;backdrop-filter:blur(5px)}
  .modal.show{display:flex}
  .modal .card{max-width:480px;width:100%;position:relative;max-height:90vh;overflow-y:auto;animation:popIn .2s ease}
  @keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-close{position:absolute;top:14px;right:18px;font-size:24px;color:var(--muted);cursor:pointer}
  .modal-close:hover{color:#fff}

  .pedido-resumo{background:rgba(14,46,28,.5);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
  .pedido-linha{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
  .pedido-linha:last-child{border:none;font-weight:700;color:var(--lime);padding-top:10px}

  .mesa-badge{display:flex;align-items:center;gap:10px;background:rgba(95,179,53,.12);border:1px solid rgba(95,179,53,.3);border-radius:10px;padding:10px 14px;margin-bottom:14px}
  .mesa-badge .icon{font-size:20px}
  .mesa-badge strong{font-size:15px}
  .mesa-badge span{font-size:12px;color:var(--muted);display:block}

  .success-pedido{text-align:center;padding:20px 0}
  .success-pedido .icon{font-size:52px;display:block;margin-bottom:12px}

  /* ── QR code ── */
  .qr-section{text-align:center;background:var(--deep2);border:1px solid var(--line);border-radius:14px;padding:20px;margin:20px 0}
  .qr-section img{width:140px;height:140px;border-radius:8px}
  .qr-section p{font-size:12px;color:var(--muted);margin:8px 0 0}

  /* ── Mesa virtual ── */
  .vmesa-card{background:linear-gradient(165deg,var(--panel),var(--deep2));border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}

  /* ── Marcador de contexto ── */
  .ctx-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(95,179,53,.15);border:1px solid rgba(95,179,53,.3);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;color:var(--lime)}
</style>
</head>
<body>

<header class="app">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="ball"></span>AGRO <span class="lime">OPEN</span></a>
    <div class="navlinks">
      <span id="ctx-header"></span>
    </div>
  </div>
</header>

<div class="rest-hero">
  <div class="wrap">
    <div class="kick">Bar &amp; Restaurante</div>
    <h1>Cardápio <span class="lime">digital</span>.</h1>
    <p id="sub-txt" style="margin-bottom:14px">Monte seu pedido e envie direto para o bar.</p>
    <span class="ctx-pill" id="mesa-pill">🍽️ Mesa virtual</span>
  </div>
</div>

<div class="wrap">

  <!-- Mesa virtual (quando sem ?mesa=) -->
  <div id="vbox"></div>

  <!-- QR code de pedido -->
  <div class="qr-section" id="qr-section" style="display:none">
    <div style="font-size:13px;font-weight:700;margin-bottom:10px;color:var(--muted)">Compartilhe o link da sua mesa</div>
    <div id="qr-img"></div>
    <p id="qr-txt"></p>
  </div>

  <!-- Chips de categoria -->
  <div class="chips" id="chips">
    <button class="chip active" data-cat="">🍽️ <span>Todos</span></button>
  </div>

  <!-- Itens do menu -->
  <div id="menu" style="padding-bottom:100px"></div>

</div>

<!-- Barra do carrinho -->
<div class="cart-bar" id="cart-bar">
  <div class="wrap cart-inner">
    <div class="cart-count" id="cart-count">0</div>
    <div class="cart-info">
      <strong id="cart-summary">0 itens</strong>
      <span class="lime" id="cart-total">R$ 0,00</span>
    </div>
    <button class="btn" id="btn-pedir">Pedir para a mesa</button>
  </div>
</div>

<!-- Modal de pedido -->
<div class="modal" id="modal">
  <div class="card">
    <span class="modal-close" id="m-close">&times;</span>
    <div class="kick" style="margin-bottom:6px">Pedido</div>
    <h2 style="font-size:20px;margin-bottom:14px">Confirmar pedido</h2>

    <div class="mesa-badge" id="m-mesa-info">
      <span class="icon">🍽️</span>
      <div><strong id="m-mesa-nome"></strong><span id="m-mesa-detalhe"></span></div>
    </div>

    <div id="m-form-area">
      <div id="m-nome-area" style="display:none">
        <div class="field"><label>Seu nome</label><input id="p-nome" placeholder="Ex.: João (quadra 3)"></div>
      </div>

      <div class="pedido-resumo" id="pedido-resumo"></div>

      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn" id="m-confirm" style="flex:1;justify-content:center">Confirmar pedido</button>
        <button class="btn ghost" id="m-cancel">Cancelar</button>
      </div>
    </div>

    <div class="success-pedido" id="m-success" style="display:none">
      <span class="icon">🎉</span>
      <h3>Pedido enviado!</h3>
      <p class="muted" id="m-success-txt"></p>
      <p class="muted" style="font-size:12px;margin-top:8px">Prepare-se para a chegada do pedido.</p>
    </div>
  </div>
</div>

<footer class="app">AGRO OPEN · Bar &amp; Restaurante · powered by <b class="lime">SetPoint</b></footer>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const toast=(m,e)=>{const t=$('#toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);};

const CAT_EMOJI={Bebidas:'🍺',Cozinha:'🍳',Chapa:'🥩',Sobremesas:'🍮',default:'🍽️'};
const params=new URLSearchParams(location.search);
const mesa=params.get('mesa');
let CARDAPIO=[], cart={}, virtualData=null;
let filtroAtivo='';

// Exibir contexto de mesa
if(mesa){
  $('#ctx-header').innerHTML=`<span class="ctx-pill">Mesa ${mesa}</span>`;
  $('#mesa-pill').textContent='🍽️ Mesa '+mesa;
  $('#sub-txt').textContent=`Você está na Mesa ${mesa}. Monte seu pedido e envie!`;
} else {
  $('#ctx-header').innerHTML='<span style="color:var(--muted);font-size:13px">Mesa virtual</span>';
}

// Mesa virtual
if(!mesa){
  $('#vbox').innerHTML=`<div class="vmesa-card">
    <b>Mesa virtual</b> — receba atendimento em qualquer ponto do clube.
    <div class="field" style="margin-top:12px"><label>Seu nome / localização</label><input id="v-nome" placeholder="Ex.: João Silva (quadra 3)"></div>
    <button class="btn sm" id="v-geo" style="margin-top:4px">📍 Usar minha localização GPS</button>
    <span class="muted" id="v-geostat" style="font-size:12px;margin-left:10px"></span>
  </div>`;
  $('#v-geo').onclick=()=>{
    if(!navigator.geolocation){toast('GPS indisponível',true);return;}
    navigator.geolocation.getCurrentPosition(p=>{
      virtualData={lat:p.coords.latitude,lng:p.coords.longitude};
      $('#v-geostat').textContent='📍 Localização capturada ✓';
    },()=>toast('Não foi possível obter o GPS',true));
  };
}

// QR code de mesa
if(mesa && typeof QRCode==='undefined'){
  const url=`${location.origin}${location.pathname}?mesa=${mesa}`;
  $('#qr-section').style.display='block';
  $('#qr-txt').textContent=`Compartilhe este link com a sua mesa: ${url}`;
  try{
    fetch('/api/qrcode?url='+encodeURIComponent(url))
      .then(r=>r.json())
      .then(d=>{ if(d.qr)$('#qr-img').innerHTML=`<img src="${d.qr}" alt="QR code mesa">`; })
      .catch(()=>{});
  }catch(e){}
}

const FB=[
  {id:'chopp',nome:'Chopp 300ml',cat:'Bebidas',preco:12,cozinha:false},
  {id:'agua',nome:'Água mineral',cat:'Bebidas',preco:5,cozinha:false},
  {id:'suco',nome:'Suco de fruta',cat:'Bebidas',preco:10,cozinha:false},
  {id:'burger',nome:'Hambúrguer artesanal',cat:'Cozinha',preco:32,cozinha:true},
  {id:'fritas',nome:'Porção de fritas',cat:'Cozinha',preco:28,cozinha:true},
  {id:'misto',nome:'Misto quente',cat:'Chapa',preco:16,cozinha:false},
  {id:'pao-ovo',nome:'Pão com ovo',cat:'Chapa',preco:12,cozinha:false},
  {id:'acai',nome:'Açaí 500ml',cat:'Sobremesas',preco:22,cozinha:false},
  {id:'sorvete',nome:'Sorvete bola',cat:'Sobremesas',preco:8,cozinha:false},
];

(async()=>{ try{CARDAPIO=await (await fetch('/api/cardapio')).json();}catch(e){CARDAPIO=FB;} renderChips(); render(); })();

function renderChips(){
  const cats=[...new Set(CARDAPIO.map(p=>p.cat))];
  const todos=`<button class="chip ${filtroAtivo===''?'active':''}" data-cat="">🍽️ Todos</button>`;
  const catChips=cats.map(c=>`<button class="chip ${filtroAtivo===c?'active':''}" data-cat="${c}">${CAT_EMOJI[c]||'🍽️'} ${c}</button>`).join('');
  $('#chips').innerHTML=todos+catChips;
  $$('.chip').forEach(c=>c.onclick=()=>{ filtroAtivo=c.dataset.cat; renderChips(); render(); });
}

function render(){
  const lista=filtroAtivo?CARDAPIO.filter(p=>p.cat===filtroAtivo):CARDAPIO;
  const cats=filtroAtivo?[filtroAtivo]:[...new Set(lista.map(p=>p.cat))];
  $('#menu').innerHTML=cats.map(cat=>{
    const itens=lista.filter(p=>p.cat===cat);
    return `<div class="cat-section">
      <div class="cat-header">
        <span class="cat-emoji">${CAT_EMOJI[cat]||'🍽️'}</span>
        <h2>${cat}</h2>
        <span>${itens.length} ite${itens.length!==1?'ns':'m'}</span>
      </div>
      <div class="items-grid">
        ${itens.map(p=>{
          const indis=p.indisponivel||p.disponivel===false;
          const q=cart[p.id]||0;
          return `<div class="prod-card ${indis?'unavailable':''} ${q>0?'in-cart':''}">
            <div class="prod-img">${CAT_EMOJI[p.cat]||'🍽️'}</div>
            <div class="prod-body">
              <div class="prod-name">${p.nome}</div>
              <div class="prod-badges">
                ${p.cozinha?`<span class="badge-kit badge-coz">🍳 Cozinha</span>`:''}
                ${indis?`<span class="badge-kit badge-indis">Indisponível</span>`:''}
              </div>
              <div class="prod-footer">
                <span class="prod-preco">R$ ${p.preco.toFixed(2).replace('.',',')}</span>
                ${indis?'<span style="font-size:11px;color:var(--muted)">Esgotado</span>':`
                  <div class="qty-ctrl">
                    <button class="qty-btn" data-m="${p.id}">−</button>
                    <span class="qty-num">${q}</span>
                    <button class="qty-btn" data-p="${p.id}">+</button>
                  </div>`}
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  atualizarCart();
}

$('#menu').addEventListener('click',e=>{
  const a=e.target.closest('button[data-p],button[data-m]'); if(!a) return;
  const id=a.dataset.p||a.dataset.m;
  if(a.dataset.p) cart[id]=(cart[id]||0)+1;
  else if(cart[id]) cart[id]--;
  if(cart[id]===0) delete cart[id];
  render();
});

function atualizarCart(){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  const tot=Object.entries(cart).reduce((s,[id,q])=>s+(CARDAPIO.find(p=>p.id===id)?.preco||0)*q,0);
  $('#cart-bar').classList.toggle('show',n>0);
  $('#cart-count').textContent=n;
  $('#cart-summary').textContent=n+(n===1?' item':' itens');
  $('#cart-total').textContent='R$ '+tot.toFixed(2).replace('.',',');
}

$('#btn-pedir').onclick=()=>{
  const itens=Object.entries(cart).map(([id,q])=>({id,q,item:CARDAPIO.find(p=>p.id===id)}));
  if(!itens.length) return;
  const tot=itens.reduce((s,{id,q})=>s+(CARDAPIO.find(p=>p.id===id)?.preco||0)*q,0);

  if(mesa){
    $('#m-mesa-nome').textContent='Mesa '+mesa;
    $('#m-mesa-detalhe').textContent='Pedido para a mesa';
    $('#m-nome-area').style.display='none';
  } else {
    $('#m-mesa-nome').textContent='Mesa virtual';
    $('#m-mesa-detalhe').textContent='Atendimento pelo clube';
    $('#m-nome-area').style.display='block';
  }

  $('#pedido-resumo').innerHTML=itens.map(({q,item})=>`
    <div class="pedido-linha"><span>${q}× ${item?.nome}</span><span>R$ ${((item?.preco||0)*q).toFixed(2).replace('.',',')}</span></div>
  `).join('')+`<div class="pedido-linha"><span>Total</span><span>R$ ${tot.toFixed(2).replace('.',',')}</span></div>`;

  $('#m-form-area').style.display='block';
  $('#m-success').style.display='none';
  $('#modal').classList.add('show');
};

$('#m-close').onclick=$('#m-cancel').onclick=()=>$('#modal').classList.remove('show');
$('#modal').onclick=e=>{ if(e.target===$('#modal'))$('#modal').classList.remove('show'); };

$('#m-confirm').onclick=async()=>{
  const itens=Object.entries(cart).map(([produtoId,qtd])=>({produtoId,qtd}));
  if(!itens.length) return;
  try{
    let d;
    if(mesa){
      d=await (await fetch('/api/mesa/'+mesa+'/pedir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({itens})})).json();
    } else {
      const nome=($('#p-nome')?.value||'').trim();
      if(!nome){toast('Informe seu nome',true);return;}
      d=await (await fetch('/api/mesa-virtual',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,lat:virtualData?.lat,lng:virtualData?.lng,itens})})).json();
    }
    $('#m-form-area').style.display='none';
    $('#m-success').style.display='block';
    $('#m-success-txt').textContent=d.message||'Seu pedido foi enviado para o bar!';
    toast('Pedido enviado!');
    cart={}; render();
  }catch(e){ toast('Sem servidor ativo — rode npm start.',true); }
};
</script>
</body>
</html>
