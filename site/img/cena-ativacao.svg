<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F3120"/><stop offset="100%" stop-color="#0B2415"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <rect x="0" y="470" width="800" height="130" fill="#0E2E1C"/>
  <!-- booth -->
  <rect x="180" y="200" width="440" height="270" rx="8" fill="#123A23" stroke="#5FB335" stroke-width="2"/>
  <!-- canopy -->
  <polygon points="150,200 650,200 600,150 200,150" fill="#5FB335"/>
  <polygon points="150,200 650,200 600,150 200,150" fill="#0B2415" opacity="0.15"/>
  <!-- banner -->
  <rect x="230" y="240" width="340" height="80" rx="6" fill="#0B2415"/>
  <text x="400" y="295" text-anchor="middle" font-family="Arial Black, Arial" font-weight="900" font-size="44" fill="#8FD64A">AGRO OPEN</text>
  <!-- counter -->
  <rect x="230" y="380" width="340" height="90" rx="6" fill="#0E2E1C"/>
  <rect x="230" y="380" width="340" height="14" fill="#C7A24C"/>
  <!-- flags -->
  <g stroke="#9DBE86" stroke-width="4"><line x1="180" y1="200" x2="180" y2="120"/><line x1="620" y1="200" x2="620" y2="120"/></g>
  <polygon points="180,120 230,135 180,150" fill="#8FD64A"/>
  <polygon points="620,120 570,135 620,150" fill="#C7A24C"/>
  <!-- ball -->
  <circle cx="400" cy="425" r="20" fill="#A8E25A" stroke="#0B2415" stroke-width="2"/>
</svg>
