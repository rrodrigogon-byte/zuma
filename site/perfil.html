<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil do Atleta · Agro Open</title>
<meta name="description" content="Estatísticas, head-to-head e histórico do atleta.">
<link rel="icon" href="img/logo-ao-oficial.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  .athlete-header{display:flex;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
  .av{width:80px;height:80px;border-radius:50%;background:linear-gradient(165deg,var(--green),#4a991f);display:flex;align-items:center;justify-content:center;font-family:'Archivo';font-weight:900;font-size:34px;color:var(--deep2);flex-shrink:0}
  .athlete-info h2{font-size:28px;margin:0 0 4px}
  .athlete-meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
  .meta-badge{background:rgba(143,214,74,.1);border:1px solid rgba(143,214,74,.25);border-radius:100px;padding:3px 12px;font-size:13px;font-weight:600;color:var(--lime)}
  .meta-badge.gold{background:rgba(201,166,86,.12);border-color:rgba(201,166,86,.3);color:var(--gold)}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:18px 0}
  .stat{background:var(--deep2);border:1px solid var(--line);border-radius:12px;padding:16px 14px;text-align:center}
  .stat .n{font-family:'Archivo';font-weight:900;font-size:28px;color:var(--lime)}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px}
  .res{font-weight:800;border-radius:6px;padding:2px 8px;font-size:12px}
  .res.V{background:rgba(143,214,74,.18);color:var(--lime)} .res.D{background:rgba(226,120,100,.18);color:#e89a8c}
  .tit{display:inline-block;background:rgba(201,166,86,.16);color:var(--gold);border-radius:100px;padding:4px 12px;font-size:13px;font-weight:700;margin:3px}
  .section-title{font-size:16px;font-weight:700;margin:0 0 12px}
  .ultimas-table td,.ultimas-table th{vertical-align:middle}
  .date-cell{color:var(--muted);font-size:12px;white-space:nowrap}
  .search-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
  .search-row select{min-width:240px}
  .search-row input{min-width:200px;background:var(--deep2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--cream);font-size:14px}
</style>
</head>
<body>
<header class="app">
  <div class="wrap"><a href="index.html" class="brand"><span class="ball"></span>AGRO <span class="lime">OPEN</span></a>
  <div class="navlinks"><a href="index.html">Site</a><a href="ranking.html">Ranking</a><a href="chaves.html">Chaves</a><a href="perfil.html" class="active">Atletas</a></div></div>
</header>

<div class="wrap hero">
  <div class="kick">Atletas</div>
  <h1>Perfil & <span class="lime">head-to-head</span>.</h1>
  <p>Estatísticas, confrontos diretos e histórico de cada atleta nos torneios da Agro Open.</p>
</div>

<div class="wrap" style="padding-bottom:50px">
  <div class="search-row">
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Atleta</label>
      <select id="sel"></select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Buscar</label>
      <input id="busca" type="text" placeholder="Filtrar por nome…">
    </div>
  </div>
  <div id="perfil"></div>
</div>

<footer class="app" style="display:flex;align-items:center;flex-wrap:wrap;gap:10px">AGRO OPEN · Perfis gerados pelos resultados · powered by <b class="lime">SetPoint</b> <span style="display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding-left:18px;border-left:1px solid rgba(255,255,255,.12)"><img src="img/logo-ttc-sm.png" alt="TTC" style="height:28px;width:auto;background:#fff;border-radius:5px;padding:2px 5px"><span style="font-size:11px;color:var(--muted)">Realização<br>Tangará Tênis Clube</span></span></footer>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let allAtletas=[];

function applyFilter(){
  const q=$('#busca').value.trim().toLowerCase();
  const opts=[...($('#sel').querySelectorAll('option'))];
  opts.forEach(o=>{ o.hidden=q&&!o.textContent.toLowerCase().includes(q); });
  const first=opts.find(o=>!o.hidden);
  if(first){ $('#sel').value=first.value; ver(); }
}

async function lista(){
  try{
    const a=await (await fetch('/api/atletas')).json();
    allAtletas=a;
    if(!a.length){ $('#perfil').innerHTML='<div class="card" style="padding:30px"><p class="muted">Ainda não há partidas registradas.</p></div>'; return; }
    $('#sel').innerHTML=a.map(n=>`<option value="${n}">${n}</option>`).join('');
    // URL param
    const params=new URLSearchParams(location.search);
    const nome=params.get('nome');
    if(nome&&a.includes(nome)) $('#sel').value=nome;
    ver();
  }catch(e){ $('#perfil').innerHTML='<div class="card" style="padding:30px"><p class="muted">Inicie o servidor (npm start) para ver os perfis.</p></div>'; }
}

async function ver(){
  const nome=$('#sel').value; if(!nome) return;
  // update URL param without reload
  const url=new URL(location.href); url.searchParams.set('nome',nome); history.replaceState({},'',url);
  let d;
  try{ d=await (await fetch('/api/atleta/'+encodeURIComponent(nome))).json(); }
  catch(e){ $('#perfil').innerHTML='<div class="card" style="padding:30px"><p class="muted">Erro ao carregar perfil.</p></div>'; return; }

  const rkBadge=d.ranking?`<span class="meta-badge">#${d.ranking} Ranking</span>`:'';
  const eloBadge=d.elo?`<span class="meta-badge">Elo ${d.elo}</span>`:'';
  const aprov=d.aproveitamento??0;

  let html=`<div class="card">
    <div class="athlete-header">
      <div class="av">${nome.trim()[0].toUpperCase()}</div>
      <div class="athlete-info">
        <h2>${nome}</h2>
        <div class="athlete-meta">${rkBadge}${eloBadge}</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="n">${d.jogos}</div><div class="l">Jogos</div></div>
      <div class="stat"><div class="n">${d.vitorias}</div><div class="l">Vitórias</div></div>
      <div class="stat"><div class="n">${d.derrotas}</div><div class="l">Derrotas</div></div>
      <div class="stat"><div class="n">${aprov}%</div><div class="l">Aproveitamento</div></div>
      <div class="stat"><div class="n">${d.torneios??'—'}</div><div class="l">Torneios</div></div>
    </div>`;

  if(d.titulos&&d.titulos.length) html+=`<div style="margin-top:6px">${d.titulos.map(t=>`<span class="tit">🏆 ${t.categoria}</span>`).join('')}</div>`;
  html+='</div>';

  html+='<div class="grid2" style="align-items:start;margin-top:16px">';

  // H2H
  html+=`<div class="card"><h3 class="section-title">Head-to-head</h3><div style="overflow:auto"><table><thead><tr><th>Adversário</th><th>V</th><th>D</th></tr></thead><tbody>`;
  if(d.headToHead&&d.headToHead.length){
    html+=d.headToHead.map(h=>`<tr>
      <td><b><a href="perfil.html?nome=${encodeURIComponent(h.adversario)}" style="color:inherit;text-decoration:none">${h.adversario}</a></b></td>
      <td style="color:var(--lime)">${h.v}</td>
      <td style="color:#e89a8c">${h.d}</td>
    </tr>`).join('');
  } else { html+='<tr><td colspan="3" class="muted" style="padding:16px">Sem confrontos.</td></tr>'; }
  html+='</tbody></table></div></div>';

  // Últimas partidas
  const hist=d.historico||[];
  const ultimas=hist.slice(0,5);
  html+=`<div class="card"><h3 class="section-title">Últimas 5 partidas</h3><div style="overflow:auto"><table class="ultimas-table"><thead><tr><th>Data</th><th>Adversário</th><th>Placar</th><th>Res.</th></tr></thead><tbody>`;
  if(ultimas.length){
    html+=ultimas.map(h=>`<tr>
      <td class="date-cell">${h.data||h.fonte||'—'}</td>
      <td><a href="perfil.html?nome=${encodeURIComponent(h.adversario)}" style="color:inherit;text-decoration:none">${h.adversario}</a></td>
      <td>${h.placar||'—'}</td>
      <td><span class="res ${h.resultado}">${h.resultado}</span></td>
    </tr>`).join('');
  } else { html+='<tr><td colspan="4" class="muted" style="padding:16px">Sem histórico.</td></tr>'; }
  html+='</tbody></table></div></div>';
  html+='</div>';

  $('#perfil').innerHTML=html;
}

$('#sel').onchange=ver;
$('#busca').oninput=applyFilter;
lista();
</script>
</body>
</html>
