version: '3.8'

services:
  # ============================================================================
  # POSTGRESQL
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: setpoint-postgres
    environment:
      POSTGRES_DB: setpoint_ultra
      POSTGRES_USER: setpoint
      POSTGRES_PASSWORD: setpoint_secure_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setpoint"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - setpoint-network

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: setpoint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - setpoint-network

  # ============================================================================
  # API BACKEND
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: setpoint-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: setpoint_ultra
      DB_USER: setpoint
      DB_PASSWORD: setpoint_secure_password_change_in_prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      FOCUS_API_KEY: ${FOCUS_API_KEY}
      STONE_API_KEY: ${STONE_API_KEY}
      CIELO_MERCHANT_ID: ${CIELO_MERCHANT_ID}
      CIELO_MERCHANT_KEY: ${CIELO_MERCHANT_KEY}
      PAGBANK_TOKEN: ${PAGBANK_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - setpoint-network
    restart: unless-stopped

  # ============================================================================
  # FRONTEND REACT (OPCIONAL)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: setpoint-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules
    networks:
      - setpoint-network
    restart: unless-stopped

  # ============================================================================
  # NGINX (REVERSE PROXY - OPCIONAL)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: setpoint-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - setpoint-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  setpoint-network:
    driver: bridge
